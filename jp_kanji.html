        .mastered { opacity: 0.35; background-color: #f8fafc !important; }

        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #059669; }
        .tab-active { color: #059669; border-bottom: 3px solid #059669; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        let masteredIds = [];
        let kanjiScores = {};
        let currentTab = 'n5';
        let hideMastered = false;
        let currentFCKanji = null;

        function init() {
            masteredIds = JSON.parse(localStorage.getItem('kanji_mastery') || '[]');
            kanjiScores = JSON.parse(localStorage.getItem('kanji_scores') || '{}');
            hideMastered = localStorage.getItem('learning_jp_hide_mastered') === 'true';
            
            updateHideUI();
            renderKanji();
            updateProgress();

            document.getElementById('toggle-hide').onclick = () => {
                hideMastered = !hideMastered;
                localStorage.setItem('learning_jp_hide_mastered', hideMastered);
                updateHideUI();
            };

            document.getElementById('reset-progress').onclick = () => {
                document.getElementById('confirm-modal').style.display = 'flex';
            };
        }

        function updateHideUI() {
            document.body.classList.toggle('hide-mastered', hideMastered);
            document.getElementById('toggle-label').innerText = hideMastered ? '顯示已掌握' : '隱藏已掌握';
            document.getElementById('toggle-icon').innerText = hideMastered ? '👁️‍🗨️' : '👁️';
        }

        function renderKanji() {
            const body = document.getElementById('kanji-body');
            const data = kanjiData[currentTab];
            if (!data) return;

            body.innerHTML = data.map(k => {
                const isM = masteredIds.includes(k.id);
                const score = kanjiScores[k.id] || 0;
                return `
                    <tr class="grammar-card ${isM ? 'mastered is-mastered' : ''}" data-id="${k.id}">
                        <td class="p-4 text-center">
                            <input type="checkbox" class="custom-checkbox" ${isM ? 'checked' : ''} onclick="toggleMastered('${k.id}')">
                        </td>
                        <td class="p-4 text-center japanese-text font-black text-3xl text-emerald-700">${k.kanji}</td>
                        <td class="p-4 text-center">
                            <p class="font-bold text-slate-700">${k.meaning}</p>
                            <div class="flex justify-center gap-1 mt-1">
                                <span class="px-2 py-0.5 bg-slate-100 text-slate-400 text-[10px] rounded font-black">${k.level}</span>
                                <span class="px-2 py-0.5 ${score > 0 ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-300'} text-[10px] rounded font-black">⚡ ${score}/10</span>
                            </div>
                        </td>
                        <td class="p-4 text-slate-600 japanese-text">${k.example}</td>
                    </tr>
                `;
            }).join('');
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) {
                masteredIds.splice(index, 1);
            } else {
                masteredIds.push(id);
            }
            saveAndRefresh(id);
        }

        function saveAndRefresh(id) {
            localStorage.setItem('kanji_mastery', JSON.stringify(masteredIds));
            localStorage.setItem('kanji_scores', JSON.stringify(kanjiScores));
            localStorage.setItem('learning_jp_last_modified', Date.now());

            if (id) {
                const el = document.querySelector(`[data-id="${id}"]`);
                if (el) {
                    const isM = masteredIds.includes(id);
                    el.classList.toggle('is-mastered', isM);
                    el.classList.toggle('mastered', isM);
                    const cb = el.querySelector('input[type="checkbox"]');
                    if (cb) cb.checked = isM;
                }
            } else if (currentTab !== 'fc') {
                renderKanji();
            }

            updateProgress();
            if (window.triggerAutoSync) triggerAutoSync();
        }

        function updateProgress() {
            const allKanji = Object.values(kanjiData).flat();
            const total = allKanji.length;
            const current = masteredIds.length;
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('text-slate-400');
            });
            document.getElementById(`tab-btn-${tab}`).classList.add('tab-active');
            
            if (tab === 'fc') {
                document.getElementById('kanji-list-section').classList.add('hidden');
                document.getElementById('section-flashcard').classList.remove('hidden');
                loadNextKanjiFC();
            } else {
                document.getElementById('kanji-list-section').classList.remove('hidden');
                document.getElementById('section-flashcard').classList.add('hidden');
                renderKanji();
            }
        }

        function loadNextKanjiFC() {
            const allUnmastered = Object.values(kanjiData).flat().filter(k => !masteredIds.includes(k.id));
            if (allUnmastered.length === 0) {
                document.getElementById('fc-kanji').innerText = '🎉';
                document.getElementById('fc-meaning').innerText = '恭喜！所有漢字已掌握！';
                document.getElementById('fc-example').innerText = '';
                document.getElementById('fc-feedback').classList.remove('hidden');
                document.getElementById('fc-controls').classList.add('hidden');
                document.getElementById('fc-score').innerText = '-';
                return;
            }

            currentFCKanji = allUnmastered[Math.floor(Math.random() * allUnmastered.length)];
            const score = kanjiScores[currentFCKanji.id] || 0;
            document.getElementById('fc-score').innerText = score;

            document.getElementById('fc-kanji').innerText = currentFCKanji.kanji;
            document.getElementById('fc-level-badge').innerText = currentFCKanji.level;
            document.getElementById('fc-meaning').innerText = currentFCKanji.meaning;
            document.getElementById('fc-example').innerHTML = currentFCKanji.example;
            
            document.getElementById('fc-feedback').classList.add('hidden');
            document.getElementById('fc-answer-btn').classList.remove('hidden');
            document.getElementById('fc-result-btns').classList.add('hidden');
            document.getElementById('fc-controls').classList.remove('hidden');
        }

        function showFCAnswer() {
            document.getElementById('fc-feedback').classList.remove('hidden');
        }

        function submitKanjiFC(action) {
            const id = currentFCKanji.id;
            let score = kanjiScores[id] || 0;

            if (action === 'mastered') {
                score += 5;
            } else if (action === 'retry') {
                score = Math.floor(score / 2);
            }

            kanjiScores[id] = score;
            if (score >= 10 && !masteredIds.includes(id)) {
                masteredIds.push(id);
            }
            
            saveAndRefresh();
            loadNextKanjiFC();
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmReset() { masteredIds = []; kanjiScores = {}; saveAndRefresh(); closeModal(); }

        window.onload = init;
    </script>
    <footer class="bg-slate-100 border-t border-slate-200 py-12 mt-20">
        <div class="container mx-auto px-4 max-w-4xl text-center">
            <p class="text-slate-400 text-xs italic">© 2026 Meow! 日本語達陣學習計畫</p>
        </div>
    </footer>
    <script src="assets/js/sync-service.js"></script>
</body>
