<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow! 日本語達陣 - 漢字挑戰全攻略</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; }
        ruby rt { font-size: 0.5em; color: #059669; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #f8fafc !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #059669; }
        .tab-active { color: #059669; border-bottom: 3px solid #059669; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <header class="bg-emerald-600 text-white py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl font-black mb-1 tracking-tight">Meow! 漢字挑戰全攻略</h1>
        <p class="text-emerald-100 opacity-90 text-sm font-medium">突破 N1-N5 漢字障礙：掌握字義、讀音與用法</p>
    </header>

    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 border border-slate-200 shadow-sm">🏠 首頁</a>
                <div id="sync-wrapper" class="flex items-center gap-2">
                    <button id="sync-progress" disabled class="bg-emerald-50 hover:bg-emerald-100 text-emerald-600 border border-emerald-200 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm">
                        <span>☁️</span> <span id="sync-label">啟用雲端同步</span>
                    </button>
                    <button id="logout-btn" class="hidden text-slate-400 hover:text-red-500 text-[10px] font-bold transition uppercase tracking-tighter">登出</button>
                </div>
                <div class="flex flex-col">
                    <span class="text-[9px] text-slate-400 font-black uppercase tracking-widest">漢字掌握進度</span>
                    <div class="flex items-center gap-2">
                        <div class="w-40 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-emerald-500 transition-all duration-500"></div>
                        </div>
                        <span id="progress-text" class="text-xs font-bold text-emerald-700">0%</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm">
                    <span id="toggle-icon">👁️</span> <span id="toggle-label">隱藏已掌握</span>
                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-5xl">
        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap">
            <button onclick="switchTab('n5')" id="tab-btn-n5" class="tab-btn px-6 py-4 font-bold text-lg tab-active transition">N5 漢字</button>
            <button onclick="switchTab('n4')" id="tab-btn-n4" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-emerald-600 transition">N4 漢字</button>
            <button onclick="switchTab('n3')" id="tab-btn-n3" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-emerald-600 transition">N3 漢字</button>
            <button onclick="switchTab('n2')" id="tab-btn-n2" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-emerald-600 transition">N2 漢字</button>
            <button onclick="switchTab('n1')" id="tab-btn-n1" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-emerald-600 transition">N1 漢字</button>
            <button onclick="switchTab('fc')" id="tab-btn-fc" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-emerald-600 transition font-black">⚡ 漢字挑戰卡</button>
        </div>

        <div id="kanji-list-section" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-200 text-center">
                        <tr>
                            <th class="p-4 w-16 text-center">掌握</th>
                            <th class="p-4 w-32 text-center text-emerald-700">漢字</th>
                            <th class="p-4 w-1/4 text-center">中文意義</th>
                            <th class="p-4 text-center">實戰例句</th>
                        </tr>
                    </thead>
                    <tbody id="kanji-body" class="divide-y divide-slate-100 text-sm"></tbody>
                </table>
            </div>
        </div>

        <div id="section-flashcard" class="hidden animate-fade-in">
            <div class="text-center mb-6">
                <p class="text-emerald-600 font-bold bg-emerald-50 inline-block px-4 py-2 rounded-full border border-emerald-100 shadow-sm">
                    ⚡ 當前漢字積分: <span id="fc-score">0</span> / 10
                </p>
            </div>
            <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl border border-slate-100 overflow-hidden">
                <div class="bg-emerald-600 p-12 text-center text-white relative">
                    <div id="fc-kanji" class="text-8xl font-black mb-4 japanese-text drop-shadow-lg"></div>
                    <div id="fc-front-example" class="text-emerald-100 text-sm font-medium japanese-text italic opacity-90 px-4"></div>
                    <div id="fc-level-badge" class="absolute top-4 right-6 bg-white/20 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest"></div>
                </div>
                <div class="p-8">
                    <div id="fc-feedback" class="hidden mb-8 animate-fade-in">
                        <div class="bg-slate-50 rounded-2xl p-6 border border-slate-100 space-y-4">
                            <div>
                                <p class="text-[10px] text-slate-400 uppercase font-black tracking-widest mb-1">中文意義</p>
                                <p id="fc-meaning" class="text-xl font-bold text-slate-800"></p>
                            </div>
                            <div>
                                <p class="text-[10px] text-slate-400 uppercase font-black tracking-widest mb-1">例句用法</p>
                                <p id="fc-example" class="text-sm text-slate-600 leading-relaxed japanese-text"></p>
                            </div>
                        </div>
                    </div>

                    <div id="fc-controls" class="flex flex-col gap-3">
                        <div class="grid grid-cols-3 gap-3">
                            <button onclick="submitKanjiFC('retry')" class="py-4 bg-slate-100 text-slate-500 rounded-2xl font-bold hover:bg-red-50 hover:text-red-600 transition border border-slate-200 hover:border-red-200 shadow-sm">再來</button>
                            <button id="fc-answer-btn" onclick="showFCAnswer()" class="py-4 bg-emerald-100 text-emerald-700 rounded-2xl font-black hover:bg-emerald-200 transition shadow-sm border border-emerald-200">答案</button>
                            <button onclick="submitKanjiFC('mastered')" class="py-4 bg-emerald-600 text-white rounded-2xl font-black hover:bg-emerald-700 transition shadow-lg shadow-emerald-200">掌握</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Reset Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[2rem] shadow-2xl max-w-sm w-full p-8 text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">🚫</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2">重置漢字進度？</h3>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed">這將清除所有掌握狀態與積分。動作無法復原。</p>
            <div class="flex flex-col gap-3">
                <button onclick="confirmReset()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition shadow-lg shadow-red-200">確定重置</button>
                <button onclick="closeModal()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition">取消返回</button>
            </div>
        </div>
    </div>

    <script src="assets/data/kanji.js"></script>
    <script src="assets/js/kanji-logic.js"></script>
    <footer class="bg-slate-100 border-t border-slate-200 py-12 mt-20">
        <div class="container mx-auto px-4 max-w-4xl text-center">
            <p class="text-slate-400 text-xs italic">© 2026 Meow! 日本語達陣學習計畫</p>
        </div>
    </footer>
    <script src="assets/js/sync-service.js"></script>
</body>
</html>
