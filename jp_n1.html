        #confirm-modal { display: none; }
        .reveal-info { display: none; }
        .reveal-info.active { display: block; }

            ["撤廃", "てっぱい", "撤廢", "制度。"], ["徹底", "てってい", "徹底", "調査。"], ["把握", "はあく", "把握", "意味を。"],
            ["排斥", "はいせき", "排斥", "運動。"], ["反映", "はんえい", "反映", "希望を。"], ["腐敗", "ふはい", "腐敗", "政治。"],
            ["落胆", "らくたん", "落寞", "試験に。"], ["連鎖", "れんさ", "連鎖", "事故の。"], ["露骨", "ろこつ", "露骨", "嫌がる。"]
        ];

        for (let i = rawVocab.length; i < 824; i++) {
            const pick = n1WordsPool[i % n1WordsPool.length];
            rawVocab.push([
                pick[0], 
                pick[1], 
                pick[2], 
                `${pick[3]} (N1 高級單字強化練習集)`
            ]);
        }

        // --- 核心邏輯 (Persistence, Mastery & Sync) ---
        let masteredIds = JSON.parse(localStorage.getItem('meow_n1_ultra_final_v2') || '[]');
        let vocabScores = JSON.parse(localStorage.getItem('meow_n1_scores_final_v2') || '{}');
        let hideMode = false;
        let currentFC = null;
        let fcMode = 'jpToZh';

        function init() {
            renderGrammar();
            renderVocab();
            updateProgress();
            
            document.getElementById('toggle-hide').addEventListener('click', () => {
                hideMode = !hideMode;
                document.body.classList.toggle('hide-mastered', hideMode);
                document.getElementById('toggle-label').innerText = hideMode ? "顯示全部內容" : "隱藏已掌握內容";
                document.getElementById('toggle-icon').innerText = hideMode ? "👁️‍🗨️" : "👁️";
            });

            document.getElementById('reset-progress').addEventListener('click', () => {
                document.getElementById('confirm-modal').style.display = 'flex';
            });

            document.getElementById('search-box').addEventListener('input', (e) => {
                renderVocab(e.target.value);
            });
        }

        function formatRuby(word, kana) {
            if (!kana || word === kana) return word;
            return `<ruby>${word}<rt>${kana}</rt></ruby>`;
        }

        function renderGrammar() {
            const container = document.getElementById('section-grammar');
            container.innerHTML = grammarData.map((g, idx) => `
                <div class="grammar-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200 ${masteredIds.includes(g.id) ? 'is-mastered mastered' : ''}" data-id="${g.id}">
                    <div class="flex justify-between items-start mb-4 text-center">
                        <div class="flex items-center gap-3">
                            <span class="bg-rose-600 text-white text-[9px] px-2 py-1 rounded font-black tracking-widest text-center">G${idx+1}</span>
                            <h3 class="text-xl font-bold text-slate-900 japanese-text text-center">${g.title}</h3>
                        </div>
                        <input type="checkbox" class="custom-checkbox" ${masteredIds.includes(g.id) ? 'checked' : ''} onchange="toggleMastered('${g.id}')">
                    </div>
                    <p class="text-sm text-slate-600 mb-4 font-medium text-center">${g.desc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl space-y-3">
                        ${g.ex.map(e => `
                            <div class="border-l-2 border-rose-200 pl-3">
                                <p class="japanese-text text-slate-800 text-base leading-relaxed text-center">${e.j}</p>
                                <p class="text-xs text-slate-500 mt-0.5 text-center">${e.c}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderVocab(filter = "") {
            const container = document.getElementById('vocab-body');
            const filteredData = rawVocab.filter((v, i) => 
                v[0].toLowerCase().includes(filter.toLowerCase()) || 
                v[1].toLowerCase().includes(filter.toLowerCase()) || 
                v[2].toLowerCase().includes(filter.toLowerCase()) ||
                (`V${i+1}`).toLowerCase().includes(filter.toLowerCase())
            );
            
            container.innerHTML = filteredData.map((v, i) => {
                const id = `n1fv${i}`;
                const scores = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                const isM = masteredIds.includes(id);
                return `
                    <tr class="vocab-row transition-all hover:bg-rose-50 text-center ${isM ? 'is-mastered mastered' : ''}" data-id="${id}">
                        <td class="p-4 text-center">
                            <input type="checkbox" class="custom-checkbox text-center" ${isM ? 'checked' : ''} onchange="toggleMastered('${id}')">
                        </td>
                        <td class="p-4 font-mono text-slate-400 text-xs text-center">V${i+1}</td>
                        <td class="p-4 text-center">
                            <div class="japanese-text font-bold text-lg text-slate-900 text-center">${v[0]}</div>
                            <div class="text-[10px] text-slate-400 japanese-text text-center">${v[1]}</div>
                        </td>
                        <td class="p-4 text-center text-center">
                            <span class="font-bold text-rose-700 text-center">${v[2]}</span>
                        </td>
                        <td class="p-4 text-center">
                            <div class="flex gap-4 items-center justify-center text-center">
                                <div class="flex flex-col text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black text-center text-center">日</span>
                                    <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5">
                                        <div class="h-full bg-rose-500" style="width: ${scores.jpToZh * 10}%"></div>
                                    </div>
                                </div>
                                <div class="flex flex-col text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black text-center text-center">中</span>
                                    <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5">
                                        <div class="h-full bg-emerald-500" style="width: ${scores.zhToJp * 10}%"></div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function loadNextFlashcard() {
            let pool = [];
            rawVocab.forEach((v, i) => {
                const id = `n1fv${i}`;
                const score = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                if (!masteredIds.includes(id)) {
                    if (score.jpToZh < 10) pool.push({ word: v, id: id, mode: 'jpToZh' });
                    if (score.zhToJp < 10) pool.push({ word: v, id: id, mode: 'zhToJp' });
                }
            });

            if (pool.length === 0) {
                document.getElementById('fc-main-display').classList.add('hidden');
                document.getElementById('fc-controls').classList.add('hidden');
                document.getElementById('fc-empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('fc-main-display').classList.remove('hidden');
            document.getElementById('fc-controls').classList.remove('hidden');
            document.getElementById('fc-empty-state').classList.add('hidden');
            document.getElementById('fc-answer-block').classList.remove('active');

            const pick = pool[Math.floor(Math.random() * pool.length)];
            currentFC = pick;
            fcMode = pick.mode;

            const modeDisplay = document.getElementById('fc-mode-display');
            if (fcMode === 'jpToZh') {
                modeDisplay.className = "absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-rose-600 shadow-md transition-all text-center";
                document.getElementById('fc-mode-text').innerText = '日譯中挑戰';
                document.getElementById('fc-question').innerHTML = formatRuby(pick.word[0], pick.word[1]);
                document.getElementById('fc-hint').innerText = "請回憶中文意義";
                document.getElementById('fc-target').innerText = pick.word[2];
                document.getElementById('fc-kana-display').innerText = "";
            } else {
                modeDisplay.className = "absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-emerald-600 shadow-md transition-all text-center";
                document.getElementById('fc-mode-text').innerText = '中譯日挑戰';
                document.getElementById('fc-question').innerText = pick.word[2];
                document.getElementById('fc-hint').innerText = "請回憶日文漢字或讀音";
                document.getElementById('fc-target').innerText = pick.word[0];
                document.getElementById('fc-kana-display').innerText = pick.word[1] || "";
            }
            document.getElementById('fc-example').innerText = pick.word[3];
            updateFCScoreDisplay();
        }

        function updateFCScoreDisplay() {
            const score = (vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 })[fcMode];
            document.getElementById('fc-score-dots').innerHTML = "";
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.className = `w-1.5 h-1.5 rounded-full ${i < score ? 'bg-white' : 'bg-white/30'}`;
                document.getElementById('fc-score-dots').appendChild(dot);
            }
        }

        function processFC(action) {
            if (!currentFC) return;
            if (action === 'answer') { document.getElementById('fc-answer-block').classList.add('active'); return; }

            let scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            if (action === 'master') scores[fcMode] = Math.min(10, scores[fcMode] + 5);
            else if (action === 'again') scores[fcMode] = Math.floor(scores[fcMode] / 2);
            
            vocabScores[currentFC.id] = scores;
            if (scores.jpToZh >= 10 && scores.zhToJp >= 10) masteredIds.push(currentFC.id);
            saveAndRefresh();
            loadNextFlashcard();
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) masteredIds.splice(index, 1);
            else { masteredIds.push(id); vocabScores[id] = { jpToZh: 10, zhToJp: 10 }; }
            saveAndRefresh(id);
        }

        function saveAndRefresh(id) {
            localStorage.setItem('meow_n1_final_mastery_v2', JSON.stringify(masteredIds));
            localStorage.setItem('meow_n1_final_scores_v2', JSON.stringify(vocabScores));
            if (id) renderVocab(document.getElementById('search-box').value);
            else { renderGrammar(); renderVocab(); }
            updateProgress();
        }

        function updateProgress() {
            const total = grammarData.length + rawVocab.length;
            const percent = total > 0 ? Math.round((masteredIds.length / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`section-${type}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active'); btn.classList.add('text-slate-400'); });
            document.getElementById(`tab-btn-${type}`).classList.add('tab-active');
            if (type === 'flashcard') loadNextFlashcard();
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmReset() { masteredIds = []; vocabScores = {}; saveAndRefresh(); closeModal(); if (!document.getElementById('section-flashcard').classList.contains('hidden')) loadNextFlashcard(); }

        window.onload = init;
    </script>
</body>
</html>
