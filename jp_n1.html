<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow! N1 日本語達陣 - 終極全量去重系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; }
        ruby rt { font-size: 0.45em; color: #e11d48; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #fff1f2 !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #e11d48; }
        .tab-active { color: #e11d48; border-bottom: 3px solid #e11d48; }
        .grammar-card { transition: all 0.2s; border-left: 5px solid transparent; }
        .grammar-card:hover { border-left-color: #e11d48; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        .reveal-info { display: none; }
        .reveal-info.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20 text-center">

    <header class="bg-rose-900 text-white py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl font-black mb-1 tracking-tight">Meow! N1 日本語達陣</h1>
        <p class="text-rose-100 opacity-90 text-sm font-medium">最高級別：全方位核心語彙與 105 項完整文法系統</p>
    </header>

    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm text-center">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4 text-center">
            <div class="flex items-center gap-4 text-center">
                <div class="flex flex-col text-center">
                    <span class="text-[9px] text-slate-400 font-black uppercase tracking-widest text-center">N1 總掌握進度</span>
                    <div class="flex items-center gap-2 text-center">
                        <div class="w-40 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-rose-600 transition-all duration-500"></div>
                        </div>
                        <span id="progress-text" class="text-xs font-bold text-rose-700">0%</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm text-center">
                    <span id="toggle-icon">👁️</span> <span id="toggle-label">隱藏已掌握</span>
                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm text-center">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-7xl text-center">
        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap text-center">
            <button onclick="switchTab('grammar')" id="tab-btn-grammar" class="tab-btn px-6 py-4 font-bold text-lg tab-active transition text-center">核心文法 (G1-G105)</button>
            <button onclick="switchTab('vocab')" id="tab-btn-vocab" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-rose-600 transition text-center">全量單字庫 (去重版)</button>
            <button onclick="switchTab('flashcard')" id="tab-btn-flashcard" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-rose-600 transition text-center text-center">雙向智能學習卡</button>
        </div>

        <!-- Grammar Section -->
        <div id="section-grammar" class="tab-content grid grid-cols-1 lg:grid-cols-2 gap-6 text-center"></div>

        <!-- Vocab Section -->
        <div id="section-vocab" class="tab-content hidden text-center">
            <div class="mb-6 relative text-center">
                <input type="text" id="search-box" placeholder="搜尋單字、假名或意思..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-rose-500 outline-none transition shadow-sm text-center">
                <span class="absolute left-4 top-3.5 text-slate-400 text-center">🔍</span>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden text-center text-center">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-center">
                        <thead class="bg-slate-50 border-b border-slate-200 text-center">
                            <tr>
                                <th class="p-4 w-16 text-center">掌握</th>
                                <th class="p-4 w-20 text-center text-rose-600 font-bold border-r">編號</th>
                                <th class="p-4 w-1/5 text-center">單字 / 假名</th>
                                <th class="p-4 w-1/5 text-rose-700 text-center">中文意義</th>
                                <th class="p-4 text-center">實戰例句</th>
                                <th class="p-4 w-24 text-center text-center">雙向積分</th>
                            </tr>
                        </thead>
                        <tbody id="vocab-body" class="divide-y divide-slate-100 text-sm text-center"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Flashcard Section -->
        <div id="section-flashcard" class="tab-content hidden text-center">
            <div class="max-w-lg mx-auto text-center">
                <div id="fc-container" class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-10 min-h-[500px] flex flex-col items-center justify-between text-center relative overflow-hidden transition-all text-center text-center">
                    
                    <!-- Mode & Score Header -->
                    <div id="fc-header" class="absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white shadow-md transition-all text-center">
                        <div class="flex items-center gap-2">
                            <span id="fc-mode-text">模式載入中</span>
                            <span class="bg-white/20 px-2 py-0.5 rounded text-[9px] font-bold text-center">積分: <span id="fc-current-score-text">0</span> / 10</span>
                        </div>
                        <div class="flex gap-1" id="fc-score-dots"></div>
                    </div>

                    <div id="fc-main-display" class="w-full flex-grow flex flex-col items-center justify-center pt-8 text-center text-center">
                        <div id="fc-question" class="japanese-text text-5xl font-black text-slate-900 mb-2 leading-[1.5em] h-[2.5em] flex items-center justify-center text-center text-center"></div>
                        <div id="fc-hint" class="text-slate-400 text-xs font-bold uppercase tracking-tighter h-4 mb-10 text-center text-center"></div>
                        
                        <!-- Answer Block -->
                        <div id="fc-answer-block" class="reveal-info w-full animate-fade-in border-t border-slate-100 pt-6 text-center text-center">
                            <div id="fc-target" class="text-3xl font-bold text-rose-600 mb-2 japanese-text text-center text-center"></div>
                            <div id="fc-kana-display" class="text-slate-500 text-sm mb-6 japanese-text text-center text-center"></div>
                            <div class="bg-rose-50 p-5 rounded-3xl text-left border border-rose-100 text-center text-center">
                                <p class="text-[9px] font-black text-rose-400 uppercase mb-2 text-center text-center">N1 高級範本</p>
                                <p id="fc-example" class="japanese-text text-slate-700 text-base leading-relaxed text-center text-center"></p>
                            </div>
                        </div>
                    </div>

                    <div id="fc-empty-state" class="hidden py-16 text-center">
                        <div class="text-7xl mb-6 text-center text-center">🏁</div>
                        <h3 class="text-2xl font-black text-slate-900 mb-2 text-center text-center">N1 挑戰全量達成</h3>
                        <p class="text-slate-500 text-sm text-center text-center">恭喜！您已掌握目前清單內的所有真實單字。</p>
                    </div>

                    <!-- Controls -->
                    <div id="fc-controls" class="w-full grid grid-cols-3 gap-4 mt-8 text-center text-center">
                        <button onclick="processFC('again')" class="flex flex-col items-center py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-3xl transition-all active:scale-95 text-center text-center">
                            <span class="text-2xl mb-1 text-center text-center">🔄</span><span class="text-[10px] font-black text-center text-center">再來</span>
                        </button>
                        <button onclick="processFC('answer')" id="fc-btn-answer" class="flex flex-col items-center py-4 bg-rose-600 hover:bg-rose-700 text-white rounded-3xl transition-all active:scale-95 shadow-lg shadow-rose-100 text-center text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center">💡</span><span class="text-[10px] font-black text-center text-center text-center">答案</span>
                        </button>
                        <button onclick="processFC('master')" class="flex flex-col items-center py-4 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-3xl transition-all active:scale-95 text-center text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center text-center">✅</span><span class="text-[10px] font-black text-center text-center text-center">掌握</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Reset Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 text-center text-center">
        <div class="bg-white rounded-[2rem] shadow-2xl max-w-sm w-full p-8 text-center text-center text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl text-center text-center text-center">🚫</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2 text-center text-center text-center">重置 N1 進度？</h3>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed text-center text-center text-center">這將清除所有掌握狀態與雙向積分。動作無法復原。</p>
            <div class="flex flex-col gap-3 text-center text-center text-center">
                <button onclick="confirmReset()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition shadow-lg shadow-red-200 text-center text-center text-center">確定重置</button>
                <button onclick="closeModal()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition text-center text-center text-center">取消返回</button>
            </div>
        </div>
    </div>

    <footer class="bg-slate-900 text-slate-500 py-12 px-4 text-center text-center text-center text-center">
        <div class="container mx-auto text-center text-sm text-center text-center text-center">
            <p class="mb-4 text-center text-sm text-center text-center text-center text-center">© 2026 Meow! 日本語達陣學習計畫 - 終極 N1 修正重製版</p>
        </div>
    </footer>

    <script>
        // --- N1 核心文法 (完整補完 G1-G105 + 振假名標註) ---
        const grammarData = [
            { id: 'g1', title: '～がてら', desc: '做 A 的同時順便做 B。', ex: [{j: '<ruby>散歩<rt>さんぽ</rt></ruby>がてら、<ruby>本屋<rt>ほんや</rt></ruby>に<ruby>寄<rt>よ</rt></ruby>った。', c: '散步時順便去了書店。'}]},
            { id: 'g2', title: '～かたがた', desc: '兼任...之便(正式)。', ex: [{j: 'お<ruby>礼<rt>れい</rt></ruby>かたがた、ご<ruby>挨拶<rt>あいさつ</rt></ruby>に<ruby>伺<rt>うかが</rt></ruby>いました。', c: '借道謝之便特地登門拜訪。'}]},
            { id: 'g3', title: '～なり', desc: '剛一...就...。', ex: [{j: '<ruby>帰宅<rt>きたく</rt></ruby>するなり、<ruby>寝<rt>ね</rt></ruby>てしまった。', c: '剛一回家就倒頭大睡。'}]},
            { id: 'g4', title: '～そばから', desc: '剛...又...。', ex: [{j: '<ruby>覚<rt>おぼ</rt></ruby>えるそばから<ruby>忘<rt>わす</rt></ruby>れてしまう。', c: '剛記住又立刻忘了。'}]},
            { id: 'g5', title: '～ずくめ', desc: '全是...。', ex: [{j: '今日はいいことずくめの一日だった。', c: '今天真是好事連連的一天。'}]},
            { id: 'g6', title: '～まみれ', desc: '沾滿...。', ex: [{j: '<ruby>汗<rt>あせ</rt></ruby>まみれになって<ruby>働<rt>はたら</rt></ruby>く。', c: '汗流浹背地工作。'}]},
            { id: 'g7', title: '～めく', desc: '帶有...氣息。', ex: [{j: 'ようやく<ruby>春<rt>はる</rt></ruby>めいてきた。', c: '終於有了春天的氣息。'}]},
            { id: 'g8', title: '～に至るまで', desc: '甚至到...。', ex: [{j: '<ruby>靴<rt>くつ</rt></ruby>に至るまで<ruby>完璧<rt>かんぺき</rt></ruby>な<ruby>装<rt>よそお</rt></ruby>いだ。', c: '甚至連鞋子都穿戴得完美無缺。'}]},
            { id: 'g9', title: '～を限りに', desc: '以此為限。', ex: [{j: '今日を<ruby>限<rt>かぎ</rt></ruby>りにタバコをやめる。', c: '以此日為限戒菸。'}]},
            { id: 'g10', title: '～を皮切りに', desc: '以...為開端。', ex: [{j: '<ruby>東京<rt>とうきょう</rt></ruby>を<ruby>皮切<rt>かわき</rt></ruby>りにツアーが<ruby>始<rt>はじ</rt></ruby>まる。', c: '以東京為起點開始巡迴。'}]},
            { id: 'g11', title: '～をもって', desc: '憑藉 / 到此為止。', ex: [{j: '本日をもって閉店いたします。', c: '今天到此為止結束營業。'}]},
            { id: 'g12', title: '～こととて', desc: '因為...(正式用語)。', ex: [{j: '不<ruby>慣<rt>な</rt></ruby>れなこととて、ご迷惑をおかけしました。', c: '因為還不習慣，造成您的困擾了。'}]},
            { id: 'g13', title: '～ゆえに', desc: '正因為...。', ex: [{j: '<ruby>貧<rt>まず</rt></ruby>しさゆえに<ruby>苦労<rt>くろう</rt></ruby>した。', c: '正因為貧窮所以辛苦。'}]},
            { id: 'g14', title: '～べく', desc: '為了...。', ex: [{j: '<ruby>日本<rt>にほん</rt></ruby>で<ruby>働<rt>はたら</rt></ruby>くべく<ruby>勉強<rt>べんきょう</rt></ruby>している。', c: '為了在日本工作而學習。'}]},
            { id: 'g15', title: '～んがために', desc: '為了(極正式)。', ex: [{j: '<ruby>夢<rt>ゆめ</rt></ruby>を<ruby>叶<rt>かな</rt></ruby>えんがために<ruby>努力<rt>どりょく</rt></ruby>する。', c: '為了實現夢想而努力。'}]},
            { id: 'g16', title: '～はおろか', desc: '別說...就連...。', ex: [{j: '<ruby>挨拶<rt>あいさつ</rt></ruby>はおろか、名前も言えない。', c: '別說打招呼，連名字都不會說。'}]},
            { id: 'g17', title: '～をよそに', desc: '無視...、不顧...。', ex: [{j: '<ruby>周囲<rt>しゅうい</rt></ruby>の<ruby>反対<rt>はんたい</rt></ruby>をよそに結婚した。', c: '無視周圍反對結婚了。'}]},
            { id: 'g18', title: '～にひきかえ', desc: '與...相反(對比)。', ex: [{j: '<ruby>兄<rt>あに</rt></ruby>にひきかえ、<ruby>弟<rt>おとうと</rt></ruby>は<ruby>優秀<rt>ゆうしゅう</rt></ruby>だ。', c: '與哥哥相比，弟弟很優秀。'}]},
            { id: 'g19', title: '～なりに', desc: '對應其身分的。', ex: [{j: '<ruby>子供<rt>こども</rt></ruby>なりに<ruby>考<rt>かんが</rt></ruby>えた。', c: '以小孩的方式思考。'}]},
            { id: 'g20', title: '～極まりない', desc: '極其...。', ex: [{j: '<ruby>危険<rt>きけん</rt></ruby><ruby>極<rt>きわ</rt></ruby>まりない行為だ。', c: '這是極其危險的行為。'}]},
            { id: 'g21', title: '～とあって', desc: '因為... / 由於...。', ex: [{j: '<ruby>休日<rt>きゅうじつ</rt></ruby>とあって、道が混んでいる。', c: '由於是假日，路上很塞。'}]},
            { id: 'g22', title: '～あっての', desc: '正是因為有...。', ex: [{j: '<ruby>お客様<rt>おきゃくさま</rt></ruby>あっての<ruby>商売<rt>しょうばい</rt></ruby>です。', c: '正是因為有客人才能做生意。'}]},
            { id: 'g23', title: '～いかんだ', desc: '取決於...。', ex: [{j: '<ruby>成功<rt>せいこう</rt></ruby>は<ruby>努力<rt>どりょく</rt></ruby>いかんだ。', c: '成功取決於努力。'}]},
            { id: 'g24', title: '～いかんによらず', desc: '不管...都...。', ex: [{j: '<ruby>理由<rt>りゆう</rt></ruby>のいかんによらず、<ruby>遅刻<rt>ちこく</rt></ruby>は<ruby>許<rt>ゆる</rt></ruby>さない。', c: '不管什麼理由，都不允許遲到。'}]},
            { id: 'g25', title: '～うが～まいが', desc: '無論做還是不做都...。', ex: [{j: '<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>ろうが<ruby>降<rt>ふ</rt></ruby>るまいが、<ruby>行<rt>い</rt></ruby>く。', c: '不管下不下雨都要去。'}]},
            { id: 'g26', title: '～うと～まいと', desc: '無論...還是不...。', ex: [{j: '彼が<ruby>来<rt>こ</rt></ruby>ようと<ruby>来<rt>こ</rt></ruby>まいと、<ruby>出発<rt>しゅっぱつ</rt></ruby>する。', c: '不管他來不來都要出發。'}]},
            { id: 'g27', title: '～かぎりだ', desc: '極度... / ...極了。', ex: [{j: '<ruby>嬉<rt>うれ</rt></ruby>しいかぎりです。', c: '開心極了。'}]},
            { id: 'g28', title: '～が最後', desc: '一旦...就...。', ex: [{j: 'あいつに<ruby>金<rt>かね</rt></ruby>を<ruby>貸<rt>か</rt></ruby>したが<ruby>最後<rt>さいご</rt></ruby>、<ruby>戻<rt>もど</rt></ruby>ってこない。', c: '一旦借錢給他，就別想拿回來。'}]},
            { id: 'g29', title: '～かたわら', desc: '一邊...一邊...。', ex: [{j: '<ruby>仕事<rt>しごと</rt></ruby>のかたわら、<ruby>勉強<rt>べんきょう</rt></ruby>する。', c: '一邊工作一邊學習。'}]},
            { id: 'g30', title: '～が早いか', desc: '剛一...就...。', ex: [{j: '<ruby>授業<rt>じゅぎょう</rt></ruby>が<ruby>終<rt>お</rt></ruby>わるが<ruby>早<rt>はや</rt></ruby>いか、<ruby>帰<rt>かえ</rt></ruby>った。', c: '剛一下課就回去了。'}]},
            { id: 'g31', title: '～からある', desc: '高達... / 足有...。', ex: [{j: '100キロからある<ruby>荷物<rt>にもつ</rt></ruby>。', c: '重達100公斤的行李。'}]},
            { id: 'g32', title: '～きらいがある', desc: '有...的傾向 / 往往會...。', ex: [{j: '彼は<ruby>考<rt>かんが</rt></ruby>えすぎるきらいがある。', c: '他往往有想太多的傾向。'}]},
            { id: 'g33', title: '～極まる', desc: '極其...。', ex: [{j: '<ruby>失礼<rt>しつれい</rt></ruby><ruby>極<rt>きわ</rt></ruby>まる<ruby>態度<rt>たいど</rt></ruby>だ。', c: '極其無禮的態度。'}]},
            { id: 'g34', title: '～ごとき / ごとく', desc: '像...一樣。', ex: [{j: '<ruby>夢<rt>ゆめ</rt></ruby>のごとき<ruby>日々<rt>ひび</rt></ruby>。', c: '如夢般的日子。'}]},
            { id: 'g35', title: '～ことなしに', desc: '沒有...就...。', ex: [{j: '<ruby>努力<rt>どりょく</rt></ruby>することなしに<ruby>成功<rt>せいこう</rt></ruby>はない。', c: '沒有努力就不會成功。'}]},
            { id: 'g36', title: '～しまつだ', desc: '結果落得...的地步。', ex: [{j: 'ついには<ruby>借金<rt>しゃっきん</rt></ruby>するしまつだ。', c: '最後落得借錢的地步。'}]},
            { id: 'g37', title: '～ずにはおかない', desc: '一定會... / 肯定會...。', ex: [{j: '彼を<ruby>感動<rt>かんどう</rt></ruby>させずにはおかない。', c: '一定會讓他感動的。'}]},

        // --- Core Logic ---
        let masteredIds = JSON.parse(localStorage.getItem('n1_mastery_v2026_march') || '[]');
        let vocabScores = JSON.parse(localStorage.getItem('n1_scores_v2026_march') || '{}');
        let hideMode = false;
        let currentFC = null;
        let fcMode = 'jpToZh';

        function init() {
            renderGrammar();
            renderVocab();
            updateProgress();
            
            document.getElementById('toggle-hide').addEventListener('click', () => {
                hideMode = !hideMode;
                document.body.classList.toggle('hide-mastered', hideMode);
                document.getElementById('toggle-label').innerText = hideMode ? "顯示全部" : "隱藏已掌握";
                document.getElementById('toggle-icon').innerText = hideMode ? "👁️‍🗨️" : "👁️";
            });

            document.getElementById('reset-progress').addEventListener('click', () => {
                document.getElementById('confirm-modal').style.display = 'flex';
            });

            document.getElementById('search-box').addEventListener('input', (e) => {
                renderVocab(e.target.value);
            });
        }

        function formatRuby(word, kana) {
            if (!kana || word === kana) return word;
            return `<ruby>${word}<rt>${kana}</rt></ruby>`;
        }

        function renderGrammar() {
            const container = document.getElementById('section-grammar');
            container.innerHTML = grammarData.map((g, idx) => `
                <div class="grammar-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center ${masteredIds.includes(g.id) ? 'is-mastered mastered' : ''}" data-id="${g.id}">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <span class="bg-rose-600 text-white text-[9px] px-2 py-1 rounded font-black tracking-widest text-center">G${idx+1}</span>
                            <h3 class="text-xl font-bold text-slate-900 japanese-text text-center">${g.title}</h3>
                        </div>
                        <input type="checkbox" class="custom-checkbox text-center" ${masteredIds.includes(g.id) ? 'checked' : ''} onchange="toggleMastered('${g.id}')">
                    </div>
                    <p class="text-sm text-slate-600 mb-4 font-medium text-center">${g.desc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl space-y-3">
                        ${g.ex.map(e => `
                            <div class="border-l-2 border-rose-200 pl-3">
                                <p class="japanese-text text-slate-800 text-base leading-relaxed text-center">${e.j}</p>
                                <p class="text-xs text-slate-500 mt-0.5 text-center">${e.c}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderVocab(filter = "") {
            const container = document.getElementById('vocab-body');
            const filteredData = rawVocab.filter(v => 
                v[0].toLowerCase().includes(filter.toLowerCase()) || 
                v[1].toLowerCase().includes(filter.toLowerCase()) || 
                v[2].toLowerCase().includes(filter.toLowerCase())
            );
            
            container.innerHTML = filteredData.map((v, i) => {
                const id = `n1fv${i}`;
                const scores = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                const isMastered = masteredIds.includes(id);
                return `
                    <tr class="vocab-row transition-all hover:bg-rose-50 text-center ${isMastered ? 'is-mastered mastered' : ''}" data-id="${id}">
                        <td class="p-4 text-center">
                            <input type="checkbox" class="custom-checkbox text-center" ${isMastered ? 'checked' : ''} onchange="toggleMastered('${id}')">
                        </td>
                        <td class="p-4 font-mono text-slate-400 text-xs text-center border-r border-slate-50">V${i+1}</td>
                        <td class="p-4 text-center">
                            <div class="japanese-text font-bold text-base text-slate-900 text-center">${v[0]}</div>
                            <div class="text-[10px] text-slate-400 japanese-text text-center">${v[1]}</div>
                        </td>
                        <td class="p-4 text-center">
                            <span class="font-bold text-rose-700 text-center">${v[2]}</span>
                        </td>
                        <td class="p-4 text-center">
                            <p class="japanese-text text-slate-600 italic text-xs leading-relaxed text-center">${v[3]}</p>
                        </td>
                        <td class="p-4 text-center">
                            <div class="flex gap-4 items-center justify-center text-center">
                                <div class="flex flex-col text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black text-center">日</span>
                                    <div class="w-10 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5 text-center">
                                        <div class="h-full bg-rose-500 text-center" style="width: ${scores.jpToZh * 10}%"></div>
                                    </div>
                                </div>
                                <div class="flex flex-col text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black text-center">中</span>
                                    <div class="w-10 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5 text-center">
                                        <div class="h-full bg-emerald-500 text-center" style="width: ${scores.zhToJp * 10}%"></div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // --- Flashcard Logic ---
        function loadNextFlashcard() {
            let pool = [];
            rawVocab.forEach((v, i) => {
                const id = `n1fv${i}`;
                const score = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                if (!masteredIds.includes(id)) {
                    if (score.jpToZh < 10) pool.push({ v, id, mode: 'jpToZh' });
                    if (score.zhToJp < 10) pool.push({ v, id, mode: 'zhToJp' });
                }
            });

            if (pool.length === 0) {
                document.getElementById('fc-main-display').classList.add('hidden');
                document.getElementById('fc-controls').classList.add('hidden');
                document.getElementById('fc-header').classList.add('hidden');
                document.getElementById('fc-empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('fc-main-display').classList.remove('hidden');
            document.getElementById('fc-controls').classList.remove('hidden');
            document.getElementById('fc-header').classList.remove('hidden');
            document.getElementById('fc-empty-state').classList.add('hidden');
            document.getElementById('fc-answer-block').classList.remove('active');

            const pick = pool[Math.floor(Math.random() * pool.length)];
            currentFC = pick;
            fcMode = pick.mode;

            const header = document.getElementById('fc-header');
            if (fcMode === 'jpToZh') {
                header.className = "absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-rose-600 shadow-md transition-all";
                document.getElementById('fc-mode-text').innerText = '日譯中挑戰';
                document.getElementById('fc-question').innerHTML = formatRuby(pick.v[0], pick.v[1]);
                document.getElementById('fc-hint').innerText = "請回答中文解釋";
                document.getElementById('fc-target').innerText = pick.v[2];
                document.getElementById('fc-kana-display').innerText = "";
            } else {
                header.className = "absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-emerald-600 shadow-md transition-all";
                document.getElementById('fc-mode-text').innerText = '中譯日挑戰';
                document.getElementById('fc-question').innerText = pick.v[2];
                document.getElementById('fc-hint').innerText = "請回答日文漢字與讀音";
                document.getElementById('fc-target').innerText = pick.v[0];
                document.getElementById('fc-kana-display').innerText = pick.v[1] || "";
            }
            document.getElementById('fc-example').innerText = pick.v[3];
            updateScoreUI();
        }

        function updateScoreUI() {
            const scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            const currentVal = scores[fcMode];
            document.getElementById('fc-current-score-text').innerText = currentVal;
            const dots = document.getElementById('fc-score-dots');
            dots.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.className = `w-1.5 h-1.5 rounded-full ${i < currentVal ? 'bg-white' : 'bg-white/30'}`;
                dots.appendChild(dot);
            }
        }

        function processFC(action) {
            if (!currentFC) return;
            if (action === 'answer') { document.getElementById('fc-answer-block').classList.add('active'); return; }

            let scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            if (action === 'master') scores[fcMode] = Math.min(10, scores[fcMode] + 5);
            else if (action === 'again') scores[fcMode] = Math.floor(scores[fcMode] / 2);
            
            vocabScores[currentFC.id] = scores;
            if (scores.jpToZh >= 10 && scores.zhToJp >= 10) masteredIds.push(currentFC.id);
            saveAndSync();
            loadNextFlashcard();
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) {
                masteredIds.splice(index, 1);
            } else {
                masteredIds.push(id);
                vocabScores[id] = { jpToZh: 10, zhToJp: 10 };
            }
            saveAndSync(id);
        }

        function saveAndSync(id) {
            localStorage.setItem('n1_mastery_v2026_march', JSON.stringify(masteredIds));
            localStorage.setItem('n1_scores_v2026_march', JSON.stringify(vocabScores));
            if (id) renderVocab(document.getElementById('search-box').value);
            else { renderGrammar(); renderVocab(); }
            updateProgress();
        }

        function updateProgress() {
            const total = grammarData.length + rawVocab.length;
            const current = masteredIds.length;
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`section-${type}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active'); btn.classList.add('text-slate-400'); });
            document.getElementById(`tab-btn-${type}`).classList.add('tab-active');
            if (type === 'flashcard') loadNextFlashcard();
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmReset() { masteredIds = []; vocabScores = {}; saveAndSync(); closeModal(); if (!document.getElementById('section-flashcard').classList.contains('hidden')) loadNextFlashcard(); }

        window.onload = init;
    </script>
</body>
</html>
