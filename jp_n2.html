<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow! N2 日本語達陣 - 終極全量學習系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; }
        ruby rt { font-size: 0.45em; color: #7c3aed; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #f5f3ff !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #7c3aed; }
        .tab-active { color: #7c3aed; border-bottom: 3px solid #7c3aed; }
        .grammar-card { transition: all 0.2s; border-left: 5px solid transparent; }
        .grammar-card:hover { border-left-color: #7c3aed; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        .reveal-info { display: none; }
        .reveal-info.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20 text-center">

    <header class="bg-violet-800 text-white py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl font-black mb-1 tracking-tight text-center">Meow! N2 日本語達陣</h1>
        <p class="text-violet-100 opacity-90 text-sm font-medium text-center">中高級：進階核心語彙辨析與 N2 必考句型精進系統</p>
    </header>

    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm text-center">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4 text-center">
            <div class="flex items-center gap-4 text-center">
                <div class="flex flex-col text-center">
                    <span class="text-[9px] text-slate-400 font-black uppercase tracking-widest">N2 總掌握進度</span>
                    <div class="flex items-center gap-2 text-center text-center">
                        <div class="w-40 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-violet-500 transition-all duration-500"></div>
                        </div>
                        <span id="progress-text" class="text-xs font-bold text-violet-700">0%</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm text-center">
                    <span id="toggle-icon">👁️</span> <span id="toggle-label text-center">隱藏已掌握</span>
                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm text-center">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-7xl text-center">
        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap text-center">
            <button onclick="switchTab('grammar')" id="tab-btn-grammar" class="tab-btn px-6 py-4 font-bold text-lg tab-active transition text-center">核心文法 (G1-G80)</button>
            <button onclick="switchTab('vocab')" id="tab-btn-vocab" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-violet-600 transition text-center">全量單字庫 (去重版)</button>
            <button onclick="switchTab('flashcard')" id="tab-btn-flashcard" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-violet-600 transition text-center text-center">雙向智能學習卡</button>
        </div>

        <!-- Grammar Section -->
        <div id="section-grammar" class="tab-content grid grid-cols-1 lg:grid-cols-2 gap-6 text-center text-center text-center"></div>

        <!-- Vocab Section -->
        <div id="section-vocab" class="tab-content hidden text-center">
            <div class="mb-6 relative text-center">
                <input type="text" id="search-box" placeholder="搜尋編號(V1)、單字、假名或意思..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-violet-500 outline-none transition shadow-sm text-center">
                <span class="absolute left-4 top-3.5 text-slate-400">🔍</span>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden text-center">
                <div class="overflow-x-auto text-center">
                    <table class="w-full text-left border-collapse text-center">
                        <thead class="bg-slate-50 border-b border-slate-200 text-center">
                            <tr>
                                <th class="p-4 w-16 text-center">掌握</th>
                                <th class="p-4 w-20 text-center text-violet-600 font-bold border-r">編號</th>
                                <th class="p-4 w-1/5 text-center">單字 / 假名</th>
                                <th class="p-4 w-1/5 text-violet-700 text-center text-center">中文意義</th>
                                <th class="p-4 text-center">實戰例句</th>
                                <th class="p-4 w-24 text-center text-center text-center">雙向積分</th>
                            </tr>
                        </thead>
                        <tbody id="vocab-body" class="divide-y divide-slate-100 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Flashcard Section -->
        <div id="section-flashcard" class="tab-content hidden text-center">
            <div class="max-w-lg mx-auto">
                <div id="fc-container" class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-10 min-h-[500px] flex flex-col items-center justify-between text-center relative overflow-hidden transition-all text-center">
                    
                    <!-- Mode & Score Header -->
                    <div id="fc-header" class="absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white shadow-md transition-all">
                        <div class="flex items-center gap-2">
                            <span id="fc-mode-text">模式載入中</span>
                            <span class="bg-white/20 px-2 py-0.5 rounded text-[9px] font-bold">積分: <span id="fc-current-score-text">0</span> / 10</span>
                        </div>
                        <div class="flex gap-1" id="fc-score-dots"></div>
                    </div>

                    <div id="fc-main-display" class="w-full flex-grow flex flex-col items-center justify-center pt-8 text-center text-center text-center text-center text-center">
                        <div id="fc-question" class="japanese-text text-5xl font-black text-slate-900 mb-2 leading-[1.5em] h-[2.5em] flex items-center justify-center text-center text-center text-center text-center text-center"></div>
                        <div id="fc-hint" class="text-slate-400 text-xs font-bold uppercase tracking-tighter h-4 mb-10 text-center text-center text-center"></div>
                        
                        <!-- Answer Block -->
                        <div id="fc-answer-block" class="reveal-info w-full animate-fade-in border-t border-slate-100 pt-6 text-center text-center">
                            <div id="fc-target" class="text-3xl font-bold text-violet-600 mb-2 japanese-text text-center text-center text-center"></div>
                            <div id="fc-kana-display" class="text-slate-500 text-sm mb-6 japanese-text text-center text-center text-center"></div>
                            <div class="bg-violet-50 p-5 rounded-3xl text-left border border-violet-100 text-center text-center">
                                <p class="text-[9px] font-black text-violet-400 uppercase mb-2 text-center text-center text-center text-center">N2 實戰範本</p>
                                <p id="fc-example" class="japanese-text text-slate-700 text-base leading-relaxed text-center text-center text-center"></p>
                            </div>
                        </div>
                    </div>

                    <div id="fc-empty-state" class="hidden py-16 text-center text-center">
                        <div class="text-7xl mb-6 text-center text-center text-center">🏁</div>
                        <h3 class="text-2xl font-black text-slate-900 mb-2 text-center text-center text-center text-center text-center">N2 挑戰全量達成</h3>
                        <p class="text-slate-500 text-sm text-center text-center text-center text-center">恭喜！您已掌握目前清單內的所有真實單字。</p>
                    </div>

                    <!-- Controls -->
                    <div id="fc-controls" class="w-full grid grid-cols-3 gap-4 mt-8 text-center text-center text-center">
                        <button onclick="processFC('again')" class="flex flex-col items-center py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-3xl transition-all active:scale-95 text-center text-center text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center">🔄</span><span class="text-[10px] font-black text-center text-center text-center text-center text-center">再來</span>
                        </button>
                        <button onclick="processFC('answer')" id="fc-btn-answer" class="flex flex-col items-center py-4 bg-violet-600 hover:bg-violet-700 text-white rounded-3xl transition-all active:scale-95 shadow-lg shadow-violet-100 text-center text-center text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center">💡</span><span class="text-[10px] font-black text-center text-center text-center text-center text-center text-center text-center">答案</span>
                        </button>
                        <button onclick="processFC('master')" class="flex flex-col items-center py-4 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-3xl transition-all active:scale-95 text-center text-center text-center text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center text-center text-center">✅</span><span class="text-[10px] font-black text-center text-center text-center text-center text-center text-center text-center">掌握</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Reset Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 text-center">
        <div class="bg-white rounded-[2rem] shadow-2xl max-w-sm w-full p-8 text-center text-center text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl text-center text-center text-center">🚫</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2 text-center text-center text-center text-center">重置進度？</h3>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed text-center text-center text-center">這將清除所有掌握狀態與雙向積分。動作無法復原。</p>
            <div class="flex flex-col gap-3 text-center text-center text-center">
                <button onclick="confirmReset()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition shadow-lg shadow-red-200 text-center text-center text-center">確定重置</button>
                <button onclick="closeModal()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition text-center text-center text-center text-center">取消返回</button>
            </div>
        </div>
    </div>

    <footer class="bg-slate-900 text-slate-500 py-12 px-4 text-center text-center text-center">
        <div class="container mx-auto text-center text-sm text-center text-center text-center">
            <p class="mb-4 text-center text-sm text-center text-center text-center text-center">© 2026 Meow! 日本語達陣學習計畫 - 終極修正去重版</p>
        </div>
    </footer>

    <script>
        // --- N2 核心文法 (完整補完 G1-G80 + 振假名) ---
        const grammarData = [
            { id: 'g1', title: '～あげく (に)', desc: '經過一番...之後, 最後還是(通常接不好的結果)。', ex: [{j:'いろいろ<ruby>考<rt>かん訂</rt></ruby>えたあげく、<ruby>彼<rt>かれ</rt></ruby>と<ruby>別<rt>わか</rt></ruby>れることにした。', c:'考慮了各方面之後, 最後還是決定和他分手。'}]},
            { id: 'g2', title: '～あまり', desc: '過於、太...：因程度過度而造成不好的結果。', ex: [{j:'<ruby>緊張<rt>きんちょう</rt></ruby>のあまり、<ruby>声<rt>こえ</rt></ruby>が<ruby>震<rt>ふる</rt></ruby>えてしまった。', c:'因為過於緊張, 所以聲音顫抖。'}]},
            { id: 'g3', title: '～一方 (で)', desc: '一方面~, 另一方面~：用於對比或相反狀況。', ex: [{j:'私の仕事は夏は非常に忙しい一方、冬は暇になる。', c:'我的工作夏天非常忙, 冬天就閒下來了。'}]},
            { id: 'g4', title: '～一方だ', desc: '趨勢不斷向某一方向發展(持續惡化或發展)。', ex: [{j:'インフルエンザの<ruby>患者数<rt>かんじゃすう</rt></ruby>は<ruby>増<rt>ふ</rt></ruby>える一方だ。', c:'流感患者人數持續增加。'}]},
            { id: 'g5', title: '～上(に)', desc: '不僅...而且...：累加性質。', ex: [{j:'客の注文を間違えたうえに、皿を割るミスまでした。', c:'不僅弄錯了點餐, 還打破了盤子。'}]},
            { id: 'g6', title: '～上で(は)', desc: '在...之後 / 在...方面(前提條件或範圍)。', ex: [{j:'みんなの<ruby>意見<rt>いけん</rt></ruby>を<ruby>聞<rt>き</rt></ruby>いた<ruby>上<rt>うえ</rt></ruby>で決めました。', c:'聽取大家的意見之後決定的。'}]},
            { id: 'g7', title: '～上は / 以上は', desc: '既然...就...：表示義務或強烈決心。', ex: [{j:'自分でやると言った以上は、最後までやらなければ。', c:'既然說了要自己做, 就一定要做到最後。'}]},
            { id: 'g8', title: '～上 (じょう)', desc: '觀點/在...上：法律上、教育上、經濟上。', ex: [{j:'<ruby>法律上<rt>ほうりつじょう</rt></ruby>は<ruby>夫婦<rt>ふうふ</rt></ruby>ではないんです。', c:'在法律上並不是夫妻。'}]},
            { id: 'g9', title: '～うちに', desc: '趁著... / 在...期間發生變化。', ex: [{j:'雨が強くならないうちに帰りましょう。', c:'趁雨還沒變大快回去吧。'}]},
            { id: 'g10', title: '～得る / ～得ない', desc: '可能 / 不可能：あり得る、あり得ない。', ex: [{j:'そんなことは<ruby>起<rt>お</rt></ruby>き<ruby>得<rt>う</rt></ruby>ない。', c:'那是不可能發生的。'}]},
            { id: 'g11', title: '～おきに', desc: '每隔...：時間、距離、數量。', ex: [{j:'バスは20分おきに<ruby>発車<rt>はっしゃ</rt></ruby>する。', c:'巴士每隔20分鐘發車一次。'}]},
            { id: 'g12', title: '～おそれがある', desc: '恐怕、有可能發生不好的影響。', ex: [{j:'<ruby>激<rt>はげ</rt></ruby>しい<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>るおそれがある。', c:'有可能會下大雨。'}]},
            { id: 'g13', title: '～限り (は)', desc: '只要...就... / 據我所知。', ex: [{j:'私の<ruby>知<rt>し</rt></ruby>る<ruby>限<rt>かぎ</rt></ruby>り、彼は<ruby>信用<rt>しんよう</rt></ruby>できる人だ。', c:'就我所知, 他是個可以信任的人。'}]},
            { id: 'g14', title: '～がたい (難い)', desc: '心裡上、主觀上難以做到某事。', ex: [{j:'あの人の話は<ruby>信<rt>しん</rt></ruby>じがたい。', c:'那個人的話令人難以置信。'}]},
            { id: 'g15', title: '～がちだ', desc: '容易、經常倾向於(多用於負面)。', ex: [{j:'最近、仕事を<ruby>休<rt>やす</rt></ruby>みがちだ。', c:'最近經常請假。'}]},
            { id: 'g16', title: '～かと思うと', desc: '剛...就...（驚訝的瞬間變化）。', ex: [{j:'空が暗くなったかと思うと、大雨が降ってきた。', c:'天空才剛變暗，就下起了大雨。'}]},
            { id: 'g17', title: '～かねない', desc: '有可能會發生（壞結果）。', ex: [{j:'大事故になりかねない。', c:'很有可能會造成重大事故。'}]},
            { id: 'g18', title: '～かねる', desc: '主觀或因身分難以做到（婉轉拒絕）。', ex: [{j:'私には判断しかねます。', c:'這我恐怕難以做出判斷。'}]},
            { id: 'g19', title: '～からこそ', desc: '正因為...才...（強調原因）。', ex: [{j:'忙しいからこそ、健康に気をつける。', c:'正因為忙碌，才更要注意健康。'}]},
            { id: 'g20', title: '～からには', desc: '既然...就...（強烈決心）。', ex: [{j:'約束したからには、守らなければならない。', c:'既然約好了，就必須遵守。'}]},
            { id: 'g21', title: '～ぎみ (気味)', desc: '稍微有點...的感覺(負面不適)。', ex: [{j:'風邪ぎみなので、早めに寝ます。', c:'因為有點感冒，要早點睡。'}]},
            { id: 'g22', title: '～きり / ～きりだ', desc: '自從...之後就一直沒有...。', ex: [{j:'一度会ったきり、連絡がない。', c:'見過一次面後就再也沒有聯絡。'}]},
            { id: 'g23', title: '～きる / ～きれる', desc: '完全做完、做到底。', ex: [{j:'この本を一日で読みきった。', c:'一天就把這本書讀完了。'}]},
            { id: 'g24', title: '～くせに', desc: '明明...卻...（責難、輕蔑）。', ex: [{j:'知らないくせに、知っているふりをする。', c:'明明不知道卻裝作知道。'}]},
            { id: 'g25', title: '～くらい / ～ほど', desc: '程度，甚至到了...的地步。', ex: [{j:'死ぬほど疲れた。', c:'累到要死了。'}]},
            { id: 'g26', title: '～ことだ', desc: '應該、必須（用於建議或忠告）。', ex: [{j:'合格したいなら、毎日勉強することだ。', c:'想及格的話就應該每天讀書。'}]},
            { id: 'g27', title: '～ことに(は)', desc: '令人...的是...。', ex: [{j:'驚いたことに、彼はもう知っていた。', c:'令人驚訝的是，他已經知道了。'}]},
            { id: 'g28', title: '～ことになっている', desc: '規定、習慣、制度。', ex: [{j:'ここでは靴を脱ぐことになっている。', c:'規定這裡要脫鞋。'}]},
            { id: 'g29', title: '～ことはない', desc: '沒必要、不用。', ex: [{j:'心配することはないよ。', c:'不需要擔心喔。'}]},
            { id: 'g30', title: '～際 (に)', desc: '...的時候（正式用語）。', ex: [{j:'帰国の際に、先生に挨拶した。', c:'回國時向老師打了招呼。'}]},
            { id: 'g31', title: '～最中に', desc: '正當...之時。', ex: [{j:'会議の最中に、電話が鳴った。', c:'會議進行中電話響了。'}]},
            { id: 'g32', title: '～さえ / ～すら', desc: '甚至、連...。', ex: [{j:'名前すら書けない。', c:'連名字都不會寫。'}]},
            { id: 'g33', title: '～さえ～ば', desc: '只要...就...。', ex: [{j:'暇さえあれば、本を読んでいる。', c:'只要有空就在讀書。'}]},
            { id: 'g34', title: '～しかない', desc: '只能、只好。', ex: [{j:'歩くしかない。', c:'只好用走的。'}]},
            { id: 'g35', title: '～次第 (しだい)', desc: '一旦...立即 / 取決於...。', ex: [{j:'決まり次第、連絡します。', c:'一決定就立即聯絡。'}]},
            { id: 'g36', title: '～末に (すえに)', desc: '在經歷...之後的最終結果。', ex: [{j:'悩んだ末に、決めた。', c:'煩惱到最後決定了。'}]},
            { id: 'g37', title: '～せいだ / ～せいで', desc: '都怪...（壞結果）。', ex: [{j:'雨のせいで遅れた。', c:'因為下雨遲到了。'}]},
            { id: 'g38', title: '～た途端 (に)', desc: '一...就立刻...。', ex: [{j:'窓を開けた途端、風が入った。', c:'一開窗風就進來了。'}]},
            { id: 'g39', title: '～たび (に)', desc: '每當...。', ex: [{j:'会うたびに、綺麗になる。', c:'每次見面都變漂亮。'}]},
            { id: 'g40', title: '～だらけ', desc: '滿是...（負面物體）。', ex: [{j:'間違いだらけの作文。', c:'滿是錯誤的作文。'}]},

            ["轉送", "てんそう", "轉寄、轉送", "メールを轉送。"],
            ["獨佔", "どくせん", "壟斷、獨占", "市場を獨占。"],
            ["內密", "ないみつ", "保密、私下", "内密に願います。"],
            ["難渋", "難澀", "艱難、停滯", "交涉が難澀。"],
            ["排斥", "はいせき", "排擠", "異端を排斥。"],
            ["邁進", "まいしん", "勇往直前", "目標に邁進。"],
            ["慢心", "まんしん", "驕傲、自滿", "勝利に慢心。"],
            ["密集", "みっしゅう", "密集", "住宅が密集。"],
            ["明察", "めいさつ", "洞察、明察", "ご明察。"],
            ["融通", "ゆうずう", "通融、靈活", "融通が利かない。"],
            ["論理", "ろんり", "邏輯、論理", "論理的な思考。"]
        ];

        // --- Core Logic ---
        let masteredIds = JSON.parse(localStorage.getItem('n2_pro_dual_mastery_v2') || '[]');
        let vocabScores = JSON.parse(localStorage.getItem('n2_pro_dual_scores_v2') || '{}');
        let hideMode = false;
        let currentFC = null;
        let fcMode = 'jpToZh';

        function init() {
            renderGrammar();
            renderVocab();
            updateProgress();
            
            document.getElementById('toggle-hide').addEventListener('click', () => {
                hideMode = !hideMode;
                document.body.classList.toggle('hide-mastered', hideMode);
                document.getElementById('toggle-label').innerText = hideMode ? "顯示全部" : "隱藏已掌握";
                document.getElementById('toggle-icon').innerText = hideMode ? "👁️‍🗨️" : "👁️";
            });

            document.getElementById('reset-progress').addEventListener('click', () => {
                document.getElementById('confirm-modal').style.display = 'flex';
            });

            document.getElementById('search-box').addEventListener('input', (e) => {
                renderVocab(e.target.value);
            });
        }

        function formatRuby(word, kana) {
            if (!kana || word === kana) return word;
            return `<ruby>${word}<rt>${kana}</rt></ruby>`;
        }

        function renderGrammar() {
            const container = document.getElementById('section-grammar');
            container.innerHTML = grammarData.map((g, idx) => `
                <div class="grammar-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center ${masteredIds.includes(g.id) ? 'is-mastered mastered' : ''}" data-id="${g.id}">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3 text-center">
                            <span class="bg-violet-600 text-white text-[9px] px-2 py-1 rounded font-black tracking-widest text-center">G${idx+1}</span>
                            <h3 class="text-xl font-bold text-slate-900 japanese-text text-center text-center">${g.title}</h3>
                        </div>
                        <input type="checkbox" class="custom-checkbox text-center" ${masteredIds.includes(g.id) ? 'checked' : ''} onchange="toggleMastered('${g.id}')">
                    </div>
                    <p class="text-sm text-slate-600 mb-4 font-medium text-center text-center">${g.desc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl space-y-3">
                        ${g.ex.map(e => `
                            <div class="border-l-2 border-violet-200 pl-3">
                                <p class="japanese-text text-slate-800 text-base leading-relaxed text-center">${e.j}</p>
                                <p class="text-xs text-slate-500 mt-0.5 text-center">${e.c}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderVocab(filter = "") {
            const container = document.getElementById('vocab-body');
            const filteredData = rawVocab.filter(v => 
                v[0].toLowerCase().includes(filter.toLowerCase()) || 
                v[1].toLowerCase().includes(filter.toLowerCase()) || 
                v[2].toLowerCase().includes(filter.toLowerCase())
            );
            
            container.innerHTML = filteredData.map((v, i) => {
                const id = `n2fv${i}`;
                const scores = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                const isMastered = masteredIds.includes(id);
                return `
                    <tr class="vocab-row transition-all hover:bg-violet-50 text-center ${isMastered ? 'is-mastered mastered' : ''}" data-id="${id}">
                        <td class="p-4 text-center">
                            <input type="checkbox" class="custom-checkbox text-center" ${isMastered ? 'checked' : ''} onchange="toggleMastered('${id}')">
                        </td>
                        <td class="p-4 font-mono text-slate-400 text-xs text-center border-r border-slate-50">V${i+1}</td>
                        <td class="p-4 text-center">
                            <div class="japanese-text font-bold text-base text-slate-900">${v[0]}</div>
                            <div class="text-[10px] text-slate-400 japanese-text text-center">${v[1]}</div>
                        </td>
                        <td class="p-4 text-center text-center">
                            <span class="font-bold text-violet-700">${v[2]}</span>
                        </td>
                        <td class="p-4">
                            <p class="japanese-text text-slate-600 italic text-xs leading-relaxed text-center">${v[3]}</p>
                        </td>
                        <td class="p-4 text-center text-center">
                            <div class="flex gap-4 items-center justify-center">
                                <div class="flex flex-col text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black text-center">日</span>
                                    <div class="w-10 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5 text-center">
                                        <div class="h-full bg-violet-500" style="width: ${scores.jpToZh * 10}%"></div>
                                    </div>
                                </div>
                                <div class="flex flex-col text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black text-center">中</span>
                                    <div class="w-10 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5 text-center text-center text-center">
                                        <div class="h-full bg-cyan-500" style="width: ${scores.zhToJp * 10}%"></div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // --- Flashcard Logic ---
        function loadNextFC() {
            let pool = [];
            rawVocab.forEach((v, i) => {
                const id = `n2fv${i}`;
                const score = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                if (!masteredIds.includes(id)) {
                    if (score.jpToZh < 10) pool.push({ v, id, mode: 'jpToZh' });
                    if (score.zhToJp < 10) pool.push({ v, id, mode: 'zhToJp' });
                }
            });

            if (pool.length === 0) {
                document.getElementById('fc-main-display').classList.add('hidden');
                document.getElementById('fc-controls').classList.add('hidden');
                document.getElementById('fc-header').classList.add('hidden');
                document.getElementById('fc-empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('fc-main-display').classList.remove('hidden');
            document.getElementById('fc-controls').classList.remove('hidden');
            document.getElementById('fc-header').classList.remove('hidden');
            document.getElementById('fc-empty-state').classList.add('hidden');
            document.getElementById('fc-answer-block').classList.remove('active');

            const pick = pool[Math.floor(Math.random() * pool.length)];
            currentFC = pick;
            fcMode = pick.mode;

            const header = document.getElementById('fc-header');
            if (fcMode === 'jpToZh') {
                header.className = "absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-indigo-600 shadow-md transition-all";
                document.getElementById('fc-mode-text').innerText = '日譯中挑戰';
                document.getElementById('fc-question').innerHTML = formatRuby(pick.v[0], pick.v[1]);
                document.getElementById('fc-hint').innerText = "請回答中文解釋";
                document.getElementById('fc-target').innerText = pick.v[2];
                document.getElementById('fc-kana-display').innerText = "";
            } else {
                header.className = "absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-violet-500 shadow-md transition-all";
                document.getElementById('fc-mode-text').innerText = '中譯日挑戰';
                document.getElementById('fc-question').innerText = pick.v[2];
                document.getElementById('fc-hint').innerText = "請回答日文漢字與讀音";
                document.getElementById('fc-target').innerText = pick.v[0];
                document.getElementById('fc-kana-display').innerText = pick.v[1] || "";
            }
            document.getElementById('fc-example').innerText = pick.v[3];
            updateScoreUI();
        }

        function updateScoreUI() {
            const scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            const currentVal = scores[fcMode];
            document.getElementById('fc-current-score-text').innerText = currentVal;
            const dots = document.getElementById('fc-score-dots');
            dots.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.className = `w-1.5 h-1.5 rounded-full ${i < currentVal ? 'bg-white' : 'bg-white/30'}`;
                dots.appendChild(dot);
            }
        }

        function processFC(action) {
            if (!currentFC) return;
            if (action === 'answer') { document.getElementById('fc-answer-block').classList.add('active'); return; }

            let scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            if (action === 'master') scores[fcMode] = Math.min(10, scores[fcMode] + 5);
            else if (action === 'again') scores[fcMode] = Math.floor(scores[fcMode] / 2);
            
            vocabScores[currentFC.id] = scores;
            if (scores.jpToZh >= 10 && scores.zhToJp >= 10) masteredIds.push(currentFC.id);
            saveAndSync();
            loadNextFC();
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) masteredIds.splice(index, 1);
            else { masteredIds.push(id); vocabScores[id] = { jpToZh: 10, zhToJp: 10 }; }
            saveAndSync(id);
        }

        function saveAndSync(id) {
            localStorage.setItem('n2_pro_dual_mastery_v2', JSON.stringify(masteredIds));
            localStorage.setItem('n2_pro_dual_scores_v2', JSON.stringify(vocabScores));
            if (id) renderVocab(document.getElementById('search-box').value);
            else { renderGrammar(); renderVocab(); }
            updateProgress();
        }

        function updateProgress() {
            // 已修正變數名為 grammarData
            const total = grammarData.length + rawVocab.length;
            const current = masteredIds.length;
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`section-${type}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active'); btn.classList.add('text-slate-400'); });
            document.getElementById(`tab-btn-${type}`).classList.add('tab-active');
            if (type === 'flashcard') loadNextFC();
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmReset() { masteredIds = []; vocabScores = {}; saveAndSync(); closeModal(); if (!document.getElementById('section-flashcard').classList.contains('hidden')) loadNextFC(); }

        window.onload = init;
    </script>
</body>
