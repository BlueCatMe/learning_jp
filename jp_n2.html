<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow! N2 日本語達陣 - 終極全量去重系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; }
        ruby rt { font-size: 0.45em; color: #7c3aed; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #f5f3ff !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #7c3aed; }
        .tab-active { color: #7c3aed; border-bottom: 3px solid #7c3aed; }
        .grammar-card { transition: all 0.2s; border-left: 5px solid transparent; }
        .grammar-card:hover { border-left-color: #7c3aed; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        .reveal-info { display: none; }
        .reveal-info.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20 text-center">

    <header class="bg-violet-900 text-white py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl font-black mb-1 tracking-tight">Meow! N2 日本語達陣</h1>
        <p class="text-violet-100 opacity-90 text-sm font-medium">中高級專業：全方位核心語彙與 80 項完整文法系統</p>
    </header>

    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm text-center">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4 text-center">
            <div class="flex items-center gap-4 text-center">
                <div class="flex flex-col text-center">
                    <span class="text-[9px] text-slate-400 font-black uppercase tracking-widest text-center">N2 總掌握進度</span>
                    <div class="flex items-center gap-2 text-center">
                        <div class="w-40 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-violet-600 transition-all duration-500"></div>
                        </div>
                        <span id="progress-text" class="text-xs font-bold text-violet-700">0%</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm text-center">
                    <span id="toggle-icon">👁️</span> <span id="toggle-label">隱藏已掌握</span>
                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm text-center">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-7xl text-center">
        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap text-center">
            <button onclick="switchTab('grammar')" id="tab-btn-grammar" class="tab-btn px-6 py-4 font-bold text-lg tab-active transition text-center">核心文法 (G1-G80)</button>
            <button onclick="switchTab('vocab')" id="tab-btn-vocab" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-violet-600 transition text-center">全量單字庫 (去重版)</button>
            <button onclick="switchTab('flashcard')" id="tab-btn-flashcard" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-violet-600 transition text-center text-center">雙向智能學習卡</button>
        </div>

        <!-- Grammar Section -->
        <div id="section-grammar" class="tab-content grid grid-cols-1 lg:grid-cols-2 gap-6 text-center text-center"></div>

        <!-- Vocab Section -->
        <div id="section-vocab" class="tab-content hidden text-center">
            <div class="mb-6 relative text-center text-center">
                <input type="text" id="search-box" placeholder="搜尋單字、假名或意思..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-violet-500 outline-none transition shadow-sm text-center">
                <span class="absolute left-4 top-3.5 text-slate-400 text-center">🔍</span>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden text-center text-center">
                <div class="overflow-x-auto text-center">
                    <table class="w-full text-left border-collapse text-center">
                        <thead class="bg-slate-50 border-b border-slate-200 text-center text-center">
                            <tr>
                                <th class="p-4 w-16 text-center">掌握</th>
                                <th class="p-4 w-20 text-center text-violet-600 font-bold border-r">編號</th>
                                <th class="p-4 w-1/5 text-center">單字 / 假名</th>
                                <th class="p-4 w-1/5 text-violet-700 text-center">中文意義</th>
                                <th class="p-4 text-center">實戰例句</th>
                                <th class="p-4 w-24 text-center text-center">雙向積分</th>
                            </tr>
                        </thead>
                        <tbody id="vocab-body" class="divide-y divide-slate-100 text-sm text-center"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Flashcard Section -->
        <div id="section-flashcard" class="tab-content hidden text-center">
            <div class="max-w-lg mx-auto text-center">
                <div id="fc-container" class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-10 min-h-[500px] flex flex-col items-center justify-between text-center relative overflow-hidden transition-all text-center text-center">
                    
                    <!-- Mode & Score Header -->
                    <div id="fc-header" class="absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white shadow-md transition-all text-center">
                        <div class="flex items-center gap-2">
                            <span id="fc-mode-text">模式載入中</span>
                            <span class="bg-white/20 px-2 py-0.5 rounded text-[9px] font-bold text-center">積分: <span id="fc-current-score-text">0</span> / 10</span>
                        </div>
                        <div class="flex gap-1" id="fc-score-dots"></div>
                    </div>

                    <div id="fc-main-display" class="w-full flex-grow flex flex-col items-center justify-center pt-8 text-center text-center text-center">
                        <div id="fc-question" class="japanese-text text-5xl font-black text-slate-900 mb-2 leading-[1.5em] h-[2.5em] flex items-center justify-center text-center text-center"></div>
                        <div id="fc-hint" class="text-slate-400 text-xs font-bold uppercase tracking-tighter h-4 mb-10 text-center text-center"></div>
                        
                        <!-- Answer Block -->
                        <div id="fc-answer-block" class="reveal-info w-full animate-fade-in border-t border-slate-100 pt-6 text-center text-center text-center">
                            <div id="fc-target" class="text-3xl font-bold text-violet-600 mb-2 japanese-text text-center text-center"></div>
                            <div id="fc-kana-display" class="text-slate-500 text-sm mb-6 japanese-text text-center text-center"></div>
                            <div class="bg-violet-50 p-5 rounded-3xl text-left border border-violet-100 text-center text-center">
                                <p class="text-[9px] font-black text-violet-400 uppercase mb-2 text-center text-center">N2 實戰範本</p>
                                <p id="fc-example" class="japanese-text text-slate-700 text-base leading-relaxed text-center"></p>
                            </div>
                        </div>
                    </div>

                    <div id="fc-empty-state" class="hidden py-16 text-center text-center">
                        <div class="text-7xl mb-6 text-center text-center text-center">🏁</div>
                        <h3 class="text-2xl font-black text-slate-900 mb-2 text-center text-center">N2 挑戰全量達成</h3>
                        <p class="text-slate-500 text-sm text-center text-center">恭喜！您已熟悉目前清單內的所有真實單字。</p>
                    </div>

                    <!-- Controls -->
                    <div id="fc-controls" class="w-full grid grid-cols-3 gap-4 mt-8 text-center text-center text-center">
                        <button onclick="processFC('again')" class="flex flex-col items-center py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-3xl transition-all active:scale-95 text-center text-center">
                            <span class="text-2xl mb-1 text-center text-center">🔄</span><span class="text-[10px] font-black text-center text-center">再來</span>
                        </button>
                        <button onclick="processFC('answer')" id="fc-btn-answer" class="flex flex-col items-center py-4 bg-violet-600 hover:bg-violet-700 text-white rounded-3xl transition-all active:scale-95 shadow-lg shadow-violet-100 text-center text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center">💡</span><span class="text-[10px] font-black text-center text-center text-center">答案</span>
                        </button>
                        <button onclick="processFC('master')" class="flex flex-col items-center py-4 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-3xl transition-all active:scale-95 text-center text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center text-center">✅</span><span class="text-[10px] font-black text-center text-center text-center">掌握</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Reset Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 text-center text-center">
        <div class="bg-white rounded-[2rem] shadow-2xl max-w-sm w-full p-8 text-center text-center text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl text-center text-center">🚫</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2 text-center text-center">重置 N2 進度？</h3>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed text-center text-center">這將清除所有掌握狀態與雙向積分。動作無法復原。</p>
            <div class="flex flex-col gap-3 text-center text-center">
                <button onclick="confirmReset()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition shadow-lg shadow-red-200 text-center text-center">確定重置</button>
                <button onclick="closeModal()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition text-center text-center text-center">取消返回</button>
            </div>
        </div>
    </div>

    <script>
        // --- N2 核心文法 (完整補完 G1-G80 + 振假名標註) ---
        const grammarList = [
            { id: 'g1', title: '～あげく (に)', desc: '經過一番...之後, 最後還是(通常接不好的結果)。', ex: [{j:'いろいろ<ruby>考<rt>かんが</rt></ruby>えたあげく、<ruby>彼<rt>かれ</rt></ruby>と<ruby>別<rt>わか</rt></ruby>れることにした。', c:'考慮了各方面之後, 最後還是決定和他分手。'}]},
            { id: 'g2', title: '～あまり', desc: '過於、太...：因程度過度而造成不好的結果。', ex: [{j:'<ruby>緊張<rt>きんちょう</rt></ruby>のあまり、<ruby>声<rt>こえ</rt></ruby>が<ruby>震<rt>ふる</rt></ruby>えてしまった。', c:'因為過於緊張, 所以聲音顫抖。'}]},
            { id: 'g3', title: '～以上（は）', desc: '既然...就...：表示義務或強烈決心。', ex: [{j:'<ruby>約束<rt>やくそく</rt></ruby>した以上は、<ruby>守<rt>まも</rt></ruby>らなければならない。', c:'既然約定了，就必須遵守。'}]},
            { id: 'g4', title: '～一方 (で)', desc: '一方面~, 另一方面~：用於對比或相反狀況。', ex: [{j:'<ruby>仕事<rt>しごと</rt></ruby>が<ruby>忙<rt>いそが</rt></ruby>しい一方で、<ruby>給料<rt>きゅうりょう</rt></ruby>は<ruby>安<rt>やす</rt></ruby>い。', c:'工作很忙，另一方面薪水卻很低。'}]},
            { id: 'g5', title: '～一方だ', desc: '趨勢不斷向某一方向發展(持續惡化或發展)。', ex: [{j:'インフルエンザの<ruby>患者数<rt>かんじゃすう</rt></ruby>は<ruby>増<rt>ふ</rt></ruby>える一方だ。', c:'流感患者人數持續增加。'}]},
            { id: 'g6', title: '～上(に)', desc: '不僅...而且...：累加性質。', ex: [{j:'この<ruby>店<rt>みせ</rt></ruby>は<ruby>美味<rt>おい</rt></ruby>しいうえに、<ruby>安<rt>やす</rt></ruby>い。', c:'這家店不僅好吃，而且便宜。'}]},
            { id: 'g7', title: '～上で(は)', desc: '在...之後 / 在...方面(前提條件或範圍)。', ex: [{j:'みんなの<ruby>意見<rt>いけん</rt></ruby>を<ruby>聞<rt>き</rt></ruby>いた<ruby>上<rt>うえ</rt></ruby>で決めます。', c:'聽取大家的意見之後決定。'}]},
            { id: 'g8', title: '～上は', desc: '既然...就...。', ex: [{j:'<ruby>覚悟<rt>かくご</rt></ruby>を決めた上は、やるしかない。', c:'既然下定決心了，就只能做了。'}]},
            { id: 'g9', title: '～うちに', desc: '趁著... / 在...期間發生變化。', ex: [{j:'<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らないうちに<ruby>帰<rt>かえ</rt></ruby>りましょう。', c:'趁還沒下雨快回去吧。'}]},
            { id: 'g10', title: '～得る / ～得ない', desc: '可能 / 不可能。', ex: [{j:'そんなことはあり<ruby>得<rt>え</rt></ruby>ない。', c:'那是不可能的。'}]},
            { id: 'g11', title: '～おかげで / ～おかげだ', desc: '多虧了...。', ex: [{j:'<ruby>先生<rt>せんせい</rt></ruby>のおかげで<ruby>合格<rt>ごうかく</rt></ruby>できました。', c:'多虧了老師才及格。'}]},
            { id: 'g12', title: '～おそれがある', desc: '恐怕、有可能發生不好的影響。', ex: [{j:'<ruby>大雨<rt>おおあめ</rt></ruby>になるおそれがある。', c:'恐怕會下大雨。'}]},
            { id: 'g13', title: '～かぎり（は）', desc: '只要...就...。', ex: [{j:'私が<ruby>生<rt>い</rt></ruby>きているかぎり、<ruby>守<rt>まも</rt></ruby>り<ruby>抜<rt>ぬ</rt></ruby>く。', c:'只要我活著，就會守護到底。'}]},
            { id: 'g14', title: '～かぎりでは', desc: '據...所及的範圍內。', ex: [{j:'私の<ruby>知<rt>し</rt></ruby>るかぎりでは、彼は<ruby>独身<rt>どくしん</rt></ruby>だ。', c:'據我所知，他是單身。'}]},
            { id: 'g15', title: '～がたい', desc: '難以...(心理上)。', ex: [{j:'<ruby>信<rt>しん</rt></ruby>じがたい<ruby>事実<rt>じじつ</rt></ruby>だ。', c:'難以置信的事實。'}]},
            { id: 'g16', title: '～がちだ', desc: '容易、往往...(負面傾向)。', ex: [{j:'彼は<ruby>病気<rt>びょうき</rt></ruby>がちだ。', c:'他常生病。'}]},
            { id: 'g17', title: '～かと思うと / かと思ったら', desc: '剛一...就...。', ex: [{j:'<ruby>泣<rt>な</rt></ruby>いたかと思ったら、もう<ruby>笑<rt>わら</rt></ruby>っている。', c:'剛一哭，就又笑了。'}]},
            { id: 'g18', title: '～か～ないかのうちに', desc: '剛...還沒...的時候。', ex: [{j:'<ruby>授業<rt>じゅぎょう</rt></ruby>が<ruby>終<rt>お</rt></ruby>わるか終わらないかのうちに<ruby>帰<rt>かえ</rt></ruby>った。', c:'一打下課鐘就回去了。'}]},
            { id: 'g19', title: '～かねない', desc: '有可能會...(帶來壞結果)。', ex: [{j:'<ruby>大事故<rt>だいじこ</rt></ruby>になりかねない。', c:'有可能釀成大事故。'}]},
            { id: 'g20', title: '～かねる', desc: '難以...(婉轉拒絕)。', ex: [{j:'ご<ruby>希望<rt>きぼう</rt></ruby>には<ruby>添<rt>そ</rt></ruby>いかねます。', c:'難以滿足您的期望。'}]},
            { id: 'g21', title: '～からいうと / ～からいえば', desc: '從...來看。', ex: [{j:'<ruby>実力<rt>じつりょく</rt></ruby>からいえば、彼が一番だ。', c:'從實力來看，他是第一。'}]},
            { id: 'g22', title: '～からして', desc: '單從...就...。', ex: [{j:'<ruby>声<rt>こえ</rt></ruby>からして<ruby>疲<rt>つか</rt></ruby>れているようだ。', c:'單從聲音聽起來就很累的樣子。'}]},
            { id: 'g23', title: '～からすると / ～からすれば', desc: '從...來看(推測)。', ex: [{j:'<ruby>症状<rt>しょうじょう</rt></ruby>からすると、<ruby>風邪<rt>かぜ</rt></ruby>ですね。', c:'從症狀來看，是感冒呢。'}]},
            { id: 'g24', title: '～からといって', desc: '雖說...但未必...。', ex: [{j:'<ruby>安<rt>やす</rt></ruby>いからといって、たくさん<ruby>買<rt>か</rt></ruby>うのはよくない。', c:'雖說便宜，買太多也不好。'}]},
            { id: 'g25', title: '～からには', desc: '既然...就...。', ex: [{j:'やるからには、<ruby>最後<rt>さいご</rt></ruby>までやる。', c:'既然要做，就要做到最後。'}]},
            { id: 'g26', title: '～かわりに', desc: '代替... / 作為交換。', ex: [{j:'<ruby>手伝<rt>てつだ</rt></ruby>うかわりに、おごってね。', c:'我幫你的忙，作為交換請我客吧。'}]},
            { id: 'g27', title: '～気味（ぎみ）', desc: '稍微有...的感覺。', ex: [{j:'<ruby>風邪<rt>かぜ</rt></ruby>気味だ。', c:'有點感冒的感覺。'}]},
            { id: 'g28', title: '～きり / ～きりだ', desc: '自從...之後就沒... / 只有...。', ex: [{j:'<ruby>出<rt>で</rt></ruby>かけたきり、<ruby>戻<rt>もど</rt></ruby>ってこない。', c:'出門之後就沒回來。'}]},
            { id: 'g29', title: '～きる / ～きれる / ～きれない', desc: '完全... / 無法完全...。', ex: [{j:'<ruby>食<rt>た</rt></ruby>べきれないほどの<ruby>料理<rt>りょうり</rt></ruby>。', c:'多到吃不完的料理。'}]},
            { id: 'g30', title: '～くせに', desc: '明明...卻...。', ex: [{j:'<ruby>知<rt>し</rt></ruby>っているくせに、<ruby>教<rt>おし</rt></ruby>えてくれない。', c:'明明知道卻不告訴我。'}]},
            { id: 'g31', title: '～くらい / ～ぐらい', desc: '程度，甚至...。', ex: [{j:'<ruby>泣<rt>な</rt></ruby>きたいくらい<ruby>痛<rt>いた</rt></ruby>い。', c:'痛到想哭。'}]},
            { id: 'g32', title: '～げ', desc: '看起來...的樣子。', ex: [{j:'<ruby>悲<rt>かな</rt></ruby>しげな<ruby>顔<rt>かお</rt></ruby>。', c:'看起來悲傷的臉。'}]},
            { id: 'g33', title: '～こそ', desc: '正因為...。', ex: [{j:'<ruby>今年<rt>ことし</rt></ruby>こそ<ruby>合格<rt>ごうかく</rt></ruby>するぞ。', c:'今年一定要及格。'}]},
            { id: 'g34', title: '～ことか', desc: '多麼...啊(感嘆)。', ex: [{j:'どんなに<ruby>心配<rt>しんぱい</rt></ruby>したことか。', c:'你知道我有多擔心嗎！'}]},
            { id: 'g35', title: '～ことから', desc: '因為...的緣故(由來)。', ex: [{j:'<ruby>顔<rt>かお</rt></ruby>が<ruby>似<rt>に</rt></ruby>ていることから、<ruby>兄弟<rt>きょうだい</rt></ruby>だとわかった。', c:'因為長得像，就知道是兄弟。'}]},
            { id: 'g36', title: '～ことだ', desc: '應該... / 最好...。', ex: [{j:'<ruby>健康<rt>けんこう</rt></ruby>になりたければ、<ruby>運動<rt>うんどう</rt></ruby>することだ。', c:'想健康的話就該運動。'}]},
            { id: 'g37', title: '～ことだから', desc: '因為是(了解的對象)...。', ex: [{j:'<ruby>彼<rt>かれ</rt></ruby>のことだから、きっと<ruby>遅<rt>おく</rt></ruby>れてくるだろう。', c:'因為是他的作風，肯定會遲到吧。'}]},

            ["享受", "きょうじゅ", "享受", "<ruby>利益<rt>りえき</rt></ruby>を<ruby>享受<rt>きょうじゅ</rt></ruby>する。", "享受利益。"],

            ["勧告", "かんこく", "勸告", "<ruby>避難<rt>ひなん</rt></ruby><ruby>勧告<rt>かんこく</rt></ruby>。", "避難勸告。"],
            ["干渉", "かんしょう", "干涉", "<ruby>内政<rt>ないせい</rt></ruby><ruby>干渉<rt>かんしょう</rt></ruby>。", "干涉內政。"],
            ["感染", "かんせん", "感染", "<ruby>ウイルス<rt>ういるす</rt></ruby>に<ruby>感染<rt>かんせん</rt></ruby>する。", "感染病毒。"],
            ["勘定", "かんじょう", "計算、結帳", "お<ruby>勘定<rt>かんじょう</rt></ruby>をお<ruby>願<rt>ねが</rt></ruby>いします。", "麻煩結帳。"],
            ["歓喜", "かんき", "歡喜", "<ruby>歓喜<rt>かんき</rt></ruby>の<ruby>声<rt>こえ</rt></ruby>をあげる。", "發出歡呼。"],
            ["緩和", "かんわ", "緩和", "<ruby>緊張<rt>きんちょう</rt></ruby>が<ruby>緩和<rt>かんわ</rt></ruby>される。", "緊張緩和。"],
            ["加味", "かみ", "考量、加入", "<ruby>条件<rt>じょうけん</rt></ruby>を<ruby>加味<rt>かみ</rt></ruby>する。", "將條件考慮進去。"],
            ["確保", "かくほ", "確保", "<ruby>席<rt>せき</rt></ruby>を<ruby>確保<rt>かくほ</rt></ruby>する。", "確保座位。"],
            ["架空", "かくう", "架空、虛構", "<ruby>架空<rt>かくう</rt></ruby>の<ruby>人物<rt>じんぶつ</rt></ruby>。", "虛構的人物。"]
        ];

        extendVocab.forEach(item => {
            if (!uniquePoolMap.has(item[0])) {
                uniquePoolMap.set(item[0], item);
            }
        });

        const vocabData = Array.from(uniquePoolMap.values());

        // --- Core Logic ---
        let masteredIds = JSON.parse(localStorage.getItem('n2_dual_mastery_v2026') || '[]');
        let vocabScores = JSON.parse(localStorage.getItem('n2_dual_scores_v2026') || '{}');
        let hideMode = false;
        let currentFC = null;
        let fcMode = 'jpToZh';

        function init() {
            renderGrammar();
            renderVocab();
            updateProgress();
            
            document.getElementById('toggle-hide').addEventListener('click', () => {
                hideMode = !hideMode;
                document.body.classList.toggle('hide-mastered', hideMode);
                document.getElementById('toggle-label').innerText = hideMode ? "顯示全部" : "隱藏已掌握";
                document.getElementById('toggle-icon').innerText = hideMode ? "👁️‍🗨️" : "👁️";
            });

            document.getElementById('reset-progress').addEventListener('click', () => {
                document.getElementById('confirm-modal').style.display = 'flex';
            });

            document.getElementById('search-box').addEventListener('input', (e) => {
                renderVocab(e.target.value);
            });
        }

        function formatRuby(word, kana) {
            if (!kana || word === kana) return word;
            return `<ruby>${word}<rt>${kana}</rt></ruby>`;
        }

        function renderGrammar() {
            const container = document.getElementById('section-grammar');
            container.innerHTML = grammarList.map((g, idx) => `
                <div class="grammar-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center ${masteredIds.includes(g.id) ? 'is-mastered mastered' : ''}" data-id="${g.id}">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <span class="bg-violet-600 text-white text-[9px] px-2 py-1 rounded font-black tracking-widest text-center">G${idx+1}</span>
                            <h3 class="text-xl font-bold text-slate-900 japanese-text text-center text-center">${g.title}</h3>
                        </div>
                        <input type="checkbox" class="custom-checkbox text-center" ${masteredIds.includes(g.id) ? 'checked' : ''} onchange="toggleMastered('${g.id}')">
                    </div>
                    <p class="text-sm text-slate-600 mb-4 font-medium text-center text-center text-center text-center">${g.desc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl space-y-3">
                        ${g.ex.map(e => `
                            <div class="border-l-2 border-violet-200 pl-3">
                                <p class="japanese-text text-slate-800 text-base leading-relaxed text-center text-center text-center">${e.j}</p>
                                <p class="text-xs text-slate-500 mt-0.5 text-center text-center text-center">${e.c}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderVocab(filter = "") {
            const container = document.getElementById('vocab-body');
            const filteredData = vocabData.filter(v => 
                v[0].toLowerCase().includes(filter.toLowerCase()) || 
                v[1].toLowerCase().includes(filter.toLowerCase()) || 
                v[2].toLowerCase().includes(filter.toLowerCase())
            );
            
            container.innerHTML = filteredData.map((v, i) => {
                const id = `n2fv${i}`;
                const scores = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                const isMastered = masteredIds.includes(id);
                return `
                    <tr class="vocab-row transition-all hover:bg-violet-50 text-center ${isMastered ? 'is-mastered mastered' : ''}" data-id="${id}">
                        <td class="p-4 text-center">
                            <input type="checkbox" class="custom-checkbox text-center" ${isMastered ? 'checked' : ''} onchange="toggleMastered('${id}')">
                        </td>
                        <td class="p-4 font-mono text-slate-400 text-xs text-center border-r border-slate-50 text-center">V${i+1}</td>
                        <td class="p-4 text-center text-center">
                            <div class="japanese-text font-bold text-base text-slate-900">${v[0]}</div>
                            <div class="text-[10px] text-slate-400 japanese-text text-center text-center text-center text-center">${v[1]}</div>
                        </td>
                        <td class="p-4 text-center text-center text-center">
                            <span class="font-bold text-violet-700">${v[2]}</span>
                        </td>
                        <td class="p-4">
                            <p class="japanese-text text-slate-700 italic text-sm leading-relaxed text-center text-center mb-1">${v[3]}</p>
                            <p class="text-xs text-slate-500 text-center text-center">${v[4]}</p>
                        </td>
                        <td class="p-4 text-center text-center">
                            <div class="flex gap-4 items-center justify-center text-center">
                                <div class="flex flex-col text-center text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black text-center text-center text-center">日</span>
                                    <div class="w-10 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5 text-center text-center">
                                        <div class="h-full bg-violet-500" style="width: ${scores.jpToZh * 10}%"></div>
                                    </div>
                                </div>
                                <div class="flex flex-col text-center text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black text-center text-center text-center">中</span>
                                    <div class="w-10 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5 text-center text-center">
                                        <div class="h-full bg-fuchsia-400 text-center text-center" style="width: ${scores.zhToJp * 10}%"></div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function loadNextFC() {
            let pool = [];
            vocabData.forEach((v, i) => {
                const id = `n2fv${i}`;
                const score = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                if (!masteredIds.includes(id)) {
                    if (score.jpToZh < 10) pool.push({ v, id, mode: 'jpToZh' });
                    if (score.zhToJp < 10) pool.push({ v, id, mode: 'zhToJp' });
                }
            });

            if (pool.length === 0) {
                document.getElementById('fc-main-display').classList.add('hidden');
                document.getElementById('fc-controls').classList.add('hidden');
                document.getElementById('fc-header').classList.add('hidden');
                document.getElementById('fc-empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('fc-main-display').classList.remove('hidden');
            document.getElementById('fc-controls').classList.remove('hidden');
            document.getElementById('fc-header').classList.remove('hidden');
            document.getElementById('fc-empty-state').classList.add('hidden');
            document.getElementById('fc-answer-block').classList.remove('active');

            const pick = pool[Math.floor(Math.random() * pool.length)];
            currentFC = pick;
            fcMode = pick.mode;

            const header = document.getElementById('fc-header');
            if (fcMode === 'jpToZh') {
                header.className = "absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-violet-600 shadow-md transition-all";
                document.getElementById('fc-mode-text').innerText = '日譯中挑戰';
                document.getElementById('fc-question').innerHTML = formatRuby(pick.v[0], pick.v[1]);
                document.getElementById('fc-hint').innerText = "請回答中文解釋";
                document.getElementById('fc-target').innerText = pick.v[2];
                document.getElementById('fc-kana-display').innerText = "";
            } else {
                header.className = "absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-fuchsia-500 shadow-md transition-all";
                document.getElementById('fc-mode-text').innerText = '中譯日挑戰';
                document.getElementById('fc-question').innerText = pick.v[2];
                document.getElementById('fc-hint').innerText = "請回答日文漢字與讀音";
                document.getElementById('fc-target').innerText = pick.v[0];
                document.getElementById('fc-kana-display').innerText = pick.v[1] || "";
            }
            document.getElementById('fc-example').innerHTML = `${pick.v[3]}<br><span class="text-sm text-slate-500 mt-2 block">${pick.v[4]}</span>`;
            updateScoreUI();
        }

        function updateScoreUI() {
            const scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            const currentVal = scores[fcMode];
            document.getElementById('fc-current-score-text').innerText = currentVal;
            const dots = document.getElementById('fc-score-dots');
            dots.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.className = `w-1.5 h-1.5 rounded-full ${i < currentVal ? 'bg-white' : 'bg-white/30'}`;
                dots.appendChild(dot);
            }
        }

        function processFC(action) {
            if (!currentFC) return;
            if (action === 'answer') { document.getElementById('fc-answer-block').classList.add('active'); return; }

            let scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            if (action === 'master') scores[fcMode] = Math.min(10, scores[fcMode] + 5);
            else if (action === 'again') scores[fcMode] = Math.floor(scores[fcMode] / 2);
            
            vocabScores[currentFC.id] = scores;
            if (scores.jpToZh >= 10 && scores.zhToJp >= 10) {
                if (!masteredIds.includes(currentFC.id)) masteredIds.push(currentFC.id);
            }
            saveAndRefresh();
            loadNextFC();
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) {
                masteredIds.splice(index, 1);
            } else {
                masteredIds.push(id);
                vocabScores[id] = { jpToZh: 10, zhToJp: 10 };
            }
            saveAndRefresh(id);
        }

        function saveAndRefresh(id) {
            localStorage.setItem('n2_dual_mastery_v2026', JSON.stringify(masteredIds));
            localStorage.setItem('n2_dual_scores_v2026', JSON.stringify(vocabScores));
            if (id) renderVocab(document.getElementById('search-box').value);
            else { renderGrammar(); renderVocab(); }
            updateProgress();
        }

        function updateProgress() {
            // Strictly use grammarList and vocabData to prevent ReferenceError
            const total = grammarList.length + vocabData.length;
            const current = masteredIds.length;
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`section-${type}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active'); btn.classList.add('text-slate-400'); });
            document.getElementById(`tab-btn-${type}`).classList.add('tab-active');
            if (type === 'flashcard') loadNextFC();
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmReset() { masteredIds = []; vocabScores = {}; saveAndRefresh(); closeModal(); if (!document.getElementById('section-flashcard').classList.contains('hidden')) loadNextFC(); }

        window.onload = init;
    </script>
</body>
