<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow! N2 日本語達陣 - 終極全量學習系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; }
        ruby rt { font-size: 0.45em; color: #7c3aed; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #f5f3ff !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #7c3aed; }
        .tab-active { color: #7c3aed; border-bottom: 3px solid #7c3aed; }
        .grammar-card { transition: all 0.2s; border-left: 5px solid transparent; }
        .grammar-card:hover { border-left-color: #7c3aed; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        .reveal-info { display: none; }
        .reveal-info.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <header class="bg-violet-800 text-white py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl font-black mb-1 tracking-tight text-center">Meow! N2 日本語達陣</h1>
        <p class="text-violet-100 opacity-90 text-sm font-medium text-center">中高級：全方位核心語彙與進階文法系統</p>
    </header>

    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4 text-center">
            <div class="flex items-center gap-4 text-center">
                <div class="flex flex-col text-center">
                    <span class="text-[9px] text-slate-400 font-black uppercase tracking-widest text-center">N2 掌握進度</span>
                    <div class="flex items-center gap-2">
                        <div class="w-48 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-violet-500 transition-all duration-500"></div>
                        </div>
                        <span id="progress-text" class="text-xs font-bold text-violet-700">0%</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-semibold transition flex items-center gap-2 shadow-sm">
                    <span id="toggle-icon">👁️</span> <span id="toggle-label">隱藏已掌握</span>
                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-semibold transition flex items-center gap-2 shadow-sm">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-7xl">
        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap text-center">
            <button onclick="switchTab('grammar')" id="tab-btn-grammar" class="tab-btn px-6 py-4 font-bold text-lg tab-active transition">核心文法 (G1-G80)</button>
            <button onclick="switchTab('vocab')" id="tab-btn-vocab" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-violet-600 transition">全量單字庫 (V1-V810)</button>
            <button onclick="switchTab('flashcard')" id="tab-btn-flashcard" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-violet-600 transition">雙向學習卡</button>
        </div>

        <!-- Grammar Section -->
        <div id="section-grammar" class="tab-content grid grid-cols-1 lg:grid-cols-2 gap-6"></div>

        <!-- Vocab Section -->
        <div id="section-vocab" class="tab-content hidden text-center">
            <div class="mb-6 relative">
                <input type="text" id="search-box" placeholder="搜尋編號(V42)、單字、假名或中文..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-violet-500 outline-none transition shadow-sm text-center">
                <span class="absolute left-4 top-3.5 text-slate-400">🔍</span>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 border-b border-slate-200 text-center">
                            <tr>
                                <th class="p-4 w-16 text-center">掌握</th>
                                <th class="p-4 w-20 text-center text-violet-600">編號</th>
                                <th class="p-4 w-1/4">單字 / 假名</th>
                                <th class="p-4 w-1/4 text-violet-700">中文意義</th>
                                <th class="p-4 text-center">積分現況 (日/中)</th>
                            </tr>
                        </thead>
                        <tbody id="vocab-body" class="divide-y divide-slate-100 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Flashcard Section -->
        <div id="section-flashcard" class="tab-content hidden text-center">
            <div class="max-w-xl mx-auto">
                <div id="fc-container" class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-10 min-h-[500px] flex flex-col items-center justify-between text-center relative overflow-hidden transition-all">
                    <div id="fc-mode-display" class="absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white text-center">
                        <span id="fc-mode-text">模式載入中</span>
                        <div class="flex gap-1" id="fc-score-dots"></div>
                    </div>
                    <div id="fc-main-display" class="w-full flex-grow flex flex-col items-center justify-center pt-8 text-center">
                        <div id="fc-question" class="japanese-text text-5xl font-black text-slate-900 mb-2 leading-[1.5em] h-[2.5em] flex items-center justify-center text-center"></div>
                        <div id="fc-hint" class="text-slate-400 text-xs font-bold uppercase tracking-tighter h-4 mb-10 text-center"></div>
                        <div id="fc-answer-block" class="reveal-info w-full animate-fade-in border-t border-slate-100 pt-6 text-center">
                            <div id="fc-target" class="text-3xl font-bold text-violet-600 mb-2 japanese-text text-center text-center text-center text-center"></div>
                            <div id="fc-kana-display" class="text-slate-500 text-sm mb-6 japanese-text text-center"></div>
                            <div class="bg-violet-50 p-5 rounded-3xl text-left border border-violet-100">
                                <p class="text-[9px] font-black text-violet-400 uppercase mb-2 text-center text-center">N2 境語範例</p>
                                <p id="fc-example" class="japanese-text text-slate-700 text-base leading-relaxed text-center"></p>
                            </div>
                        </div>
                    </div>
                    <div id="fc-empty-state" class="hidden py-16">
                        <div class="text-7xl mb-6 text-center">🎓</div>
                        <h3 class="text-2xl font-black text-slate-900 mb-2 text-center">N2 終極掌握！</h3>
                        <p class="text-slate-500 text-sm text-center">太出色了！您已掌握目前清單中所有 810 個單字。</p>
                    </div>
                    <div id="fc-controls" class="w-full grid grid-cols-3 gap-4 mt-8 text-center">
                        <button onclick="processFC('again')" class="flex flex-col items-center py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-3xl transition-all active:scale-95 text-center">
                            <span class="text-2xl mb-1 text-center">🔄</span><span class="text-[10px] font-black text-center text-center text-center">再來</span>
                        </button>
                        <button onclick="processFC('answer')" id="fc-btn-answer" class="flex flex-col items-center py-4 bg-violet-600 hover:bg-violet-700 text-white rounded-3xl transition-all active:scale-95 shadow-lg shadow-violet-100 text-center text-center">
                            <span class="text-2xl mb-1 text-center text-center">💡</span><span class="text-[10px] font-black text-center text-center text-center text-center">答案</span>
                        </button>
                        <button onclick="processFC('master')" class="flex flex-col items-center py-4 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-3xl transition-all active:scale-95 text-center text-center text-center text-center text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center text-center">✅</span><span class="text-[10px] font-black text-center text-center text-center text-center text-center text-center text-center">掌握</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 text-center">
        <div class="bg-white rounded-[2rem] shadow-2xl max-w-sm w-full p-8 text-center text-center text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl text-center text-center text-center">🚫</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2 text-center text-center">重置 N2 進度？</h3>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed text-center">此操作將永久清除所有 810 個單字與 80 條文法的進度。建議在考前複習使用。</p>
            <div class="flex flex-col gap-3">
                <button onclick="confirmReset()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition shadow-lg shadow-red-200 text-center text-center text-center text-center">確定重置</button>
                <button onclick="closeModal()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition text-center text-center text-center text-center text-center">取消</button>
            </div>
        </div>
    </div>

    <footer class="bg-slate-900 text-slate-500 py-12 px-4 text-center text-center text-center">
        <div class="container mx-auto text-center text-sm">
            <p class="mb-4">© 2026 Meow! 日本語達陣學習計畫 - 終極全量補完版</p>
        </div>
    </footer>

    <script>
        // --- G1 - G80 完整文法列表 ---
        const grammarData = [
            { id: 'g1', title: 'あげく (に)', desc: '經過一番...之後，最後還是（通常接不好的結果）。', ex: [{j:'いろいろ考えたあげく、彼と別れることにした。', c:'考慮了各方面之後，最後還是決定和他分手。'}]},

            ["軍事", "ぐんじ", "軍事", "軍事。"],
            ["景気", "けいき", "景氣", "景気。"],
            ["警察", "けいさつ", "警察", "警察。"],
            ["警告", "けいこく", "警告", "警告。"],
            ["芸術", "げいじゅつ", "藝術", "芸術。"],
            ["契約", "けいやく", "合約", "契約。"],
            ["継続", "けいぞく", "繼續", "継続。"],
            ["結果", "けっか", "結果", "結果。"],
            ["欠陥", "けっかん", "缺陷", "欠陥。"],
            ["決算", "けっさん", "決算", "決算。"],
            ["欠席", "けっせき", "缺席", "缺席。"],
            ["欠點", "けってん", "缺點", "缺點。"],
            ["血壓", "けつあつ", "血壓", "血壓。"],
            ["限界", "げんかい", "極限", "限界。"],
            ["現金", "げんきん", "現金", "現金。"],
            ["現代", "げんだい", "現代", "現代。"],
            ["言動", "げんどう", "言動", "言動。"],
            ["原案", "げんあん", "原案", "原案。"]
        ];

        // --- 核心邏輯 (Persistence, Mastering & Sync) ---
        let masteredIds = JSON.parse(localStorage.getItem('meow_n2_pro_编号版_v4') || '[]');
        let vocabScores = JSON.parse(localStorage.getItem('meow_n2_scores_编号版_v4') || '{}');
        let hideMode = false;
        let currentFC = null;
        let fcMode = 'jpToZh';

        function init() {
            renderGrammar();
            renderVocab();
            updateProgress();
            
            document.getElementById('toggle-hide').addEventListener('click', () => {
                hideMode = !hideMode;
                document.body.classList.toggle('hide-mastered', hideMode);
                document.getElementById('toggle-label').innerText = hideMode ? "顯示全部內容" : "隱藏已掌握內容";
                document.getElementById('toggle-icon').innerText = hideMode ? "👁️‍🗨️" : "👁️";
            });

            document.getElementById('reset-progress').addEventListener('click', () => {
                document.getElementById('confirm-modal').style.display = 'flex';
            });

            document.getElementById('search-box').addEventListener('input', (e) => {
                renderVocab(e.target.value);
            });
        }

        function formatRuby(word, kana) {
            if (!kana || word === kana) return word;
            return `<ruby>${word}<rt>${kana}</rt></ruby>`;
        }

        function renderGrammar() {
            const container = document.getElementById('section-grammar');
            container.innerHTML = grammarData.map((g, idx) => `
                <div class="grammar-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200 ${masteredIds.includes(g.id) ? 'is-mastered mastered' : ''}" data-id="${g.id}">
                    <div class="flex justify-between items-start mb-4 text-center">
                        <div class="flex items-center gap-3">
                            <span class="bg-violet-600 text-white text-[9px] px-2 py-1 rounded font-black tracking-widest text-center">G${idx+1}</span>
                            <h3 class="text-xl font-bold text-slate-900 japanese-text text-center">${g.title}</h3>
                        </div>
                        <input type="checkbox" class="custom-checkbox" ${masteredIds.includes(g.id) ? 'checked' : ''} onchange="toggleMastered('${g.id}')">
                    </div>
                    <p class="text-sm text-slate-600 mb-4 font-medium text-center">${g.desc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl space-y-3">
                        ${g.ex.map(e => `
                            <div class="border-l-2 border-violet-200 pl-3">
                                <p class="japanese-text text-slate-800 text-base leading-relaxed text-center">${e.j}</p>
                                <p class="text-xs text-slate-500 mt-0.5 text-center">${e.c}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderVocab(filter = "") {
            const container = document.getElementById('vocab-body');
            const filteredData = rawVocab.filter((v, i) => 
                v[0].toLowerCase().includes(filter.toLowerCase()) || 
                v[1].toLowerCase().includes(filter.toLowerCase()) || 
                v[2].toLowerCase().includes(filter.toLowerCase()) ||
                (`V${i+1}`).toLowerCase().includes(filter.toLowerCase())
            );
            
            container.innerHTML = filteredData.map((v, i) => {
                const id = `n2fv${i}`;
                const scores = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                const isM = masteredIds.includes(id);
                return `
                    <tr class="vocab-row transition-all hover:bg-violet-50 text-center ${isM ? 'is-mastered mastered' : ''}" data-id="${id}">
                        <td class="p-4 text-center">
                            <input type="checkbox" class="custom-checkbox text-center" ${isM ? 'checked' : ''} onchange="toggleMastered('${id}')">
                        </td>
                        <td class="p-4 font-mono text-slate-400 text-xs text-center">V${i+1}</td>
                        <td class="p-4 text-center">
                            <div class="japanese-text font-bold text-lg text-slate-900 text-center">${v[0]}</div>
                            <div class="text-[10px] text-slate-400 japanese-text text-center">${v[1]}</div>
                        </td>
                        <td class="p-4 text-center text-center text-center">
                            <span class="font-bold text-violet-700 text-center">${v[2]}</span>
                        </td>
                        <td class="p-4 text-center">
                            <div class="flex gap-4 items-center justify-center text-center">
                                <div class="flex flex-col text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black text-center text-center text-center">日</span>
                                    <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5">
                                        <div class="h-full bg-violet-500 text-center" style="width: ${scores.jpToZh * 10}%"></div>
                                    </div>
                                </div>
                                <div class="flex flex-col text-center text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black text-center text-center text-center text-center text-center">中</span>
                                    <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5 text-center text-center text-center">
                                        <div class="h-full bg-cyan-500 text-center text-center" style="width: ${scores.zhToJp * 10}%"></div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function loadNextFlashcard() {
            let pool = [];
            rawVocab.forEach((v, i) => {
                const id = `n2fv${i}`;
                const score = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                if (!masteredIds.includes(id)) {
                    if (score.jpToZh < 10) pool.push({ word: v, id: id, mode: 'jpToZh' });
                    if (score.zhToJp < 10) pool.push({ word: v, id: id, mode: 'zhToJp' });
                }
            });

            if (pool.length === 0) {
                document.getElementById('fc-main-display').classList.add('hidden');
                document.getElementById('fc-controls').classList.add('hidden');
                document.getElementById('fc-empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('fc-main-display').classList.remove('hidden');
            document.getElementById('fc-controls').classList.remove('hidden');
            document.getElementById('fc-empty-state').classList.add('hidden');
            document.getElementById('fc-answer-block').classList.remove('active');

            const pick = pool[Math.floor(Math.random() * pool.length)];
            currentFC = pick;
            fcMode = pick.mode;

            const modeDisplay = document.getElementById('fc-mode-display');
            if (fcMode === 'jpToZh') {
                modeDisplay.className = "absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-violet-600 shadow-md transition-all text-center";
                document.getElementById('fc-mode-text').innerText = '日譯中挑戰';
                document.getElementById('fc-question').innerHTML = formatRuby(pick.word[0], pick.word[1]);
                document.getElementById('fc-hint').innerText = "請回憶中文意義";
                document.getElementById('fc-target').innerText = pick.word[2];
                document.getElementById('fc-kana-display').innerText = "";
            } else {
                modeDisplay.className = "absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-cyan-600 shadow-md transition-all text-center";
                document.getElementById('fc-mode-text').innerText = '中譯日挑戰';
                document.getElementById('fc-question').innerText = pick.word[2];
                document.getElementById('fc-hint').innerText = "請回憶日文漢字或讀音";
                document.getElementById('fc-target').innerText = pick.word[0];
                document.getElementById('fc-kana-display').innerText = pick.word[1] || "";
            }
            document.getElementById('fc-example').innerText = pick.word[3];
            updateFCScoreDisplay();
        }

        function updateFCScoreDisplay() {
            const score = (vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 })[fcMode];
            const dots = document.getElementById('fc-score-dots');
            dots.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.className = `w-1.5 h-1.5 rounded-full ${i < score ? 'bg-white' : 'bg-white/30'}`;
                dots.appendChild(dot);
            }
        }

        function processFC(action) {
            if (!currentFC) return;
            if (action === 'answer') { document.getElementById('fc-answer-block').classList.add('active'); return; }

            let scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            if (action === 'master') scores[fcMode] = Math.min(10, scores[fcMode] + 5);
            else if (action === 'again') scores[fcMode] = Math.floor(scores[fcMode] / 2);
            
            vocabScores[currentFC.id] = scores;
            if (scores.jpToZh >= 10 && scores.zhToJp >= 10) masteredIds.push(currentFC.id);
            saveAndRefresh();
            loadNextFlashcard();
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) masteredIds.splice(index, 1);
            else { masteredIds.push(id); vocabScores[id] = { jpToZh: 10, zhToJp: 10 }; }
            saveAndRefresh(id);
        }

        function saveAndRefresh(id) {
            localStorage.setItem('meow_n2_pro_编号版_v4', JSON.stringify(masteredIds));
            localStorage.setItem('meow_n2_scores_编号版_v4', JSON.stringify(vocabScores));
            if (id) renderVocab(document.getElementById('search-box').value);
            else { renderGrammar(); renderVocab(); }
            updateProgress();
        }

        function updateProgress() {
            const total = grammarData.length + rawVocab.length;
            const percent = total > 0 ? Math.round((masteredIds.length / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`section-${type}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active'); btn.classList.add('text-slate-400'); });
            document.getElementById(`tab-btn-${type}`).classList.add('tab-active');
            if (type === 'flashcard') loadNextFlashcard();
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmReset() { masteredIds = []; vocabScores = {}; saveAndRefresh(); closeModal(); if (!document.getElementById('section-flashcard').classList.contains('hidden')) loadNextFlashcard(); }

        window.onload = init;
    </script>
</body>
</html>
