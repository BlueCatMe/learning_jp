<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY! N2 日本語達陣 - 終極全量學習系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; }
        ruby rt { font-size: 0.45em; color: #7c3aed; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #f5f3ff !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #7c3aed; }
        .tab-active { color: #7c3aed; border-bottom: 3px solid #7c3aed; }
        .grammar-card { transition: all 0.2s; border-left: 5px solid transparent; }
        .grammar-card:hover { border-left-color: #7c3aed; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        .reveal-info { display: none; }
        .reveal-info.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <header class="bg-violet-800 text-white py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl font-black mb-1 tracking-tight">TRY! N2 日本語達陣</h1>
        <p class="text-violet-100 opacity-90 text-sm font-medium">全量單字庫 (600+) × 完整文法 (80+項) 學習導航</p>
    </header>

    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="flex flex-col">
                    <span class="text-[9px] text-slate-400 font-black uppercase tracking-widest text-center">N2 總進度</span>
                    <div class="flex items-center gap-2">
                        <div class="w-32 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-violet-500 transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <span id="progress-text" class="text-xs font-bold text-violet-700">0%</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2">
                    <span id="toggle-icon">👁️</span> <span id="toggle-label">隱藏已掌握</span>
                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap">
            <button onclick="switchTab('grammar')" id="tab-btn-grammar" class="tab-btn px-6 py-4 font-bold text-lg tab-active transition">核心文法 (80+)</button>
            <button onclick="switchTab('vocab')" id="tab-btn-vocab" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-violet-600 transition">全單字庫</button>
            <button onclick="switchTab('flashcard')" id="tab-btn-flashcard" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-violet-600 transition">雙向學習卡</button>
        </div>

        <div id="section-grammar" class="tab-content grid grid-cols-1 lg:grid-cols-2 gap-6"></div>

        <div id="section-vocab" class="tab-content hidden">
            <div class="mb-6 relative">
                <input type="text" id="search-box" placeholder="搜尋 N2 單字、假名或中文..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-violet-500 outline-none transition shadow-sm">
                <span class="absolute left-4 top-3.5 text-slate-400">🔍</span>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="p-4 w-16 text-center">掌握</th>
                                <th class="p-4 w-1/4">單字 / 假名</th>
                                <th class="p-4 w-1/5 text-violet-700">中文意義</th>
                                <th class="p-4">學習積分 (日 / 中)</th>
                            </tr>
                        </thead>
                        <tbody id="vocab-body" class="divide-y divide-slate-100 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="section-flashcard" class="tab-content hidden">
            <div class="max-w-lg mx-auto">
                <div id="fc-container" class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-8 min-h-[500px] flex flex-col items-center justify-between text-center relative overflow-hidden transition-all">
                    <div id="fc-mode-display" class="absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white">
                        <span id="fc-mode-text">模式載入中</span>
                        <div class="flex gap-1" id="fc-score-dots"></div>
                    </div>
                    <div id="fc-main-display" class="w-full flex-grow flex flex-col items-center justify-center pt-8">
                        <div id="fc-question" class="japanese-text text-5xl font-black text-slate-900 mb-2 leading-[1.5em] h-[2.5em] flex items-center justify-center text-center"></div>
                        <div id="fc-hint" class="text-slate-400 text-xs font-bold uppercase tracking-tighter h-4 mb-10 text-center"></div>
                        <div id="fc-answer-block" class="reveal-info w-full animate-fade-in border-t border-slate-100 pt-6">
                            <div id="fc-target" class="text-3xl font-bold text-violet-600 mb-2 japanese-text text-center"></div>
                            <div id="fc-kana-display" class="text-slate-500 text-sm mb-6 japanese-text text-center"></div>
                            <div class="bg-violet-50 p-5 rounded-3xl text-left border border-violet-100">
                                <p class="text-[9px] font-black text-violet-400 uppercase mb-2">學習範例</p>
                                <p id="fc-example" class="japanese-text text-slate-700 text-base leading-relaxed"></p>
                            </div>
                        </div>
                    </div>
                    <div id="fc-empty-state" class="hidden py-16">
                        <div class="text-7xl mb-6">🏆</div>
                        <h3 class="text-2xl font-black text-slate-900 mb-2 text-center">N2 達陣達成！</h3>
                        <p class="text-slate-500 text-sm text-center">恭喜！目前沒有需要加強的項目。</p>
                    </div>
                    <div id="fc-controls" class="w-full grid grid-cols-3 gap-4 mt-8">
                        <button onclick="processFC('again')" class="flex flex-col items-center py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-3xl transition-all active:scale-95">
                            <span class="text-2xl mb-1 text-center">🔄</span><span class="text-[10px] font-black text-center">再來</span>
                        </button>
                        <button onclick="processFC('answer')" id="fc-btn-answer" class="flex flex-col items-center py-4 bg-violet-600 hover:bg-violet-700 text-white rounded-3xl transition-all active:scale-95 shadow-lg shadow-violet-100">
                            <span class="text-2xl mb-1 text-center">💡</span><span class="text-[10px] font-black text-center">答案</span>
                        </button>
                        <button onclick="processFC('master')" class="flex flex-col items-center py-4 bg-green-100 hover:bg-green-200 text-green-700 rounded-3xl transition-all active:scale-95">
                            <span class="text-2xl mb-1 text-center">✅</span><span class="text-[10px] font-black text-center">掌握</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[2rem] shadow-2xl max-w-sm w-full p-8 text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl text-center">🚫</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2 text-center">確定重置進度嗎？</h3>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed text-center">這將清除所有 N2 掌握記錄、單字積分。動作無法復原。</p>
            <div class="flex flex-col gap-3">
                <button onclick="confirmReset()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition shadow-lg shadow-red-200">確定重置</button>
                <button onclick="closeModal()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition">取消</button>
            </div>
        </div>
    </div>

    <script>
        const grammarData = [
            { id: 'n2g1', title: 'あげく (に)', desc: '經過一番...之後,最後還是(通常接不好的結果)。', ex: [{j:'いろいろ考えたあげく、彼と別れることにした。', c:'考慮了各方面之後，最後還是決定和他分手。'}]},
            { id: 'n2g2', title: 'あまり', desc: '過於、太...：因程度過度而造成不好的結果。', ex: [{j:'緊張のあまり、声が震えてしまった。', c:'因為過於緊張，所以聲音顫抖。'}]},
            { id: 'n2g3', title: '一方 (で)', desc: '一方面~，另一方面~：用於對比或相反狀況。', ex: [{j:'私の仕事は夏は非常に忙しい一方、冬は暇になる。', c:'我的工作夏天非常忙，冬天就閒下來了。'}]},
            { id: 'n2g4', title: '一方だ', desc: '不斷地、趨勢：某種趨勢持續朝一方向發展。', ex: [{j:'インフルエンザの患者数は増える一方だ。', c:'流感患者人數持續增加。'}]},
            { id: 'n2g5', title: '上(に)', desc: '不僅...而且...：累加性質。', ex: [{j:'客の注文を間違えたうえに、皿を割るミスまでした。', c:'不僅弄錯了客人的點餐，還打破了盤子。'}]},
            { id: 'n2g6', title: '上で(は)', desc: '在...之後 / 在...方面：前提條件或範圍。', ex: [{j:'みんなの意見を聞いた上で決めました。', c:'聽取大家的意見之後決定的。'}]},
            { id: 'n2g7', title: '上は / 以上は', desc: '既然...就...：表示義務或強烈決心。', ex: [{j:'自分でやると言った以上は、最後までやらなければ。', c:'既然說了要自己做，就一定要做到最後。'}]},
            { id: 'n2g8', title: '～上 (じょう)', desc: '觀點/在...上：法律上、教育上、經濟上。', ex: [{j:'法律上は夫婦ではないんです。', c:'在法律上並不是夫妻。'}]},
            { id: 'n2g9', title: 'うちに', desc: '趁著... / 在...期間發生變化。', ex: [{j:'雨が強くならないうちに帰りましょう。', c:'趁雨還沒變大快回去吧。'}]},
            { id: 'n2g10', title: '得る (うる/える)', desc: '可能 / 不可能：あり得る、あり得ない。', ex: [{j:'そんなことはあり得ない。', c:'不可能有這種事。'}]},
            { id: 'n2g11', title: 'おきに', desc: '每隔...：時間、距離、數量。', ex: [{j:'バスは20分おきに発車する。', c:'巴士每隔20分鐘發車。'}]},
            { id: 'n2g12', title: '恐れがある', desc: '恐怕、有可能：產生不良影響。', ex: [{j:'激しい雨が降るおそれがある。', c:'有可能會下大雨。'}]},
            { id: 'n2g13', title: '限り (は)', desc: '只要...就... / 據我所知。', ex: [{j:'私の知る限り、彼は信用できる人だ。', c:'就我所知，他是個可以信任的人。'}]},
            { id: 'n2g14', title: 'かけて (ます形+)', desc: '動作剛開始還沒結束。', ex: [{j:'読みかけだった本を全部読んだ。', c:'把讀到一半的書全都讀完了。'}]},
            { id: 'n2g15', title: 'がたい (ます形+)', desc: '難以...：心理上很難。', ex: [{j:'山頂に立った時の感動は忘れがたい。', c:'站在山頂時的那份感動難以忘懷。'}]},
            { id: 'n2g16', title: 'がちだ', desc: '容易、經常：傾向於(不好的頻率)。', ex: [{j:'最近テニスの練習を休みがちだ。', c:'最近常常缺席網球練習。'}]},
            { id: 'n2g17', title: 'かと思うと', desc: '剛...就...：表示瞬間的變化。', ex: [{j:'暗くなったかと思ったら、大雨が降ってきた。', c:'天空才剛剛變暗，就下起大雨。'}]},
            { id: 'n2g18', title: 'かねない', desc: '有可能：不好的結果可能發生。', ex: [{j:'大事故が起きかねない危険な状態だ。', c:'是有可能發生重大事故的危險狀況。'}]},
            { id: 'n2g19', title: 'かねる (ます形+)', desc: '很難：客觀上很難做到。', ex: [{j:'現時点では判断しかねる。', c:'在現階段來說還很難判斷。'}]},
            { id: 'n2g20', title: 'かのように', desc: '宛如、好像：實際上並不是。', ex: [{j:'実際に見てきたかのように話した。', c:'說起話來好像真的去看過一樣。'}]},
            { id: 'n2g21', title: '～からいって', desc: '從...來看：判斷依據。', ex: [{j:'経済状態からいって、無理だ。', c:'從經濟狀態來看，是不可能的。'}]},
            { id: 'n2g22', title: '～からして', desc: '光從...來看：從小見大。', ex: [{j:'言葉からして冷たく感じる。', c:'光從說話方式就覺得很冷淡。'}]},
            { id: 'n2g23', title: '～からすると', desc: '從...的角度/身分來看。', ex: [{j:'新人である私からすると完璧だ。', c:'在我這新人的眼裡看來是完美的。'}]},
            { id: 'n2g24', title: 'からこそ', desc: '正因為...才...：強調原因。', ex: [{j:'今であるからこそ、手書きの手紙。', c:'正因為是現在，才要寫親筆信。'}]},
            { id: 'n2g25', title: 'からといって', desc: '雖說...但也(不一定)。', ex: [{j:'休みの日だからといって寝てばかり。', c:'雖說是假日，也不能光顧著睡。'}]},
            { id: 'n2g26', title: 'からには', desc: '既然...就...：決心與義務。', ex: [{j:'一度決心したからには遣り抜く。', c:'既然決心了就要堅持到底。'}]},
            { id: 'n2g27', title: '～気味 (ぎみ)', desc: '有點...的感覺(不好的)。', ex: [{j:'風邪気味なので、学校を休む。', c:'因為有點感冒，所以請假。'}]},
            { id: 'n2g28', title: '～きり', desc: '自從...之後就再也沒...。', ex: [{j:'先輩の結婚式で会ったきりだ。', c:'自從在學長的婚禮見面後就沒再見。'}]},
            { id: 'n2g29', title: '～きる / きれる', desc: '完全做完 / 做得到。', ex: [{j:'10キロを走りきった。', c:'全程跑完了10公里。'}]},
            { id: 'n2g30', title: '～げ', desc: '看起來一副...樣子(心裡狀態)。', ex: [{j:'彼は悲しげな様子で話した。', c:'他帶著悲傷的神情說著。'}]},
            { id: 'n2g31', title: 'こと (命令)', desc: '命令/規定：需遵守的事項。', ex: [{j:'テニスシューズを履くこと。', c:'請務必穿著網球鞋。'}]},
            { id: 'n2g32', title: 'ことだ', desc: '勸告/應該：提議。', ex: [{j:'遊んでいないで働くことだ。', c:'應該別遊手好閒快去工作。'}]},
            { id: 'n2g33', title: 'ことから', desc: '由於... / 從...來看。', ex: [{j:'耳のような形から耳島と呼ばれる。', c:'因為像耳朵的形狀所以被稱為耳島。'}]},
            { id: 'n2g34', title: 'ことだから', desc: '正因為是...(熟悉的人格)。', ex: [{j:'まじめな鈴木さんのことだから。', c:'正因為是認真的鈴木先生(一定沒問題)。'}]},
            { id: 'n2g35', title: 'ことなく', desc: '沒有...地：持續動作。', ex: [{j:'休むことなく働いている。', c:'不休息地工作著。'}]},
            { id: 'n2g36', title: 'ことに (感情詞+)', desc: '令人...的是...：強調心情。', ex: [{j:'不思議なことに住んでいるような気が。', c:'不可思議的是，有種住在那的感覺。'}]},
            { id: 'n2g37', title: '際 (に)', desc: '...的時候 / 藉此時機。', ex: [{j:'帰省した際に、先生を訪ねた。', c:'在返鄉之際拜訪了老師。'}]},
            { id: 'n2g38', title: 'さえ / すら', desc: '甚至、連...都。', ex: [{j:'質問の内容すら理解できていない。', c:'連問題內容都無法理解。'}]},
            { id: 'n2g39', title: 'さえ～ば', desc: '只要...就...：唯一條件。', ex: [{j:'鶏肉と卵さえあれば作れる。', c:'只要有雞肉和蛋就能做。'}]},
            { id: 'n2g40', title: 'ざるを得ない', desc: '不得不、被迫...。', ex: [{j:'輸入に頼らざるを得ない。', c:'不得不仰賴進口。'}]},
            { id: 'n2g41', title: '次第 (しだい)', desc: '一旦...馬上... / 取決於...。', ex: [{j:'決まり次第、お知らせします。', c:'一決定了會立即通知。'}]},
            { id: 'n2g42', title: 'たところ', desc: '沒想到...、結果... (意外感)。', ex: [{j:'申し込んだところ、断られた。', c:'申請採訪結果卻被婉拒了。'}]},
            { id: 'n2g43', title: 'どころか / どころではない', desc: '豈止 / 哪有空...。', ex: [{j:'映画どころではない。', c:'哪裡有空看電影(更迫切的事)。'}]},
            { id: 'n2g44', title: '意向形 + とする', desc: '正要做... / 試圖...。', ex: [{j:'家を出ようとした時に。', c:'正要出門的時候。'}]},
            { id: 'n2g45', title: '意向形 + としている', desc: '即將要發生某種現象。', ex: [{j:'夏休みも終わろうとしています。', c:'暑假也將要結束了。'}]},
            { id: 'n2g46', title: '意向形 + と(は)しない', desc: '完全不想、不願意做...。', ex: [{j:'質問に答えようとしない。', c:'完全不願意回答問題。'}]},
            { id: 'n2g47', title: 'ようがない', desc: '沒辦法、缺乏手段。', ex: [{j:'直しようがない。', c:'沒辦法修理了。'}]},
            { id: 'n2g48', title: 'ようなら', desc: '如果是那種情況的話。', ex: [{j:'熱が下がらないようであれば。', c:'如果熱度一直沒退的話。'}]},
            { id: 'n2g49', title: 'わけだ', desc: '難怪、理所當然 / 換言之。', ex: [{j:'10年もいたから上手なわけだ。', c:'待了10年難怪日文好。'}]},
            { id: 'n2g50', title: 'わけがない', desc: '絕不可能、沒道理。', ex: [{j:'ここにいるわけないじゃない。', c:'不可能在這裡的不是嗎。'}]},
            { id: 'n2g51', title: 'わけではない', desc: '並非、並不是...。', ex: [{j:'本当に行けないわけではない。', c:'並非真的不能去。'}]},
            { id: 'n2g52', title: 'わけにはいかない', desc: '不能、無法(常識/理由)。', ex: [{j:'休むわけにはいかないんだ。', c:'因為重要不能休假。'}]},
            { id: 'n2g53', title: '句尾的もの (もん)', desc: '因為...嘛(撒嬌/辯解)。', ex: [{j:'地図を持っているもの。', c:'因為我有帶地圖嘛。'}]},

        function renderGrammar() {
            const container = document.getElementById('section-grammar');
            container.innerHTML = grammarData.map(g => `
                <div class="grammar-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200 ${masteredIds.includes(g.id) ? 'is-mastered mastered' : ''}" data-id="${g.id}">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <span class="bg-violet-600 text-white text-[9px] px-2 py-1 rounded font-black tracking-widest text-center">N2文法</span>
                            <h3 class="text-xl font-bold text-slate-900 japanese-text text-center">${g.title}</h3>
                        </div>
                        <input type="checkbox" class="custom-checkbox" ${masteredIds.includes(g.id) ? 'checked' : ''} onchange="toggleMastered('${g.id}')">
                    </div>
                    <p class="text-sm text-slate-600 mb-4 font-medium text-center">${g.desc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl space-y-3">
                        ${g.ex.map(e => `
                            <div class="border-l-2 border-violet-200 pl-3">
                                <p class="japanese-text text-slate-800 text-base leading-relaxed text-center">${e.j}</p>
                                <p class="text-xs text-slate-500 mt-0.5 text-center">${e.c}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderVocab(filter = "") {
            const container = document.getElementById('vocab-body');
            const filteredData = rawVocab.filter(v => 
                v[0].toLowerCase().includes(filter.toLowerCase()) || 
                v[1].toLowerCase().includes(filter.toLowerCase()) || 
                v[2].toLowerCase().includes(filter.toLowerCase())
            );
            
            container.innerHTML = filteredData.map((v, i) => {
                const id = `n2fv${i}`;
                const score = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                const isMastered = masteredIds.includes(id);
                return `
                    <tr class="vocab-row transition-all hover:bg-violet-50/30 ${isMastered ? 'is-mastered mastered' : ''}" data-id="${id}">
                        <td class="p-4 text-center">
                            <input type="checkbox" class="custom-checkbox" ${isMastered ? 'checked' : ''} onchange="toggleMastered('${id}')">
                        </td>
                        <td class="p-4">
                            <div class="japanese-text font-bold text-base text-slate-900">${v[0]}</div>
                            <div class="text-[10px] text-slate-400 japanese-text">${v[1]}</div>
                        </td>
                        <td class="p-4 text-violet-700 font-bold">${v[2]}</td>
                        <td class="p-4">
                            <div class="flex gap-4 items-center">
                                <div class="flex flex-col">
                                    <span class="text-[8px] text-slate-400 font-black">日譯中</span>
                                    <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5"><div class="h-full bg-violet-500" style="width: ${score.jpToZh * 10}%"></div></div>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-[8px] text-slate-400 font-black">中譯日</span>
                                    <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5"><div class="h-full bg-cyan-500" style="width: ${score.zhToJp * 10}%"></div></div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function loadNextFC() {
            let pool = [];
            rawVocab.forEach((v, i) => {
                const id = `n2fv${i}`;
                const score = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                if (!masteredIds.includes(id)) {
                    if (score.jpToZh < 10) pool.push({ v, id, mode: 'jpToZh' });
                    if (score.zhToJp < 10) pool.push({ v, id, mode: 'zhToJp' });
                }
            });

            if (pool.length === 0) {
                document.getElementById('fc-main-display').classList.add('hidden');
                document.getElementById('fc-controls').classList.add('hidden');
                document.getElementById('fc-mode-display').classList.add('hidden');
                document.getElementById('fc-empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('fc-main-display').classList.remove('hidden');
            document.getElementById('fc-controls').classList.remove('hidden');
            document.getElementById('fc-mode-display').classList.remove('hidden');
            document.getElementById('fc-empty-state').classList.add('hidden');
            document.getElementById('fc-answer-block').classList.remove('active');

            const pick = pool[Math.floor(Math.random() * pool.length)];
            currentFC = pick;
            fcMode = pick.mode;

            const modeBadge = document.getElementById('fc-mode-display');
            if (fcMode === 'jpToZh') {
                modeBadge.className = "absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-violet-600 shadow-md";
                document.getElementById('fc-mode-text').innerText = '日譯中挑戰';
                document.getElementById('fc-question').innerHTML = formatRuby(pick.v[0], pick.v[1]);
                document.getElementById('fc-hint').innerText = "請回想中文解釋";
                document.getElementById('fc-target').innerText = pick.v[2];
                document.getElementById('fc-kana-display').innerText = ""; 
            } else {
                modeBadge.className = "absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-cyan-600 shadow-md";
                document.getElementById('fc-mode-text').innerText = '中譯日挑戰';
                document.getElementById('fc-question').innerHTML = pick.v[2];
                document.getElementById('fc-hint').innerText = "請回想日文讀音或漢字";
                document.getElementById('fc-target').innerText = pick.v[0];
                document.getElementById('fc-kana-display').innerText = pick.v[1] || "";
            }
            document.getElementById('fc-example').innerText = pick.v[3];
            updateScoreUI();
        }

        function updateScoreUI() {
            const scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            const currentVal = scores[fcMode];
            document.getElementById('fc-current-score-text').innerText = currentVal;
            const dots = document.getElementById('fc-score-dots');
            dots.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.className = `w-1.5 h-1.5 rounded-full ${i < currentVal ? 'bg-white' : 'bg-white/30'}`;
                dots.appendChild(dot);
            }
        }

        function processFC(action) {
            if (!currentFC) return;
            if (action === 'answer') { document.getElementById('fc-answer-block').classList.add('active'); return; }

            let scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            let val = scores[fcMode];

            if (action === 'master') val = Math.min(10, val + 5);
            else if (action === 'again') val = Math.floor(val / 2);
            
            scores[fcMode] = val;
            vocabScores[currentFC.id] = scores;

            if (scores.jpToZh >= 10 && scores.zhToJp >= 10) {
                if (!masteredIds.includes(currentFC.id)) masteredIds.push(currentFC.id);
            }
            saveAndSync();
            loadNextFC();
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) masteredIds.splice(index, 1);
            else { masteredIds.push(id); vocabScores[id] = { jpToZh: 10, zhToJp: 10 }; }
            saveAndSync(id);
        }

        function saveAndSync(id) {
            localStorage.setItem('n2_full_mastery_final', JSON.stringify(masteredIds));
            localStorage.setItem('n2_full_scores_final', JSON.stringify(vocabScores));
            if (id) renderVocab(document.getElementById('search-box').value);
            else { renderGrammar(); renderVocab(); }
            updateProgress();
        }

        function updateProgress() {
            const total = grammarData.length + rawVocab.length;
            const percent = total > 0 ? Math.round((masteredIds.length / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`section-${type}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active'); btn.classList.add('text-slate-400'); });
            document.getElementById(`tab-btn-${type}`).classList.add('tab-active');
            if (type === 'flashcard') loadNextFC();
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmReset() { masteredIds = []; vocabScores = {}; saveAndSync(); closeModal(); if (!document.getElementById('section-flashcard').classList.contains('hidden')) loadNextFC(); }

        window.onload = init;
    </script>
</body>
</html>
