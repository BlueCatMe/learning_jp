<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow! N3 日本語達陣 - 終極全量去重系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; }
        ruby rt { font-size: 0.45em; color: #059669; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #f0fdf4 !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #059669; }
        .tab-active { color: #059669; border-bottom: 3px solid #059669; }
        .grammar-card { transition: all 0.2s; border-left: 5px solid transparent; }
        .grammar-card:hover { border-left-color: #059669; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        .reveal-info { display: none; }
        .reveal-info.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20 text-center">

    <header class="bg-emerald-800 text-white py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl font-black mb-1 tracking-tight">Meow! N3 日本語達陣</h1>
        <p class="text-emerald-100 opacity-90 text-sm font-medium">中級橋樑：全方位核心語彙與 75 項完整文法系統</p>
    </header>

    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm text-center">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 border border-slate-200 shadow-sm">🏠 首頁</a>
                <div class="flex flex-col">
                    <span class="text-[9px] text-slate-400 font-black uppercase tracking-widest">N3 總掌握進度</span>
                    <div class="flex items-center gap-2">
                        <div class="w-40 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-emerald-600 transition-all duration-500"></div>
                        </div>
                        <span id="progress-text" class="text-xs font-bold text-emerald-700">0%</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm">
                    <span id="toggle-icon">👁️</span> <span id="toggle-label">隱藏已掌握</span>
                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-7xl text-center">
        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap">
            <button onclick="switchTab('grammar')" id="tab-btn-grammar" class="tab-btn px-6 py-4 font-bold text-lg tab-active transition">核心文法 (G1-G75)</button>
            <button onclick="switchTab('vocab')" id="tab-btn-vocab" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-emerald-600 transition">全量單字庫 (去重版)</button>
            <button onclick="switchTab('flashcard')" id="tab-btn-flashcard" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-emerald-600 transition">雙向智能學習卡</button>
        </div>

        <!-- Grammar Section -->
        <div id="section-grammar" class="tab-content grid grid-cols-1 lg:grid-cols-2 gap-6"></div>

        <!-- Vocab Section -->
        <div id="section-vocab" class="tab-content hidden">
            <div class="mb-6 relative">
                <input type="text" id="search-box" placeholder="搜尋漢字、假名或中文意義..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none transition shadow-sm">
                <span class="absolute left-4 top-3.5 text-slate-400">🔍</span>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 border-b border-slate-200 text-center">
                            <tr>
                                <th class="p-4 w-16 text-center">掌握</th>
                                <th class="p-4 w-20 text-center text-emerald-600 font-bold border-r">編號</th>
                                <th class="p-4 w-1/5 text-center">單字 / 假名</th>
                                <th class="p-4 w-1/5 text-emerald-700 text-center">中文意義</th>
                                <th class="p-4 text-center">實戰例句</th>
                                <th class="p-4 w-24 text-center">雙向積分</th>
                            </tr>
                        </thead>
                        <tbody id="vocab-body" class="divide-y divide-slate-100 text-sm text-center"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Flashcard Section -->
        <div id="section-flashcard" class="tab-content hidden">
            <div class="max-w-lg mx-auto text-center">
                <div id="fc-container" class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-10 min-h-[500px] flex flex-col items-center justify-between relative overflow-hidden transition-all">
                    
                    <!-- Mode & Score Header -->
                    <div id="fc-header" class="absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white shadow-md transition-all">
                        <div class="flex items-center gap-2">
                            <span id="fc-mode-text">模式載入中</span>
                            <span class="bg-white/20 px-2 py-0.5 rounded text-[9px] font-bold">積分: <span id="fc-current-score-text">0</span> / 10</span>
                        </div>
                        <div class="flex gap-1" id="fc-score-dots"></div>
                    </div>

                    <div id="fc-main-display" class="w-full flex-grow flex flex-col items-center justify-center pt-8">
                        <div id="fc-question" class="japanese-text text-5xl font-black text-slate-900 mb-2 leading-[1.5em] h-[2.5em] flex items-center justify-center"></div>
                        <div id="fc-hint" class="text-slate-400 text-xs font-bold uppercase tracking-tighter h-4 mb-10"></div>
                        
                        <!-- Answer Block -->
                        <div id="fc-answer-block" class="reveal-info w-full animate-fade-in border-t border-slate-100 pt-6">
                            <div id="fc-target" class="text-3xl font-bold text-emerald-600 mb-2 japanese-text"></div>
                            <div id="fc-kana-display" class="text-slate-500 text-sm mb-6 japanese-text"></div>
                            <div class="bg-emerald-50 p-5 rounded-3xl text-left border border-emerald-100">
                                <p class="text-[9px] font-black text-emerald-400 uppercase mb-2">N3 實戰範本</p>
                                <p id="fc-example" class="japanese-text text-slate-700 text-base leading-relaxed"></p>
                            </div>
                        </div>
                    </div>

                    <div id="fc-empty-state" class="hidden py-16">
                        <div class="text-7xl mb-6">🏆</div>
                        <h3 class="text-2xl font-black text-slate-900 mb-2">N3 挑戰全量達成</h3>
                        <p class="text-slate-500 text-sm">恭喜！您已熟悉目前清單內的所有真實單字。</p>
                    </div>

                    <!-- Controls -->
                    <div id="fc-controls" class="w-full grid grid-cols-3 gap-4 mt-8">
                        <button onclick="processFC('again')" class="flex flex-col items-center py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-3xl transition-all active:scale-95">
                            <span class="text-2xl mb-1">🔄</span><span class="text-[10px] font-black">再來</span>
                        </button>
                        <button onclick="processFC('answer')" id="fc-btn-answer" class="flex flex-col items-center py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-3xl transition-all active:scale-95 shadow-lg shadow-emerald-100">
                            <span class="text-2xl mb-1">💡</span><span class="text-[10px] font-black">答案</span>
                        </button>
                        <button onclick="processFC('master')" class="flex flex-col items-center py-4 bg-green-100 hover:bg-green-200 text-green-700 rounded-3xl transition-all active:scale-95">
                            <span class="text-2xl mb-1">✅</span><span class="text-[10px] font-black">掌握</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Reset Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[2rem] shadow-2xl max-w-sm w-full p-8 text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">🚫</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2">重置 N3 進度？</h3>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed">這將清除所有掌握狀態與雙向積分。動作無法復原。</p>
            <div class="flex flex-col gap-3">
                <button onclick="confirmReset()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition shadow-lg shadow-red-200">確定重置</button>
                <button onclick="closeModal()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition">取消返回</button>
            </div>
        </div>
    </div>

    <footer class="bg-slate-900 text-slate-500 py-12 px-4 text-center">
        <div class="container mx-auto text-sm">
            <p class="mb-4">© 2026 Meow! 日本語達陣學習計畫 - N3 終極修正版</p>
        </div>
    </footer>

    <script>
        // --- N3 核心文法 (完整 60 項) ---
        const grammarData = [
            { id: 'g1', title: '～うちに', desc: '趁著某個狀態還沒發生變化前，做某事。', ex: [{j: '<ruby>暗<rt>くら</rt></ruby>くならないうちに、<ruby>帰<rt>かえ</rt></ruby>りましょう。', c: '趁天還沒黑，回家吧。'}]},
            { id: 'g2', title: '～間に / ～間', desc: '在某個持續的期間內 / 期間中一直。', ex: [{j: '<ruby>留守<rt>るす</rt></ruby>の<ruby>間<rt>あいだ</rt></ruby>に、泥棒が入った。', c: '不在家期間，小偷闖進來了。'}]},
            { id: 'g3', title: '～たところ', desc: '做了某事後，發現了某個結果。', ex: [{j: '先生に<ruby>聞<rt>き</rt></ruby>いたところ、<ruby>間違<rt>まちが</rt></ruby>いがわかった。', c: '問了老師後，發現了錯誤。'}]},
            { id: 'g4', title: '～たとたん', desc: '剛一...就立刻...（帶有驚訝感）。', ex: [{j: '<ruby>窓<rt>まど</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けたとたん、<ruby>風<rt>かぜ</rt></ruby>が入ってきた。', c: '剛一開窗，風就吹進來了。'}]},
            { id: 'g5', title: '～たびに', desc: '每當...。', ex: [{j: 'その<ruby>歌<rt>うた</rt></ruby>を<ruby>聞<rt>き</rt></ruby>くたびに、子供のころを<ruby>思<rt>おも</rt></ruby>い出す。', c: '每當聽這首歌，就會想起小時候。'}]},
            { id: 'g6', title: '～最中に', desc: '正當...的最高潮時。', ex: [{j: '<ruby>会議<rt>かいぎ</rt></ruby>の<ruby>最中<rt>さいちゅう</rt></ruby>に<ruby>電話<rt>でんわ</rt></ruby>が鳴った。', c: '開會正進行到一半時電話響了。'}]},
            { id: 'g7', title: '～から～にかけて', desc: '從...到...（表示模糊的時間或空間範圍）。', ex: [{j: '<ruby>昨日<rt>きのう</rt></ruby>から<ruby>今日<rt>きょう</rt></ruby>にかけて<ruby>大雪<rt>おおゆき</rt></ruby>が降った。', c: '從昨天到今天下了大雪。'}]},
            { id: 'g8', title: '～を通して / を通じて', desc: '透過... / 在整個...期間。', ex: [{j: '友人を<ruby>通<rt>とお</rt></ruby>して彼と知り合った。', c: '透過朋友認識了他。'}]},
            { id: 'g9', title: '～際（に）', desc: '...的時候（正式用語）。', ex: [{j: '<ruby>帰国<rt>きこく</rt></ruby>の際に<ruby>連絡<rt>れんらく</rt></ruby>してください。', c: '回國時請聯絡。'}]},
            { id: 'g10', title: '～に際して / にあたって', desc: '在...之際（面臨重大事件前）。', ex: [{j: '<ruby>開店<rt>かいてん</rt></ruby>にあたって<ruby>挨拶<rt>あいさつ</rt></ruby>する。', c: '在開店之際致詞。'}]},
            { id: 'g11', title: '～につれて', desc: '伴隨...（A發生改變，B也隨之改變）。', ex: [{j: '<ruby>年<rt>とし</rt></ruby>をとるにつれて、<ruby>体<rt>からだ</rt></ruby>が弱くなる。', c: '隨著年紀增長，身體變弱了。'}]},
            { id: 'g12', title: '～に伴って / に伴い', desc: '伴隨著...（較大型的變化）。', ex: [{j: '人口の<ruby>増加<rt>ぞうか</rt></ruby>に伴って、問題が起きた。', c: '伴隨人口增加，產生了問題。'}]},
            { id: 'g13', title: '～とともに', desc: '和...一起 / 隨著...。', ex: [{j: '<ruby>時代<rt>じだい</rt></ruby>とともに<ruby>変化<rt>へんか</rt></ruby>する。', c: '隨著時代改變。'}]},
            { id: 'g14', title: '～に従って', desc: '遵從... / 隨著...。', ex: [{j: '<ruby>指示<rt>しじ</rt></ruby>に従って<ruby>行動<rt>こうどう</rt></ruby>する。', c: '遵從指示行動。'}]},
            { id: 'g15', title: '～たあげく', desc: '經過一番...最後還是（常接負面結果）。', ex: [{j: '悩んだあげく、<ruby>会社<rt>かいしゃ</rt></ruby>を<ruby>辞<rt>や</rt></ruby>めた。', c: '煩惱了半天，最後還是辭職了。'}]},
            { id: 'g16', title: '～すえに', desc: '在經歷...之後的最終結果。', ex: [{j: '苦労したすえに、<ruby>成功<rt>せいこう</rt></ruby>した。', c: '辛苦過後終於成功了。'}]},
            { id: 'g17', title: '～一方だ', desc: '趨勢不斷向某一方向發展（多為負面）。', ex: [{j: '<ruby>病気<rt>びょうき</rt></ruby>は<ruby>悪<rt>わる</rt></ruby>くなる一方だ。', c: '病情不斷惡化。'}]},
            { id: 'g18', title: '～つつある', desc: '正在持續變化中（正式）。', ex: [{j: '<ruby>景気<rt>けいき</rt></ruby>はよくなりつつある。', c: '景氣正漸漸好轉。'}]},
            { id: 'g19', title: '～つつ', desc: '一邊...一邊...（等同ながら，較正式）。', ex: [{j: '<ruby>将来<rt>しょうらい</rt></ruby>を<ruby>考<rt>かんが</rt></ruby>えつつ<ruby>進路<rt>しんろ</rt></ruby>を決める。', c: '一邊思考未來一邊決定出路。'}]},
            { id: 'g20', title: '～て以来', desc: '自從...以來就一直...。', ex: [{j: '<ruby>卒業<rt>そつぎょう</rt></ruby>して以来、彼に<ruby>会<rt>あ</rt></ruby>っていない。', c: '畢業以來就沒見過他了。'}]},
            { id: 'g21', title: '～てはじめて', desc: '直到...才...。', ex: [{j: '<ruby>病気<rt>びょうき</rt></ruby>になってはじめて<ruby>健康<rt>けんこう</rt></ruby>の<ruby>大切<rt>たいせつ</rt></ruby>さを知った。', c: '直到生病才體會到健康的重要。'}]},
            { id: 'g22', title: '～次第', desc: '一旦...就立即...。', ex: [{j: '<ruby>決<rt>き</rt></ruby>まり次第、<ruby>連絡<rt>れんらく</rt></ruby>します。', c: '一旦決定就聯絡。'}]},
            { id: 'g23', title: '～てからでないと', desc: '如果不先...就不能...。', ex: [{j: '<ruby>宿題<rt>しゅくだい</rt></ruby>をしてからでないと<ruby>遊<rt>あそ</rt></ruby>べない。', c: '如果不先做完作業就不能玩。'}]},
            { id: 'g24', title: '～てしかたがない', desc: '...得不得了。', ex: [{j: '<ruby>気<rt>き</rt></ruby>になってしかたがない。', c: '在意得不得了。'}]},
            { id: 'g25', title: '～てたまらない', desc: '...得受不了。', ex: [{j: '<ruby>痛<rt>いた</rt></ruby>くてたまらない。', c: '痛得受不了。'}]},
            { id: 'g26', title: '～てならない', desc: '非常... / 不禁...。', ex: [{j: '<ruby>残念<rt>ざんねん</rt></ruby>でならない。', c: '遺憾得不得了。'}]},
            { id: 'g27', title: '～ないではいられない', desc: '忍不住...。', ex: [{j: '<ruby>笑<rt>わら</rt></ruby>わないではいられない。', c: '忍不住笑了。'}]},
            { id: 'g28', title: '～ずにはいられない', desc: '忍不住...（書面語）。', ex: [{j: '<ruby>泣<rt>な</rt></ruby>かずにはいられない。', c: '忍不住哭了。'}]},
            { id: 'g29', title: '～に決まっている', desc: '一定是... / 肯定是...。', ex: [{j: 'そんなの<ruby>無理<rt>むり</rt></ruby>に決まっている。', c: '那種事肯定是行不通的。'}]},
            { id: 'g30', title: '～に違いない', desc: '確信無疑是...。', ex: [{j: '彼が<ruby>犯人<rt>はんにん</rt></ruby>に違いない。', c: '他一定是犯人。'}]},
            { id: 'g31', title: '～に相違ない', desc: '一定...（非常正式）。', ex: [{j: '彼が<ruby>成功<rt>せいこう</rt></ruby>するに相違ない。', c: '他一定會成功。'}]},
            { id: 'g32', title: '～はずがない', desc: '絕不可能...。', ex: [{j: '<ruby>知<rt>し</rt></ruby>っているはずがない。', c: '不可能知道。'}]},
            { id: 'g33', title: '～わけがない', desc: '沒有理由... / 絕不可能。', ex: [{j: 'そんな<ruby>簡単<rt>かんたん</rt></ruby>なわけがない。', c: '不可能那麼簡單。'}]},
            { id: 'g34', title: '～わけではない', desc: '並非...。', ex: [{j: '<ruby>嫌<rt>きら</rt></ruby>いなわけではない。', c: '並非討厭。'}]},
            { id: 'g35', title: '～というわけではない', desc: '並不是說...。', ex: [{j: '<ruby>お金<rt>かね</rt></ruby>がないというわけではない。', c: '並不是說沒有錢。'}]},
            { id: 'g36', title: '～とは限らない', desc: '未必... / 不一定...。', ex: [{j: '<ruby>高<rt>たか</rt></ruby>いからいいとは限らない。', c: '不一定貴的就比較好。'}]},
            { id: 'g37', title: '～わけにはいかない', desc: '不能...（因道義常理）。', ex: [{j: '<ruby>休<rt>やす</rt></ruby>むわけにはいかない。', c: '不能休息。'}]},
            { id: 'g38', title: '～ないわけにはいかない', desc: '不能不... / 必須...。', ex: [{j: '<ruby>行<rt>い</rt></ruby>かないわけにはいかない。', c: '不能不去。'}]},
            { id: 'g39', title: '～ことだ', desc: '應該... / 最好...。', ex: [{j: '早く<ruby>寝<rt>ね</rt></ruby>ることだ。', c: '你最好早點睡。'}]},
            { id: 'g40', title: '～べきだ', desc: '理應... / 應該...。', ex: [{j: '<ruby>約束<rt>やくそく</rt></ruby>は守るべきだ。', c: '理應遵守約定。'}]},
            { id: 'g41', title: '～ものだ', desc: '常理 / 感嘆 / 回憶。', ex: [{j: '<ruby>時間<rt>じかん</rt></ruby>は早いものだ。', c: '時間過得真快啊。'}]},

        // --- Core States ---
        let masteredIds = JSON.parse(localStorage.getItem('n3_dual_mastery_v2026_q2') || '[]');
        let vocabScores = JSON.parse(localStorage.getItem('n3_dual_scores_v2026_q2') || '{}');
        let hideMode = false;
        let currentFC = null;
        let fcMode = 'jpToZh';

        function init() {
            renderGrammar();
            renderVocab();
            updateProgress();
            
            document.getElementById('toggle-hide').addEventListener('click', () => {
                hideMode = !hideMode;
                document.body.classList.toggle('hide-mastered', hideMode);
                document.getElementById('toggle-label').innerText = hideMode ? "顯示全部" : "隱藏已掌握";
                document.getElementById('toggle-icon').innerText = hideMode ? "👁️‍🗨️" : "👁️";
            });

            document.getElementById('reset-progress').addEventListener('click', () => {
                document.getElementById('confirm-modal').style.display = 'flex';
            });

            document.getElementById('search-box').addEventListener('input', (e) => {
                renderVocab(e.target.value);
            });
        }

        // Function to wrap word in ruby if kana is provided
        function formatRuby(word, kana) {
            if (!kana || word === kana) return word;
            return `<ruby>${word}<rt>${kana}</rt></ruby>`;
        }

        function renderGrammar() {
            const container = document.getElementById('section-grammar');
            container.innerHTML = grammarData.map((g, idx) => `
                <div class="grammar-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center ${masteredIds.includes(g.id) ? 'is-mastered mastered' : ''}" data-id="${g.id}">

                        <div class="flex items-center gap-3">
                            <span class="bg-emerald-600 text-white text-[9px] px-2 py-1 rounded font-black tracking-widest">G${idx+1}</span>
                            <h3 class="text-xl font-bold text-slate-900 japanese-text">${g.title}</h3>
                        </div>
                        <input type="checkbox" class="custom-checkbox" ${masteredIds.includes(g.id) ? 'checked' : ''} onchange="toggleMastered('${g.id}')">
                    </div>
                    <p class="text-sm text-slate-600 mb-4 font-medium">${g.desc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl space-y-3">
                        ${g.ex.map(e => `
                            <div class="border-l-2 border-emerald-200 pl-3 text-left">
                                <p class="japanese-text text-slate-800 text-base leading-relaxed">${e.j}</p>

                    </div>

        }

        function renderVocab(filter = "") {
            const container = document.getElementById('vocab-body');
            const filteredData = vocabData.filter(v => 
                v[0].toLowerCase().includes(filter.toLowerCase()) || 
                v[1].toLowerCase().includes(filter.toLowerCase()) || 
                v[2].toLowerCase().includes(filter.toLowerCase())
            );
            
            container.innerHTML = filteredData.map((v, i) => {
                const id = `n3fv${i}`;
                const scores = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                const isMastered = masteredIds.includes(id);
                return `
                    <tr class="vocab-row transition-all hover:bg-emerald-50 ${isMastered ? 'is-mastered mastered' : ''}" data-id="${id}">
                        <td class="p-4 text-center">
                            <input type="checkbox" class="custom-checkbox" ${isMastered ? 'checked' : ''} onchange="toggleMastered('${id}')">
                        </td>

        // --- Flashcard Logic ---
        function loadNextFlashcard() {
            let pool = [];
            vocabData.forEach((v, i) => {
                const id = `n3fv${i}`;
                const score = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                if (!masteredIds.includes(id)) {
                    if (score.jpToZh < 10) pool.push({ v, id, mode: 'jpToZh' });
                    if (score.zhToJp < 10) pool.push({ v, id, mode: 'zhToJp' });
                }
            });

            if (pool.length === 0) {
                document.getElementById('fc-main-display').classList.add('hidden');
                document.getElementById('fc-controls').classList.add('hidden');
                document.getElementById('fc-header').classList.add('hidden');
                document.getElementById('fc-empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('fc-main-display').classList.remove('hidden');
            document.getElementById('fc-controls').classList.remove('hidden');
            document.getElementById('fc-header').classList.remove('hidden');
            document.getElementById('fc-empty-state').classList.add('hidden');
            document.getElementById('fc-answer-block').classList.remove('active');

            const pick = pool[Math.floor(Math.random() * pool.length)];
            currentFC = pick;
            fcMode = pick.mode;

            const header = document.getElementById('fc-header');
            if (fcMode === 'jpToZh') {
                header.className = "absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-emerald-600 shadow-md transition-all";
                document.getElementById('fc-mode-text').innerText = '日譯中挑戰';
                document.getElementById('fc-question').innerHTML = formatRuby(pick.v[0], pick.v[1]);
                document.getElementById('fc-hint').innerText = "請回答中文解釋";
                document.getElementById('fc-target').innerText = pick.v[2];
                document.getElementById('fc-kana-display').innerText = "";
            } else {
                header.className = "absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-teal-500 shadow-md transition-all";
                document.getElementById('fc-mode-text').innerText = '中譯日挑戰';
                document.getElementById('fc-question').innerText = pick.v[2];
                document.getElementById('fc-hint').innerText = "請回答日文漢字與讀音";
                document.getElementById('fc-target').innerText = pick.v[0];
                document.getElementById('fc-kana-display').innerText = pick.v[1] || "";
            }
            document.getElementById('fc-example').innerHTML = `${pick.v[3]}<br><span class="text-sm text-slate-500 mt-2 block">${pick.v[4]}</span>`;
            updateScoreUI();
        }

        function updateScoreUI() {
            const scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            const currentVal = scores[fcMode];
            document.getElementById('fc-current-score-text').innerText = currentVal;
            const dots = document.getElementById('fc-score-dots');
            dots.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.className = `w-1.5 h-1.5 rounded-full ${i < currentVal ? 'bg-white' : 'bg-white/30'}`;
                dots.appendChild(dot);
            }
        }

        function processFC(action) {
            if (!currentFC) return;
            if (action === 'answer') { document.getElementById('fc-answer-block').classList.add('active'); return; }

            let scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            if (action === 'master') scores[fcMode] = Math.min(10, scores[fcMode] + 5);
            else if (action === 'again') scores[fcMode] = Math.floor(scores[fcMode] / 2);
            
            vocabScores[currentFC.id] = scores;
            if (scores.jpToZh >= 10 && scores.zhToJp >= 10) {
                if (!masteredIds.includes(currentFC.id)) masteredIds.push(currentFC.id);
            }
            saveAndRefresh();
            loadNextFlashcard();
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) {
                masteredIds.splice(index, 1);
            } else {
                masteredIds.push(id);
                vocabScores[id] = { jpToZh: 10, zhToJp: 10 };
            }
            saveAndRefresh(id);
        }

        function saveAndRefresh(id) {
            localStorage.setItem('n3_dual_mastery_v2026_q2', JSON.stringify(masteredIds));
            localStorage.setItem('n3_dual_scores_v2026_q2', JSON.stringify(vocabScores));
            
            if (id) {
                // 動態即時更新對應的 DOM 元素狀態 (包含文法與單字)
                const elements = document.querySelectorAll(`[data-id="${id}"]`);
                elements.forEach(el => {
                    const isM = masteredIds.includes(id);
                    el.classList.toggle('is-mastered', isM);
                    el.classList.toggle('mastered', isM);
                    const cb = el.querySelector('input[type="checkbox"]');
                    if (cb) cb.checked = isM;
                });
            } else {
                // 完全重置時的整體重新渲染
                renderGrammar();
                renderVocab(document.getElementById('search-box').value);
            }
            updateProgress();
        }

        function updateProgress() {
            // 已正確統整變數，使用 grammarData 與 vocabData 計算
            const total = grammarData.length + vocabData.length;
            const current = masteredIds.length;
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`section-${type}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active'); btn.classList.add('text-slate-400'); });
            document.getElementById(`tab-btn-${type}`).classList.add('tab-active');
            if (type === 'flashcard') loadNextFlashcard();
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmReset() { masteredIds = []; vocabScores = {}; saveAndRefresh(); closeModal(); if (!document.getElementById('section-flashcard').classList.contains('hidden')) loadNextFlashcard(); }

        window.onload = init;
    </script>
</body>
</html>
