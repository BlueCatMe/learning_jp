<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow! N3 日本語達陣 - 終極全量學習系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; }
        ruby rt { font-size: 0.45em; color: #059669; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #f0fdf4 !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #059669; }
        .tab-active { color: #059669; border-bottom: 3px solid #059669; }
        .grammar-card { transition: all 0.2s; border-left: 5px solid transparent; }
        .grammar-card:hover { border-left-color: #059669; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        .reveal-info { display: none; }
        .reveal-info.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20 text-center">

    <header class="bg-emerald-800 text-white py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl font-black mb-1 tracking-tight">Meow! N3 日本語達陣</h1>
        <p class="text-emerald-100 opacity-90 text-sm font-medium">中級：全方位核心語彙與進階文法系統</p>
    </header>

    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm text-center">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4 text-center">
            <div class="flex items-center gap-4 text-center">
                <div class="flex flex-col text-center">
                    <span class="text-[9px] text-slate-400 font-black uppercase tracking-widest">N3 總掌握進度</span>
                    <div class="flex items-center gap-2 text-center text-center">
                        <div class="w-40 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-emerald-500 transition-all duration-500"></div>
                        </div>
                        <span id="progress-text" class="text-xs font-bold text-emerald-700">0%</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm text-center text-center">
                    <span id="toggle-icon">👁️</span> <span id="toggle-label text-center text-center">隱藏已掌握</span>
                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm text-center text-center">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-7xl text-center text-center">
        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap text-center text-center">
            <button onclick="switchTab('grammar')" id="tab-btn-grammar" class="tab-btn px-6 py-4 font-bold text-lg tab-active transition text-center text-center">核心文法 (G1-G60)</button>
            <button onclick="switchTab('vocab')" id="tab-btn-vocab" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-emerald-600 transition text-center text-center">全量單字庫 (去重版)</button>
            <button onclick="switchTab('flashcard')" id="tab-btn-flashcard" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-emerald-600 transition text-center text-center text-center">雙向智能學習卡</button>
        </div>

        <!-- Grammar Section -->
        <div id="section-grammar" class="tab-content grid grid-cols-1 lg:grid-cols-2 gap-6 text-center text-center"></div>

        <!-- Vocab Section -->
        <div id="section-vocab" class="tab-content hidden text-center">
            <div class="mb-6 relative text-center">
                <input type="text" id="search-box" placeholder="搜尋編號(V1)、單字、假名或中文意義..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none transition shadow-sm text-center text-center">
                <span class="absolute left-4 top-3.5 text-slate-400 text-center text-center">🔍</span>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden text-center text-center">
                <div class="overflow-x-auto text-center text-center text-center">
                    <table class="w-full text-left border-collapse text-center text-center text-center">
                        <thead class="bg-slate-50 border-b border-slate-200 text-center text-center text-center text-center">
                            <tr>
                                <th class="p-4 w-16 text-center text-center">掌握</th>
                                <th class="p-4 w-20 text-center text-emerald-600 font-bold border-r">編號</th>
                                <th class="p-4 w-1/5 text-center text-center">單字 / 假名</th>
                                <th class="p-4 w-1/5 text-emerald-700 text-center text-center text-center">中文意義</th>
                                <th class="p-4 text-center text-center">實戰例句</th>
                                <th class="p-4 w-24 text-center text-center text-center text-center">積分</th>
                            </tr>
                        </thead>
                        <tbody id="vocab-body" class="divide-y divide-slate-100 text-sm text-center text-center"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Flashcard Section -->
        <div id="section-flashcard" class="tab-content hidden text-center text-center">
            <div class="max-w-lg mx-auto text-center text-center">
                <div id="fc-container" class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-10 min-h-[500px] flex flex-col items-center justify-between text-center relative overflow-hidden transition-all text-center text-center text-center">
                    
                    <!-- Mode & Score Header -->
                    <div id="fc-header" class="absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white shadow-md transition-all text-center text-center">
                        <div class="flex items-center gap-2">
                            <span id="fc-mode-text">模式載入中</span>
                            <span class="bg-white/20 px-2 py-0.5 rounded text-[9px] font-bold">積分: <span id="fc-current-score-text">0</span> / 10</span>
                        </div>
                        <div class="flex gap-1" id="fc-score-dots"></div>
                    </div>

                    <div id="fc-main-display" class="w-full flex-grow flex flex-col items-center justify-center pt-8 text-center text-center text-center text-center">
                        <div id="fc-question" class="japanese-text text-5xl font-black text-slate-900 mb-2 leading-[1.5em] h-[2.5em] flex items-center justify-center text-center text-center text-center text-center"></div>
                        <div id="fc-hint" class="text-slate-400 text-xs font-bold uppercase tracking-tighter h-4 mb-10 text-center text-center text-center text-center"></div>
                        
                        <!-- Answer Block -->
                        <div id="fc-answer-block" class="reveal-info w-full animate-fade-in border-t border-slate-100 pt-6 text-center text-center text-center text-center">
                            <div id="fc-target" class="text-3xl font-bold text-emerald-600 mb-2 japanese-text text-center text-center text-center text-center"></div>
                            <div id="fc-kana-display" class="text-slate-500 text-sm mb-6 japanese-text text-center text-center text-center text-center"></div>
                            <div class="bg-emerald-50 p-5 rounded-3xl text-left border border-emerald-100 text-center text-center text-center text-center text-center">
                                <p class="text-[9px] font-black text-emerald-400 uppercase mb-2 text-center text-center text-center text-center text-center text-center">N3 實戰範本</p>
                                <p id="fc-example" class="japanese-text text-slate-700 text-base leading-relaxed text-center text-center text-center text-center"></p>
                            </div>
                        </div>
                    </div>

                    <div id="fc-empty-state" class="hidden py-16 text-center text-center text-center text-center">
                        <div class="text-7xl mb-6 text-center text-center text-center text-center text-center text-center">🏆</div>
                        <h3 class="text-2xl font-black text-slate-900 mb-2 text-center text-center text-center text-center text-center">N3 挑戰全量達成</h3>
                        <p class="text-slate-500 text-sm text-center text-center text-center text-center text-center">恭喜！您已掌握清單內的所有真實單字。</p>
                    </div>

                    <!-- Controls -->
                    <div id="fc-controls" class="w-full grid grid-cols-3 gap-4 mt-8 text-center text-center text-center text-center text-center text-center text-center text-center">
                        <button onclick="processFC('again')" class="flex flex-col items-center py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-3xl transition-all active:scale-95 text-center text-center text-center text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center text-center text-center">🔄</span><span class="text-[10px] font-black text-center text-center text-center text-center text-center text-center">再來</span>
                        </button>
                        <button onclick="processFC('answer')" id="fc-btn-answer" class="flex flex-col items-center py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-3xl transition-all active:scale-95 shadow-lg shadow-emerald-100 text-center text-center text-center text-center text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center text-center text-center text-center text-center text-center">💡</span><span class="text-[10px] font-black text-center text-center text-center text-center text-center text-center text-center text-center">答案</span>
                        </button>
                        <button onclick="processFC('master')" class="flex flex-col items-center py-4 bg-green-100 hover:bg-green-200 text-green-700 rounded-3xl transition-all active:scale-95 text-center text-center text-center text-center text-center text-center text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center text-center text-center text-center text-center text-center">✅</span><span class="text-[10px] font-black text-center text-center text-center text-center text-center text-center text-center text-center">掌握</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Reset Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 text-center text-center text-center text-center">
        <div class="bg-white rounded-[2rem] shadow-2xl max-sm w-full p-8 text-center text-center text-center text-center text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl text-center text-center text-center text-center text-center">🚫</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2 text-center text-center text-center text-center text-center">重置進度？</h3>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed text-center text-center text-center text-center text-center">這將清除所有掌握狀態與雙向積分。動作無法復原。</p>
            <div class="flex flex-col gap-3 text-center text-center text-center text-center">
                <button onclick="confirmReset()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition shadow-lg shadow-red-200 text-center text-center text-center text-center text-center">確定重置</button>
                <button onclick="closeModal()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition text-center text-center text-center text-center text-center">取消返回</button>
            </div>
        </div>
    </div>

    <footer class="bg-slate-900 text-slate-500 py-12 px-4 text-center text-center text-center text-center text-center text-center">
        <div class="container mx-auto text-center text-sm text-center text-center text-center text-center text-center">
            <p class="mb-4 text-center text-sm text-center text-center text-center text-center text-center text-center text-center">© 2026 Meow! 日本語達陣學習計畫 - 終極 N3 修正補完版</p>
        </div>
    </footer>

    <script>
        // --- N3 核心文法 (完整補完 G1-G60 + 振假名) ---
        const grammarData = [
            { id: 'g1', title: '～うちに', desc: '趁著某個狀態還沒發生變化前，做某事。', ex: [{j: '<ruby>暗<rt>くら</rt></ruby>くならないうちに、<ruby>帰<rt>かえ</rt></ruby>りましょう。', c: '趁天還沒黑，回家吧。'}]},
            { id: 'g2', title: '～間に / ～間', desc: '在某個持續的期間內 / 期間中一直。', ex: [{j: '<ruby>留守<rt>るす</rt></ruby>の<ruby>間<rt>あいだ</rt></ruby>に、泥棒が入った。', c: '不在家期間，小偷闖進來了。'}]},
            { id: 'g3', title: '～たところ', desc: '做了某事後，發現了結果。', ex: [{j: '先生に<ruby>聞<rt>き</rt></ruby>いたところ、<ruby>間違<rt>まちが</rt></ruby>いがわかった。', c: '問了老師後，發現了錯誤。'}]},
            { id: 'g4', title: '～たとたん', desc: '剛一...就立刻...（驚訝感）。', ex: [{j: '<ruby>窓<rt>まど</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けたとたん、<ruby>風<rt>かぜ</rt></ruby>が入ってきた。', c: '剛一開窗，風就吹進來了。'}]},
            { id: 'g5', title: '～たびに', desc: '每當...。', ex: [{j: 'その<ruby>歌<rt>うた</rt></ruby>を<ruby>聞<rt>き</rt></ruby>くたびに、子供のころを<ruby>思<rt>おも</rt></ruby>い出す。', c: '每當聽這首歌，就會想起小時候。'}]},
            { id: 'g6', title: '～一方だ', desc: '傾向持續向一個方向發展（多用於負面）。', ex: [{j: '日本語の勉強は<ruby>難<rt>むずか</rt></ruby>しくなる一方だ。', c: '日文學習變得越來越難了。'}]},
            { id: 'g7', title: '～つつある', desc: '正在持續變化中（正式）。', ex: [{j: '<ruby>景気<rt>けいき</rt></ruby>はよくなりつつある。', c: '景氣正漸漸好轉。'}]},
            { id: 'g8', title: '～つつ', desc: '一邊...一邊...（正式）。', ex: [{j: '<ruby>将来<rt>しょうらい</rt></ruby>のことを<ruby>考<rt>かんが</rt></ruby>えつつ、<ruby>進路<rt>しんろ</rt></ruby>を決める。', c: '一邊思考未來，一邊決定出路。'}]},
            { id: 'g9', title: '～切る / 切れる', desc: '完全做完、做到底。', ex: [{j: '長い距離を<ruby>走<rt>はし</rt></ruby>りきった。', c: '全程跑完了。'}]},
            { id: 'g10', title: '～抜く', desc: '堅持到最後、非常...。', ex: [{j: '最後までやり<ruby>抜<rt>ぬ</rt></ruby>くことが大切だ。', c: '堅持做到底是很重要的。'}]},
            { id: 'g11', title: '～がてら', desc: '在做主要目的時，順便做他事。', ex: [{j: '<ruby>散歩<rt>さんぽ</rt></ruby>がてら、本屋に寄った。', c: '散步時順便去了書店。'}]},
            { id: 'g12', title: '～ついでに', desc: '順便（次要動作）。', ex: [{j: '<ruby>郵便局<rt>ゆうびんきょく</rt></ruby>へ行くついでに、これも出して。', c: '去郵局時順便幫我寄這個。'}]},
            { id: 'g13', title: '～おかげで', desc: '多虧了（好結果）。', ex: [{j: '<ruby>先生<rt>せんせい</rt></ruby>のおかげで合格できた。', c: '多虧老師我及格了。'}]},
            { id: 'g14', title: '～せいで', desc: '都怪（壞結果）。', ex: [{j: 'バスが遅れたせいで遅刻した。', c: '都怪巴士遲到害我遲到。'}]},
            { id: 'g15', title: '～わりに', desc: '與與其相比卻（意外感）。', ex: [{j: '値段のわりに、料理が美味しい。', c: '與價格相比，這道菜很好吃。'}]},
            { id: 'g16', title: '～くせに', desc: '明明...卻...（責難、輕蔑情緒）。', ex: [{j: '<ruby>知<rt>し</rt></ruby>っているくせに、<ruby>教<rt>おし</rt></ruby>えてくれない。', c: '明明知道卻不告訴我。'}]},
            { id: 'g17', title: '～ばかりか / ～ばかりでなく', desc: '不僅...而且...（正式）。', ex: [{j: '日本語ばかりか、英語も話せる。', c: '不僅日語，連英語也會說。'}]},
            { id: 'g18', title: '～にかけては', desc: '在某方面（能力卓越）。', ex: [{j: '<ruby>料理<rt>りょうり</rt></ruby>にかけては、彼の右に出る者はいない。', c: '在料理方面，沒人比得上他。'}]},
            { id: 'g19', title: '～にわたって', desc: '歷經/遍及（時間或空間廣範圍）。', ex: [{j: '三日間にわたって、お祭りが開かれた。', c: '祭典持續舉辦了三天。'}]},
            { id: 'g20', title: '～に際して / ～にあたって', desc: '在...之際（正式）。', ex: [{j: '<ruby>開店<rt>かいてん</rt></ruby>に際して、挨拶をする。', c: '在開店之際發表致詞。'}]},
            { id: 'g21', title: '～に代わって / ～に代わり', desc: '代替某人。', ex: [{j: '<ruby>父<rt>ちち</rt></ruby>に代わって、私が参加します。', c: '代替父親，由我參加。'}]},
            { id: 'g22', title: '～を始め (として)', desc: '以...為首（列舉代表項目）。', ex: [{j: '東京を始め、多くの都市で。', c: '以東京為首，在許多城市。'}]},
            { id: 'g23', title: '～から～にかけて', desc: '從...到...（模糊範圍）。', ex: [{j: '昨日から今日にかけて。', c: '從昨天到今天。'}]},
            { id: 'g24', title: '～からといって', desc: '雖說是因為...（但也未必）。', ex: [{j: '高いからといって、良い物とは限らない。', c: '雖說很貴，但不見得就是好東西。'}]},
            { id: 'g25', title: '～反面 / ～半面', desc: '一方面...另一方面（對比）。', ex: [{j: '便利な反面、危ない。', c: '便利的同時也很危險。'}]},
            { id: 'g26', title: '～一方で', desc: '一方面...另一方面（正式並列）。', ex: [{j: '子供を育てる一方で、働いている。', c: '一邊育兒，一邊工作。'}]},
            { id: 'g27', title: '～どころか', desc: '哪裡是...根本是...。', ex: [{j: '獨身どころか、子供が三人いる。', c: '哪裡是單身，連小孩都有三個了。'}]},
            { id: 'g28', title: '～とともに', desc: '隨著... / 與...一起。', ex: [{j: '時代とともに、変化する。', c: '隨著時代改變。'}]},
            { id: 'g29', title: '～に伴って / ～に伴い', desc: '伴隨著（較大型的變化）。', ex: [{j: '人口の増加に伴って。', c: '伴隨著人口增加。'}]},
            { id: 'g30', title: '～につれて', desc: '隨著...而發生變化。', ex: [{j: '日本語が上手になるにつれて。', c: '隨著日文變好。'}]},
            { id: 'g31', title: '～に従って / ～に従い', desc: '隨著... / 遵從...。', ex: [{j: '指示に従って行動する。', c: '遵從指示行動。'}]},
            { id: 'g32', title: '～たあげく', desc: '經過一番...最後還是（負面）。', ex: [{j: '悩んだあげく、やめた。', c: '煩惱了半天最後還是放棄了。'}]},
            { id: 'g33', title: '～末に (すえに)', desc: '在經歷...之後的最終結果。', ex: [{j: '苦労した末に、成功した。', c: '辛苦過後終於成功了。'}]},
            { id: 'g34', title: '～がたい', desc: '心裡上難以做到。', ex: [{j: '信じがたい事実だ。', c: '難以置信的事實。'}]},
            { id: 'g35', title: '～かねない', desc: '有可能會發生（壞事）。', ex: [{j: '事故になりかねない。', c: '有可能會釀成事故。'}]},
            { id: 'g36', title: '～かねる', desc: '難以做、不便做。', ex: [{j: '分かりかねます。', c: '這我恐怕難以明白。'}]},
            { id: 'g37', title: '～ぬ', desc: '否定（書面正式）。', ex: [{j: '知らぬ存ぜぬ。', c: '一問三不知。'}]},
            { id: 'g38', title: '～ざるを得ない', desc: '不得不、必須...。', ex: [{j: '中止せざるを得ない。', c: '不得不中止。'}]},

            ["錄音", "ろくおん", "錄音", "声を錄音する。"]
        ];

        const finalPool = [...rawVocab];

        // --- 核心邏輯 (Persistence, Mastery & UI Sync) ---
        let masteredIds = JSON.parse(localStorage.getItem('meow_n3_pro_v8_mastery') || '[]');
        let vocabScores = JSON.parse(localStorage.getItem('meow_n3_pro_v8_scores') || '{}');
        let hideMode = false;
        let currentFC = null;
        let fcMode = 'jpToZh';

        function init() {
            renderGrammar();
            renderVocab();
            updateProgress();
            
            document.getElementById('toggle-hide').addEventListener('click', () => {
                hideMode = !hideMode;
                document.body.classList.toggle('hide-mastered', hideMode);
                document.getElementById('toggle-label').innerText = hideMode ? "顯示全部" : "隱藏已掌握";
                document.getElementById('toggle-icon').innerText = hideMode ? "👁️‍🗨️" : "👁️";
            });

            document.getElementById('reset-progress').addEventListener('click', () => {
                document.getElementById('confirm-modal').style.display = 'flex';
            });

            document.getElementById('search-box').addEventListener('input', (e) => {
                renderVocab(e.target.value);
            });
        }

        function formatRuby(word, kana) {
            if (!kana || word === kana) return word;
            return `<ruby>${word}<rt>${kana}</rt></ruby>`;
        }

        function renderGrammar() {
            const container = document.getElementById('section-grammar');
            container.innerHTML = grammarData.map((g, idx) => `
                <div class="grammar-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center ${masteredIds.includes(g.id) ? 'is-mastered mastered' : ''}" data-id="${g.id}">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3 text-center">
                            <span class="bg-emerald-600 text-white text-[9px] px-2 py-1 rounded font-black tracking-widest text-center">G${idx+1}</span>
                            <h3 class="text-xl font-bold text-slate-900 japanese-text text-center text-center">${g.title}</h3>
                        </div>
                        <input type="checkbox" class="custom-checkbox text-center" ${masteredIds.includes(g.id) ? 'checked' : ''} onchange="toggleMastered('${g.id}')">
                    </div>
                    <p class="text-sm text-slate-600 mb-4 font-medium text-center text-center text-center">${g.desc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl space-y-4 text-center">
                        ${g.ex.map(e => `
                            <div class="border-l-2 border-emerald-200 pl-3 text-center text-center">
                                <p class="japanese-text text-slate-800 text-lg leading-relaxed text-center text-center">${e.j}</p>
                                <p class="text-xs text-slate-500 mt-0.5 text-center text-center">${e.c}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderVocab(filter = "") {
            const container = document.getElementById('vocab-body');
            const filteredData = finalPool.filter((v, i) => 
                v[0].toLowerCase().includes(filter.toLowerCase()) || 
                v[1].toLowerCase().includes(filter.toLowerCase()) || 
                v[2].toLowerCase().includes(filter.toLowerCase()) ||
                (`V${i+1}`).toLowerCase().includes(filter.toLowerCase())
            );
            
            container.innerHTML = filteredData.map((v, i) => {
                const id = `n3fv${i}`;
                const scores = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                const isM = masteredIds.includes(id);
                return `
                    <tr class="vocab-row transition-all hover:bg-emerald-50 text-center ${isM ? 'is-mastered mastered' : ''}" data-id="${id}">
                        <td class="p-4 text-center">
                            <input type="checkbox" class="custom-checkbox text-center" ${isM ? 'checked' : ''} onchange="toggleMastered('${id}')">
                        </td>
                        <td class="p-4 font-mono text-slate-400 text-xs text-center border-r border-slate-50">V${i+1}</td>
                        <td class="p-4 text-center">
                            <div class="japanese-text font-bold text-lg text-slate-900">${v[0]}</div>
                            <div class="text-[10px] text-slate-400 japanese-text">${v[1]}</div>
                        </td>
                        <td class="p-4 text-center">
                            <span class="font-bold text-emerald-700">${v[2]}</span>
                        </td>
                        <td class="p-4">
                            <p class="japanese-text text-slate-600 italic text-xs leading-relaxed text-center">${v[3]}</p>
                        </td>
                        <td class="p-4 text-center">
                            <div class="flex gap-4 items-center justify-center">
                                <div class="flex flex-col text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black">日</span>
                                    <div class="w-10 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5 text-center">
                                        <div class="h-full bg-emerald-500 text-center" style="width: ${scores.jpToZh * 10}%"></div>
                                    </div>
                                </div>
                                <div class="flex flex-col text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black">中</span>
                                    <div class="w-10 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5 text-center">
                                        <div class="h-full bg-cyan-500 text-center text-center" style="width: ${scores.zhToJp * 10}%"></div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // --- Flashcard Logic ---
        function loadNextFC() {
            let pool = [];
            finalPool.forEach((v, i) => {
                const id = `n3fv${i}`;
                const score = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                if (!masteredIds.includes(id)) {
                    if (score.jpToZh < 10) pool.push({ v, id, mode: 'jpToZh' });
                    if (score.zhToJp < 10) pool.push({ v, id, mode: 'zhToJp' });
                }
            });

            if (pool.length === 0) {
                document.getElementById('fc-main-display').classList.add('hidden');
                document.getElementById('fc-controls').classList.add('hidden');
                document.getElementById('fc-header').classList.add('hidden');
                document.getElementById('fc-empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('fc-main-display').classList.remove('hidden');
            document.getElementById('fc-controls').classList.remove('hidden');
            document.getElementById('fc-header').classList.remove('hidden');
            document.getElementById('fc-empty-state').classList.add('hidden');
            document.getElementById('fc-answer-block').classList.remove('active');

            const pick = pool[Math.floor(Math.random() * pool.length)];
            currentFC = pick;
            fcMode = pick.mode;

            const header = document.getElementById('fc-header');
            if (fcMode === 'jpToZh') {
                header.className = "absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-indigo-600 shadow-md transition-all";
                document.getElementById('fc-mode-text').innerText = '日譯中挑戰';
                document.getElementById('fc-question').innerHTML = formatRuby(pick.v[0], pick.v[1]);
                document.getElementById('fc-hint').innerText = "請回答中文解釋";
                document.getElementById('fc-target').innerText = pick.v[2];
                document.getElementById('fc-kana-display').innerText = "";
            } else {
                header.className = "absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-amber-500 shadow-md transition-all";
                document.getElementById('fc-mode-text').innerText = '中譯日挑戰';
                document.getElementById('fc-question').innerText = pick.v[2];
                document.getElementById('fc-hint').innerText = "請回答日文漢字與讀音";
                document.getElementById('fc-target').innerText = pick.v[0];
                document.getElementById('fc-kana-display').innerText = pick.v[1] || "";
            }
            document.getElementById('fc-example').innerText = pick.v[3];
            updateScoreUI();
        }

        function updateScoreUI() {
            const scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            const currentVal = scores[fcMode];
            document.getElementById('fc-current-score-text').innerText = currentVal;
            const dots = document.getElementById('fc-score-dots');
            dots.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.className = `w-1.5 h-1.5 rounded-full ${i < currentVal ? 'bg-white' : 'bg-white/30'}`;
                dots.appendChild(dot);
            }
        }

        function processFC(action) {
            if (!currentFC) return;
            if (action === 'answer') { document.getElementById('fc-answer-block').classList.add('active'); return; }

            let scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            if (action === 'master') scores[fcMode] = Math.min(10, scores[fcMode] + 5);
            else if (action === 'again') scores[fcMode] = Math.floor(scores[fcMode] / 2);
            
            vocabScores[currentFC.id] = scores;
            if (scores.jpToZh >= 10 && scores.zhToJp >= 10) masteredIds.push(currentFC.id);
            saveAndSync();
            loadNextFC();
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) masteredIds.splice(index, 1);
            else { masteredIds.push(id); vocabScores[id] = { jpToZh: 10, zhToJp: 10 }; }
            saveAndSync(id);
        }

        function saveAndSync(id) {
            localStorage.setItem('meow_n3_pro_v8_mastery', JSON.stringify(masteredIds));
            localStorage.setItem('meow_n3_pro_v8_scores', JSON.stringify(vocabScores));
            if (id) renderVocab(document.getElementById('search-box').value);
            else { renderGrammar(); renderVocab(); }
            updateProgress();
        }

        function updateProgress() {
            const total = grammarData.length + rawVocab.length;
            const current = masteredIds.length;
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`section-${type}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active'); btn.classList.add('text-slate-400'); });
            document.getElementById(`tab-btn-${type}`).classList.add('tab-active');
            if (type === 'flashcard') loadNextFC();
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmReset() { masteredIds = []; vocabScores = {}; saveAndSync(); closeModal(); if (!document.getElementById('section-flashcard').classList.contains('hidden')) loadNextFC(); }

        window.onload = init;
    </script>
</body>
</html>
