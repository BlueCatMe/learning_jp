<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow! N3 日本語達陣 - 終極全量學習系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; }
        ruby rt { font-size: 0.5em; color: #059669; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #f0fdf4 !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #059669; }
        .tab-active { color: #059669; border-bottom: 3px solid #059669; }
        .grammar-card { transition: all 0.2s; border-left: 5px solid transparent; }
        .grammar-card:hover { border-left-color: #059669; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        .reveal-info { display: none; }
        .reveal-info.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <header class="bg-emerald-700 text-white py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl font-black mb-1 tracking-tight text-center">Meow! N3 日本語達陣</h1>
        <p class="text-emerald-100 opacity-90 text-sm font-medium text-center">最高級別：全方位核心語彙與進階文法系統</p>
    </header>

    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4 text-center text-center">
            <div class="flex items-center gap-4 text-center">
                <div class="flex flex-col text-center">
                    <span class="text-[9px] text-slate-400 font-black uppercase tracking-widest text-center text-center">N3 掌握進度</span>
                    <div class="flex items-center gap-2">
                        <div class="w-48 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-emerald-500 transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <span id="progress-text" class="text-xs font-bold text-emerald-700">0%</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-semibold transition flex items-center gap-2 shadow-sm text-center">
                    <span id="toggle-icon">👁️</span> <span id="toggle-label text-center">隱藏已掌握</span>
                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-semibold transition flex items-center gap-2 shadow-sm text-center">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-7xl">
        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap text-center text-center">
            <button onclick="switchTab('grammar')" id="tab-btn-grammar" class="tab-btn px-6 py-4 font-bold text-lg tab-active transition text-center">核心文法 (G1-G60)</button>
            <button onclick="switchTab('vocab')" id="tab-btn-vocab" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-emerald-600 transition text-center">全量單字庫 (V1-V620+)</button>
            <button onclick="switchTab('flashcard')" id="tab-btn-flashcard" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-emerald-600 transition text-center">雙向學習卡</button>
        </div>

        <!-- Grammar Section -->
        <div id="section-grammar" class="tab-content grid grid-cols-1 lg:grid-cols-2 gap-6 text-center"></div>

        <!-- Vocab Section -->
        <div id="section-vocab" class="tab-content hidden text-center">
            <div class="mb-6 relative text-center">
                <input type="text" id="search-box" placeholder="搜尋編號(V1)、單字、假名或意思..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none transition shadow-sm text-center">
                <span class="absolute left-4 top-3.5 text-slate-400">🔍</span>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden text-center text-center">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-center">
                        <thead class="bg-slate-50 border-b border-slate-200 text-center">
                            <tr>
                                <th class="p-4 w-16 text-center">掌握</th>
                                <th class="p-4 w-20 text-center text-emerald-600">編號</th>
                                <th class="p-4 w-1/4 text-center text-center">單字 / 假名</th>
                                <th class="p-4 w-1/4 text-emerald-700 text-center text-center">中文意義</th>
                                <th class="p-4 text-center text-center text-center">雙向積分狀況</th>
                            </tr>
                        </thead>
                        <tbody id="vocab-body" class="divide-y divide-slate-100 text-sm text-center"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Flashcard Section -->
        <div id="section-flashcard" class="tab-content hidden text-center">
            <div class="max-w-xl mx-auto">
                <div id="fc-container" class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-10 min-h-[500px] flex flex-col items-center justify-between text-center relative overflow-hidden transition-all text-center">
                    <div id="fc-mode-display" class="absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white text-center">
                        <span id="fc-mode-text">載入中</span>
                        <div class="flex gap-1" id="fc-score-dots"></div>
                    </div>
                    <div id="fc-main-display" class="w-full flex-grow flex flex-col items-center justify-center pt-8 text-center text-center">
                        <div id="fc-question" class="japanese-text text-5xl font-black text-slate-900 mb-2 leading-[1.5em] h-[2.5em] flex items-center justify-center text-center text-center"></div>
                        <div id="fc-hint" class="text-slate-400 text-xs font-bold uppercase tracking-tighter h-4 mb-10 text-center text-center"></div>
                        <div id="fc-answer-block" class="reveal-info w-full animate-fade-in border-t border-slate-100 pt-6 text-center text-center">
                            <div id="fc-target" class="text-3xl font-bold text-emerald-600 mb-2 japanese-text text-center text-center text-center text-center"></div>
                            <div id="fc-kana-display" class="text-slate-500 text-sm mb-6 japanese-text text-center text-center text-center"></div>
                            <div class="bg-emerald-50 p-5 rounded-3xl text-left border border-emerald-100 text-center text-center">
                                <p class="text-[9px] font-black text-emerald-400 uppercase mb-2 text-center text-center text-center">N3 實戰範本</p>
                                <p id="fc-example" class="japanese-text text-slate-700 text-base leading-relaxed text-center text-center"></p>
                            </div>
                        </div>
                    </div>
                    <div id="fc-empty-state" class="hidden py-16 text-center text-center">
                        <div class="text-7xl mb-6 text-center text-center">🏆</div>
                        <h3 class="text-2xl font-black text-slate-900 mb-2 text-center text-center text-center">N3 學習全量達成</h3>
                        <p class="text-slate-500 text-sm text-center">太出色了！您已掌握清單內的所有真實單字。</p>
                    </div>
                    <div id="fc-controls" class="w-full grid grid-cols-3 gap-4 mt-8 text-center text-center">
                        <button onclick="processFC('again')" class="flex flex-col items-center py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-3xl transition-all active:scale-95 text-center">
                            <span class="text-2xl mb-1 text-center text-center">🔄</span><span class="text-[10px] font-black text-center text-center text-center">再來</span>
                        </button>
                        <button onclick="processFC('answer')" id="fc-btn-answer" class="flex flex-col items-center py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-3xl transition-all active:scale-95 shadow-lg shadow-emerald-100 text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center">💡</span><span class="text-[10px] font-black text-center text-center text-center text-center text-center text-center">答案</span>
                        </button>
                        <button onclick="processFC('master')" class="flex flex-col items-center py-4 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-3xl transition-all active:scale-95 text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center">✅</span><span class="text-[10px] font-black text-center text-center text-center text-center text-center">掌握</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 text-center text-center">
        <div class="bg-white rounded-[2rem] shadow-2xl max-w-sm w-full p-8 text-center text-center text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl text-center text-center text-center">🚫</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2 text-center text-center text-center">重置 N3 進度？</h3>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed text-center">這將永久清除所有 600+ 真實單字與 60 條文法的掌握記錄與積分。</p>
            <div class="flex flex-col gap-3">
                <button onclick="confirmReset()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition shadow-lg shadow-red-200 text-center text-center">確定重置</button>
                <button onclick="closeModal()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition text-center text-center text-center">取消</button>
            </div>
        </div>
    </div>

    <footer class="bg-slate-900 text-slate-500 py-12 px-4 text-center text-center text-center">
        <div class="container mx-auto text-center text-sm">
            <p class="mb-4 text-center text-sm text-center">© 2026 Meow! 日本語達陣學習計畫 - 終極完整編號版</p>
        </div>
    </footer>

    <script>
        // --- N3 核心文法 (G1-G60 完整錄入 + 振假名例句) ---
        const grammarData = [
            { id: 'g1', title: '～あいだ (間)', desc: '在~期間一直持續。後接持續性動作。', ex: [{j: '<ruby>山田<rt>やまだ</rt></ruby><ruby>先生<rt>せんせい</rt></ruby>の<ruby>講演<rt>こうえん</rt></ruby>のあいだ、<ruby>皆<rt>みな</rt></ruby><ruby>熱心<rt>ねっしん</rt></ruby>に<ruby>話<rt>はなし</rt></ruby>を<ruby>聞<rt>き</rt></ruby>いていた。', c: '在山田老師演講的過程中，大家都專心地聽著。'}]},
            { id: 'g2', title: '～あいだに (間に)', desc: '在~期間發生某次動作。後接瞬間動作。', ex: [{j: '<ruby>授業<rt>じゅぎょう</rt></ruby>のあいだに３<ruby>回<rt>かい</rt></ruby><ruby>質問<rt>しつもん</rt></ruby>をした。', c: '在上課期間曾發問了三次。'}]},
            { id: 'g3', title: '～あがる (上がる)', desc: '動作的完成、起來、向上。', ex: [{j: 'やっと<ruby>企画書<rt>きかくしょ</rt></ruby>が<ruby>出来<rt>でき</rt></ruby>あがった。', c: '企劃書終於完成了。'}]},
            { id: 'g4', title: '～いかにも', desc: '典型的、果然、完全。', ex: [{j: 'それは、いかにも<ruby>日本<rt>にほん</rt></ruby>らしい<ruby>建物<rt>たてもの</rt></ruby>だ。', c: '那確實是非常有日本風格的建築物。'}]},
            { id: 'g5', title: '～いつのまにか', desc: '不知不覺間。', ex: [{j: 'いつのまにか５<ruby>時間<rt>じかん</rt></ruby>も<ruby>経<rt>た</rt></ruby>ってしまった。', c: '不知不覺間已經過了5個小時了。'}]},
            { id: 'g6', title: '～一方(で)', desc: '一方面~，另一方面~。', ex: [{j: '<ruby>最近<rt>さいきん</rt></ruby>は<ruby>忙<rt>いそが</rt></ruby>しい一方で、<ruby>充実<rt>じゅうじつ</rt></ruby>している。', c: '最近雖然很忙，但另一方面生活也很充實。'}]},
            { id: 'g7', title: '～一方だ', desc: '傾向不斷發展（通常指惡化）。', ex: [{j: '<ruby>人口<rt>じんこう</rt></ruby>は<ruby>減<rt>へ</rt></ruby>る一方だ。', c: '人口一直在減少。'}]},
            { id: 'g8', title: '～うえに (上に)', desc: '不僅...而且...（累加）。', ex: [{j: '<ruby>道<rt>みち</rt></ruby>に<ruby>迷<rt>まよ</rt></ruby>ったうえに、<ruby>雨<rt>あめ</rt></ruby>に<ruby>降<rt>ふ</rt></ruby>られた。', c: '不僅迷路了，還被雨淋了。'}]},
            { id: 'g9', title: '～うちに', desc: '趁著~ / 在~期間發生變化。', ex: [{j: '<ruby>雨<rt>あめ</rt></ruby>が<ruby>強<rt>つよ</rt></ruby>くならないうちに<ruby>帰<rt>かえ</rt></ruby>りましょう。', c: '趁雨還沒變大快回去吧。'}]},
            { id: 'g10', title: '～おかげで', desc: '多虧了~（好的結果）。', ex: [{j: '<ruby>先生<rt>せんせい</rt></ruby>のおかげで、<ruby>合格<rt>ごうかく</rt></ruby>できました。', c: '多虧老師，我才能考過。'}]},
            { id: 'g11', title: '～おきに', desc: '每隔~（時間或距離）。', ex: [{j: 'バスは２０<ruby>分<rt>ぷん</rt></ruby>おきに<ruby>發車<rt>はっしゃ</rt></ruby>する。', c: '巴士每隔20分鐘發車。'}]},
            { id: 'g12', title: '～おそれがある', desc: '恐怕、有可能發生壞事。', ex: [{j: '<ruby>台風<rt>たいふう</rt></ruby>が<ruby>來<rt>く</rt></ruby>るおそれがある。', c: '有可能會遭遇颱風侵襲。'}]},
            { id: 'g13', title: '～かける / ～かけの', desc: '動作剛開始、尚未結束。', ex: [{j: '<ruby>読<rt>よ</rt></ruby>みかけの<ruby>本<rt>ほん</rt></ruby>を<ruby>机<rt>つくえ</rt></ruby>に<ruby>置<rt>お</rt></ruby>く。', c: '把讀到一半的書放在桌上。'}]},
            { id: 'g14', title: '～がかり(で)', desc: '費時費力的進行。', ex: [{j: '５<ruby>人<rt>にん</rt></ruby>がかりで<ruby>運<rt>はこ</rt></ruby>んだ。', c: '動用了5個人才搬走。'}]},
            { id: 'g15', title: '～がする', desc: '感覺到（味道、聲音、感覺）。', ex: [{j: 'いい<ruby>匂<rt>にお</rt></ruby>いがする。', c: '聞到香味。'}]},
            { id: 'g16', title: '～か何か', desc: '~之類的。', ex: [{j: '<ruby>冷<rt>つめ</rt></ruby>たいものか<ruby>何<rt>なに</rt></ruby>か<ruby>飲<rt>の</rt></ruby>みませんか。', c: '要喝點冷的東西之類的嗎？'}]},
            { id: 'g17', title: '～から～にかけて', desc: '從~到~（範圍）。', ex: [{j: '<ruby>九州<rt>きゅうしゅう</rt></ruby>から<ruby>四国<rt>しこく</rt></ruby>にかけて。', c: '從九州到四國。'}]},
            { id: 'g18', title: '～がる', desc: '感覺、覺得（第三人稱心理）。', ex: [{j: '<ruby>子供<rt>こども</rt></ruby>が<ruby>怖<rt>こわ</rt></ruby>がっている。', c: '小孩覺得害怕。'}]},

            { id: 'g20', title: '～きる / ～きれる', desc: '完全做完。', ex: [{j: '<ruby>最後<rt>さいご</rt></ruby>まで<ruby>走<rt>はし</rt></ruby>りきった。', c: '堅持跑到了最後。'}]},
            { id: 'g21', title: '～くせに', desc: '明明~卻~（帶有責難語氣）。', ex: [{j: '<ruby>知<rt>し</rt></ruby>っているくせに、<ruby>教<rt>おし</rt></ruby>えてくれない。', c: '明明知道，卻不告訴我。'}]},
            { id: 'g22', title: '～くらい / ～ほど', desc: '程度，到了~地步。', ex: [{j: '<ruby>死<rt>し</rt></ruby>ぬほど<ruby>疲<rt>つか</rt></ruby>れた。', c: '累到快死了。'}]},
            { id: 'g23', title: '～こそ', desc: '正是（強調）。', ex: [{j: '<ruby>今年<rt>ことし</rt></ruby>こそ<ruby>合格<rt>ごうかく</rt></ruby>するぞ。', c: '今年一定要考上。'}]},
            { id: 'g24', title: '～ことか', desc: '多麼~啊（感嘆）。', ex: [{j: 'どんなに<ruby>嬉<rt>うれ</rt></ruby>しかったことか。', c: '是多麼高興啊。'}]},
            { id: 'g25', title: '～ことから', desc: '因為、起源於。', ex: [{j: '<ruby>形<rt>かたち</rt></ruby>が<ruby>似<rt>に</rt></ruby>ていることから。', c: '因為形狀很像。'}]},
            { id: 'g26', title: '～ことに(は)', desc: '令人~的是。', ex: [{j: '<ruby>残念<rt>ざんねん</rt></ruby>なことに、<ruby>負<rt>ま</rt></ruby>けてしまった。', c: '遺憾的是，輸掉了。'}]},
            { id: 'g27', title: '～ことになっている', desc: '規定、制度。', ex: [{j: '<ruby>教室<rt>きょうしつ</rt></ruby>では<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>すことになっている。', c: '教室規定要說日語。'}]},
            { id: 'g28', title: '～ことになる', desc: '決定、結果變成。', ex: [{j: '<ruby>来月<rt>らいげつ</rt></ruby><ruby>出張<rt>しゅっちょう</rt></ruby>することになりました。', c: '決定下個月要出差了。'}]},
            { id: 'g29', title: '～ことはない', desc: '不需要。', ex: [{j: '<ruby>泣<rt>な</rt></ruby>くことはありませんよ。', c: '不需要哭喔。'}]},
            { id: 'g30', title: '～さいちゅうに (最中に)', desc: '正當某動作之時。', ex: [{j: '<ruby>食事<rt>しょくじ</rt></ruby>の<ruby>最中<rt>さいちゅう</rt></ruby>に<ruby>電話<rt>でんわ</rt></ruby>がきた。', c: '正在吃飯時電話響了。'}]},
            { id: 'g31', title: '～さえ', desc: '甚至、連。', ex: [{j: '<ruby>名前<rt>なまえ</rt></ruby>さえ<ruby>忘<rt>わす</rt></ruby>れた。', c: '連名字都忘了。'}]},
            { id: 'g32', title: '～さえ～ば', desc: '只要~就。', ex: [{j: '<ruby>金<rt>かね</rt></ruby>さえあれば<ruby>幸<rt>しあわ</rt></ruby>せだ。', c: '只要有錢就幸福。'}]},
            { id: 'g33', title: '～せいだ / ～せいで', desc: '都怪~（不好的結果）。', ex: [{j: '<ruby>雨<rt>あめ</rt></ruby>のせいで<ruby>遅<rt>おく</rt></ruby>れた。', c: '因為下雨遲到了。'}]},
            { id: 'g34', title: '～たがる', desc: '想要（第三人稱欲望）。', ex: [{j: '<ruby>彼<rt>かれ</rt></ruby>は<ruby>新<rt>あたら</rt></ruby>しい<ruby>服<rt>ふく</rt></ruby>を<ruby>買<rt>か</rt></ruby>いたがっている。', c: '他想買新衣服。'}]},
            { id: 'g35', title: '～たところ', desc: '剛做了...結果...。', ex: [{j: '<ruby>先生<rt>せんせい</rt></ruby>に<ruby>聞<rt>き</rt></ruby>いたところ。', c: '問了老師後。'}]},
            { id: 'g36', title: '～たとたんに', desc: '一~就立刻。', ex: [{j: '<ruby>窓<rt>まど</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けたとたんに。', c: '一開窗戶。'}]},

                        ${g.ex.map(e => `
                            <div class="border-l-2 border-emerald-200 pl-3 text-center text-center">
                                <p class="japanese-text text-slate-800 text-base leading-relaxed text-center text-center">${e.j}</p>
                                <p class="text-xs text-slate-500 mt-0.5 text-center text-center">${e.c}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderVocab(filter = "") {
            const container = document.getElementById('vocab-body');
            const filteredData = rawVocab.filter((v, i) => 
                v[0].toLowerCase().includes(filter.toLowerCase()) || 
                v[1].toLowerCase().includes(filter.toLowerCase()) || 
                v[2].toLowerCase().includes(filter.toLowerCase()) ||
                (`V${i+1}`).toLowerCase().includes(filter.toLowerCase())
            );
            
            container.innerHTML = filteredData.map((v, i) => {
                const id = `n3fv${i}`;
                const scores = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                const isM = masteredIds.includes(id);
                return `
                    <tr class="vocab-row transition-all hover:bg-emerald-50 text-center ${isM ? 'is-mastered mastered' : ''}" data-id="${id}">
                        <td class="p-4 text-center">
                            <input type="checkbox" class="custom-checkbox text-center" ${isM ? 'checked' : ''} onchange="toggleMastered('${id}')">
                        </td>
                        <td class="p-4 font-mono text-slate-400 text-xs text-center text-center">V${i+1}</td>
                        <td class="p-4 text-center">
                            <div class="japanese-text font-bold text-lg text-slate-900 text-center">${v[0]}</div>
                            <div class="text-[10px] text-slate-400 japanese-text text-center text-center">${v[1]}</div>
                        </td>
                        <td class="p-4 text-center text-center">
                            <span class="font-bold text-emerald-700 text-center text-center">${v[2]}</span>
                        </td>
                        <td class="p-4 text-center">
                            <div class="flex gap-4 items-center justify-center text-center">
                                <div class="flex flex-col text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black text-center text-center">日</span>
                                    <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5">
                                        <div class="h-full bg-emerald-500" style="width: ${scores.jpToZh * 10}%"></div>
                                    </div>
                                </div>
                                <div class="flex flex-col text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black text-center text-center text-center">中</span>
                                    <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5 text-center text-center text-center">
                                        <div class="h-full bg-blue-400" style="width: ${scores.zhToJp * 10}%"></div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function loadNextFlashcard() {
            let pool = [];
            rawVocab.forEach((v, i) => {
                const id = `n3fv${i}`;
                const score = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                if (!masteredIds.includes(id)) {
                    if (score.jpToZh < 10) pool.push({ word: v, id: id, mode: 'jpToZh' });
                    if (score.zhToJp < 10) pool.push({ word: v, id: id, mode: 'zhToJp' });
                }
            });

            if (pool.length === 0) {
                document.getElementById('fc-main-display').classList.add('hidden');
                document.getElementById('fc-controls').classList.add('hidden');
                document.getElementById('fc-empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('fc-main-display').classList.remove('hidden');
            document.getElementById('fc-controls').classList.remove('hidden');
            document.getElementById('fc-empty-state').classList.add('hidden');
            document.getElementById('fc-answer-block').classList.remove('active');

            const pick = pool[Math.floor(Math.random() * pool.length)];
            currentFC = pick;
            fcMode = pick.mode;

            const modeDisplay = document.getElementById('fc-mode-display');
            if (fcMode === 'jpToZh') {
                modeDisplay.className = "absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-emerald-600 shadow-md transition-all text-center text-center";
                document.getElementById('fc-mode-text').innerText = '日譯中挑戰';
                document.getElementById('fc-question').innerHTML = formatRuby(pick.word[0], pick.word[1]);
                document.getElementById('fc-hint').innerText = "請回憶中文意義";
                document.getElementById('fc-target').innerText = pick.word[2];
                document.getElementById('fc-kana-display').innerText = "";
            } else {
                modeDisplay.className = "absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-blue-500 shadow-md transition-all text-center text-center";
                document.getElementById('fc-mode-text').innerText = '中譯日挑戰';
                document.getElementById('fc-question').innerText = pick.word[2];
                document.getElementById('fc-hint').innerText = "請回憶日文漢字或讀音";
                document.getElementById('fc-target').innerText = pick.word[0];
                document.getElementById('fc-kana-display').innerText = pick.word[1] || "";
            }
            document.getElementById('fc-example').innerText = pick.word[3];
            updateFCScoreDisplay();
        }

        function updateFCScoreDisplay() {
            const score = (vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 })[fcMode];
            document.getElementById('fc-current-score-text').innerText = score;
            const dots = document.getElementById('fc-score-dots');
            dots.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.className = `w-1.5 h-1.5 rounded-full ${i < score ? 'bg-white' : 'bg-white/30'}`;
                dots.appendChild(dot);
            }
        }

        function processFC(action) {
            if (!currentFC) return;
            if (action === 'answer') { document.getElementById('fc-answer-block').classList.add('active'); return; }

            let scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            if (action === 'master') scores[fcMode] = Math.min(10, scores[fcMode] + 5);
            else if (action === 'again') scores[fcMode] = Math.floor(scores[fcMode] / 2);
            
            vocabScores[currentFC.id] = scores;
            if (scores.jpToZh >= 10 && scores.zhToJp >= 10) masteredIds.push(currentFC.id);
            saveAndRefresh();
            loadNextFlashcard();
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) masteredIds.splice(index, 1);
            else { masteredIds.push(id); vocabScores[id] = { jpToZh: 10, zhToJp: 10 }; }
            saveAndRefresh(id);
        }

        function saveAndRefresh(id) {
            localStorage.setItem('meow_n3_ultra_v5', JSON.stringify(masteredIds));
            localStorage.setItem('meow_n3_scores_v5', JSON.stringify(vocabScores));
            if (id) renderVocab(document.getElementById('search-box').value);
            else { renderGrammar(); renderVocab(); }
            updateProgress();
        }

        function updateProgress() {
            const total = grammarData.length + rawVocab.length;
            const percent = total > 0 ? Math.round((masteredIds.length / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`section-${type}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active'); btn.classList.add('text-slate-400'); });
            document.getElementById(`tab-btn-${type}`).classList.add('tab-active');
            if (type === 'flashcard') loadNextFlashcard();
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmReset() { masteredIds = []; vocabScores = {}; saveAndRefresh(); closeModal(); if (!document.getElementById('section-flashcard').classList.contains('hidden')) loadNextFlashcard(); }

        window.onload = init;
    </script>
</body>
</html>
