<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow! N4 日本語達陣 - 終極全量學習系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; }
        ruby rt { font-size: 0.45em; color: #4338ca; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #f8fafc !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #4338ca; }
        .tab-active { color: #4338ca; border-bottom: 3px solid #4338ca; }
        .grammar-card { transition: all 0.2s; border-left: 5px solid transparent; }
        .grammar-card:hover { border-left-color: #4338ca; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        .reveal-info { display: none; }
        .reveal-info.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20 text-center">

    <header class="bg-indigo-900 text-white py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl font-black mb-1 tracking-tight">Meow! N4 日本語達陣</h1>
        <p class="text-indigo-100 opacity-90 text-sm font-medium">中級前期：全量單字庫 (600+) × 核心文法 (60項) 學習導航</p>
    </header>

    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm text-center">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4 text-center">
            <div class="flex items-center gap-4 text-center">
                <div class="flex flex-col text-center">
                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider text-center">N4 總進度</span>
                    <div class="flex items-center gap-2 text-center">
                        <div class="w-32 h-2 bg-slate-200 rounded-full overflow-hidden text-center text-center">
                            <div id="progress-bar" class="h-full bg-indigo-600 transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <span id="progress-text" class="text-sm font-bold text-indigo-700">0%</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2 text-center">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-semibold transition flex items-center gap-2 shadow-sm">
                    <span id="toggle-icon">👁️</span> <span id="toggle-label">隱藏已掌握內容</span>
                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-semibold transition flex items-center gap-2 shadow-sm">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-6xl text-center">
        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap text-center">
            <button onclick="switchTab('grammar')" id="tab-btn-grammar" class="tab-btn px-6 py-4 font-bold text-lg tab-active transition">核心文法 (60)</button>
            <button onclick="switchTab('vocab')" id="tab-btn-vocab" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-indigo-600 transition">全單字庫</button>
            <button onclick="switchTab('flashcard')" id="tab-btn-flashcard" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-indigo-600 transition">智能學習卡</button>
        </div>

        <!-- Grammar Section -->
        <div id="section-grammar" class="tab-content grid grid-cols-1 lg:grid-cols-2 gap-6 text-center"></div>

        <!-- Vocab Section -->
        <div id="section-vocab" class="tab-content hidden text-center">
            <div class="mb-6 relative">
                <input type="text" id="search-box" placeholder="搜尋 N4 單字、假名、中文..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition shadow-sm">
                <span class="absolute left-4 top-3.5 text-slate-400">🔍</span>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden text-center">
                <table class="w-full text-left border-collapse text-center">
                    <thead class="bg-slate-50 border-b border-slate-200 text-center">
                        <tr>
                            <th class="p-4 w-16 text-center">掌握</th>
                            <th class="p-4 w-1/4 text-center text-center">單字 / 假名</th>
                            <th class="p-4 w-1/4 text-indigo-700 text-center text-center">中文意義</th>
                            <th class="p-4 text-center text-center">學習進度 (日/中)</th>
                        </tr>
                    </thead>
                    <tbody id="vocab-body" class="divide-y divide-slate-100 text-sm text-center"></tbody>
                </table>
            </div>
        </div>

        <!-- Flashcard Section -->
        <div id="section-flashcard" class="tab-content hidden text-center">
            <div class="max-w-lg mx-auto text-center">
                <div id="fc-container" class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-10 min-h-[500px] flex flex-col items-center justify-between text-center relative overflow-hidden transition-all text-center">
                    <div id="fc-mode-display" class="absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white">
                        <span id="fc-mode-text">模式載入中</span>
                        <div class="flex gap-1" id="fc-score-dots"></div>
                    </div>
                    <div id="fc-main-display" class="w-full flex-grow flex flex-col items-center justify-center pt-8 text-center text-center">
                        <div id="fc-question" class="japanese-text text-5xl font-black text-slate-900 mb-2 leading-[1.5em] h-[2.5em] flex items-center justify-center text-center text-center"></div>
                        <div id="fc-hint" class="text-slate-400 text-xs font-bold uppercase tracking-tighter h-4 mb-10 text-center text-center"></div>
                        <div id="fc-answer-block" class="reveal-info w-full animate-fade-in border-t border-slate-100 pt-6 text-center text-center">
                            <div id="fc-target" class="text-3xl font-bold text-indigo-600 mb-2 japanese-text text-center text-center"></div>
                            <div id="fc-kana-display" class="text-slate-500 text-sm mb-6 japanese-text text-center text-center text-center"></div>
                            <div class="bg-slate-50 p-5 rounded-3xl text-left border border-indigo-100 text-center">
                                <p class="text-[9px] font-black text-indigo-400 uppercase mb-2 text-center text-center">學習範例</p>
                                <p id="fc-example" class="japanese-text text-slate-700 text-base leading-relaxed text-center text-center"></p>
                            </div>
                        </div>
                    </div>
                    <div id="fc-empty-state" class="hidden py-16 text-center text-center">
                        <div class="text-7xl mb-6 text-center text-center">🏁</div>
                        <h3 class="text-2xl font-black text-slate-900 mb-2 text-center text-center">N4 學習達成！</h3>
                        <p class="text-slate-500 text-sm text-center text-center text-center">太出色了！目前沒有需要練習的單字囉。</p>
                    </div>
                    <div id="fc-controls" class="w-full grid grid-cols-3 gap-4 mt-8 text-center text-center">
                        <button onclick="processFC('again')" class="flex flex-col items-center py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-3xl transition-all active:scale-95 text-center">
                            <span class="text-2xl mb-1 text-center">🔄</span><span class="text-[10px] font-black text-center text-center text-center">再來</span>
                        </button>
                        <button onclick="processFC('answer')" id="fc-btn-answer" class="flex flex-col items-center py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-3xl transition-all active:scale-95 shadow-lg shadow-indigo-100 text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center">💡</span><span class="text-[10px] font-black text-center text-center text-center">答案</span>
                        </button>
                        <button onclick="processFC('master')" class="flex flex-col items-center py-4 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-3xl transition-all active:scale-95 text-center">
                            <span class="text-2xl mb-1 text-center text-center text-center">✅</span><span class="text-[10px] font-black text-center text-center text-center">掌握</span>
                        </button>
                    </div>
                </div>
                <div class="mt-6 text-center text-center">
                    <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest text-center text-center">目前項面積分: <span id="fc-current-score-text">0</span> / 10</p>
                </div>
            </div>
        </div>
    </main>

    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 text-center">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 text-center text-center text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl text-center text-center">⚠️</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2 text-center text-center">重置 Meow! N4 進度嗎？</h3>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed text-center text-center text-center">這將永久清除所有 N4 掌握記錄、單字雙向積分。動作無法復原。</p>
            <div class="flex flex-col gap-3 text-center text-center text-center">
                <button onclick="confirmReset()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition shadow-lg shadow-red-200 text-center">確定重置</button>
                <button onclick="closeModal()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition text-center text-center text-center">取消返回</button>
            </div>
        </div>
    </div>

    <footer class="bg-slate-900 text-slate-500 py-12 px-4 text-center">
        <div class="container mx-auto">
            <p class="mb-4">© 2026 Meow! 日本語達陣學習計畫 - 致力於提供最高品質的自學資源</p>
        </div>
    </footer>

    <script>
        const grammarData = [
            { id: 'n4g1', title: '～んです', desc: '口語表現：說明狀況、確認或要求說明。', ex: [{j:'明日から旅行へ行くんです。', c:'明天開始要去旅行呀。'}, {j:'気分が悪いんですか。', c:'你是不是身體不舒服？'}]},
            { id: 'n4g2', title: '～ていただけませんか', desc: '禮貌請求：比～てください更禮貌的表達。', ex: [{j:'日本語学校を紹介していたいただけませんか。', c:'能否介紹好的學校給我？'}]},

            { id: 'n4g4', title: '可能動詞', desc: '能力：表示能夠、會、識做某事。', ex: [{j:'日本語が少し話せます。', c:'識說少少日語。'}, {j:'寿司が食べられます。', c:'能吃到壽司。'}]},
            { id: 'n4g5', title: '～しか（～ない）', desc: '限定：表示「只有」，後接否定。', ex: [{j:'百円しかないので買えません。', c:'只有100日元所以買不了。'}]},
            { id: 'n4g6', title: '～ながら', desc: '同時進行：一邊做 A 一邊做 B。', ex: [{j:'音楽を聴きながら散歩します。', c:'一邊聽音樂一邊散步。'}]},
            { id: 'n4g7', title: '～ています (習慣)', desc: '長期行為：表示長期反覆進行的習慣。', ex: [{j:'休みの日は日本ドラマを見ています。', c:'休息日通常在看日劇。'}]},
            { id: 'n4g8', title: '～し、～し', desc: '列舉原因：又...又...，列舉理由。', ex: [{j:'面白いし、絵もきれいですから。', c:'既有趣，畫也好看。'}]},

            { id: 'n4g10', title: '～てしまいました', desc: '完了/遺憾：動作完成或表示後悔。', ex: [{j:'財布を落としてしまいました。', c:'我不小心把錢包弄丟了。'}]},

            { id: 'n4g31', title: '～ないように', desc: '目的：為了不發生某事。', ex: [{j:'忘れないように書きます。', c:'為了不忘記而寫。'}]},
            { id: 'n4g32', title: '～ようになります', desc: '能力變化：變得會做...。', ex: [{j:'日本語が話せるようになりました。', c:'我變得會說日語了。'}]},
            { id: 'n4g33', title: '～ようにします', desc: '習慣：努力保持某個習慣。', ex: [{j:'何でも食べるようにしています。', c:'我盡量習慣什麼都食。'}]},
            { id: 'n4g34', title: '受身形', desc: '被動：被某人做某事。', ex: [{j:'読まれています。', c:'廣為閱讀。'}]},
            { id: 'n4g35', title: '～のは / ～のが / ～のを', desc: '名詞化：轉化動作為名詞。', ex: [{j:'絵を描くのは楽しいです。', c:'畫畫很開心。'}]},
            { id: 'n4g36', title: '倒置法', desc: '強調：強調名詞的說法。', ex: [{j:'生まれたのは日本です。', c:'我出生於日本。'}]},
            { id: 'n4g37', title: '～て(で) (原因)', desc: '連接句子表示原因。', ex: [{j:'遅れて叱られました。', c:'因為遲到被罵了。'}]},
            { id: 'n4g38', title: 'ので', desc: '原因：因為（較客氣且客觀）。', ex: [{j:'用事があるので失礼します。', c:'因為有事我先告辭。'}]},
            { id: 'n4g39', title: '～かどうか', desc: '疑問：是否。', ex: [{j:'行けるかどうか分かりません。', c:'還不知道是否能去。'}]},
            { id: 'n4g40', title: '～てみます', desc: '試行：試一試做某事。', ex: [{j:'食べてみます。', c:'試一試吃。'}]},
            { id: 'n4g41', title: '～ていただきます', desc: '授受：從尊輩處領受恩惠。', ex: [{j:'直していただきました。', c:'獲老師給我改正了。'}]},
            { id: 'n4g42', title: '～てくださいました', desc: '授受：尊輩主動給我恩惠。', ex: [{j:'先生が直してくださいました。', c:'老師給我改正了。'}]},

            { id: 'n4g45', title: '～のに (用途)', desc: '用途：為了某目的使用。', ex: [{j:'切るのに使います。', c:'用來剪。'}]},
            { id: 'n4g46', title: 'そうです (樣態)', desc: '看起來似乎要發生。', ex: [{j:'桜が咲きそうです。', c:'櫻花似乎要開了。'}]},
            { id: 'n4g47', title: '～てきます', desc: '移動：去做了某事後回來。', ex: [{j:'飲み物を買って来ます。', c:'去買飲料再回來。'}]},
            { id: 'n4g48', title: '～すぎます', desc: '太過：程度超出正常。', ex: [{j:'飲み過ぎました。', c:'酒喝得太多了。'}]},
            { id: 'n4g49', title: '～やすい', desc: '難易：容易做。', ex: [{j:'説明がわかりやすい。', c:'解釋易明白。'}]},
            { id: 'n4g50', title: '～にくい', desc: '難易：很難做。', ex: [{j:'運転しにくいです。', c:'很難駕駛。'}]},

                            <h3 class="text-xl font-bold text-slate-900 japanese-text text-center text-center">${g.title}</h3>
                        </div>
                        <input type="checkbox" class="custom-checkbox text-center" ${masteredIds.includes(g.id) ? 'checked' : ''} onchange="toggleMastered('${g.id}')">
                    </div>
                    <p class="text-sm text-slate-600 mb-4 font-medium text-center text-center">${g.desc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl space-y-3 text-center">
                        ${g.ex.map(e => `
                            <div class="border-l-2 border-indigo-200 pl-3 text-center">
                                <p class="japanese-text text-slate-800 text-base leading-relaxed text-center">${e.j}</p>
                                <p class="text-xs text-slate-500 mt-0.5 text-center">${e.c}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderVocab(filter = "") {
            const container = document.getElementById('vocab-body');
            const filteredData = rawVocab.filter(v => 
                v[0].toLowerCase().includes(filter.toLowerCase()) || 
                v[1].toLowerCase().includes(filter.toLowerCase()) || 
                v[2].toLowerCase().includes(filter.toLowerCase())
            );
            
            container.innerHTML = filteredData.map((v, i) => {
                const id = `n4v${i}`;
                const scores = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                return `
                    <tr class="vocab-row transition-all hover:bg-slate-50 ${masteredIds.includes(id) ? 'is-mastered mastered' : ''}" data-id="${id}">
                        <td class="p-4 text-center">
                            <input type="checkbox" class="custom-checkbox" ${masteredIds.includes(id) ? 'checked' : ''} onchange="toggleMastered('${id}')">
                        </td>
                        <td class="p-4">
                            <div class="japanese-text font-bold text-lg text-slate-900">${v[0]}</div>
                            <div class="text-[11px] text-slate-400 japanese-text">${v[1]}</div>
                        </td>
                        <td class="p-4">
                            <span class="font-bold text-indigo-700">${v[2]}</span>
                        </td>
                        <td class="p-4">
                            <div class="flex gap-4 items-center justify-center">
                                <div class="flex flex-col text-center">
                                    <span class="text-[8px] text-slate-400 font-black">日</span>
                                    <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5"><div class="h-full bg-blue-500" style="width: ${scores.jpToZh * 10}%"></div></div>
                                </div>
                                <div class="flex flex-col text-center text-center">
                                    <span class="text-[8px] text-slate-400 font-black">中</span>
                                    <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5"><div class="h-full bg-amber-500" style="width: ${scores.zhToJp * 10}%"></div></div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function loadNextFlashcard() {
            let pool = [];
            rawVocab.forEach((v, i) => {
                const id = `n4v${i}`;
                const score = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                if (!masteredIds.includes(id)) {
                    if (score.jpToZh < 10) pool.push({ word: v, id, mode: 'jpToZh' });
                    if (score.zhToJp < 10) pool.push({ word: v, id, mode: 'zhToJp' });
                }
            });

            if (pool.length === 0) {
                document.getElementById('fc-main-display').classList.add('hidden');
                document.getElementById('fc-controls').classList.add('hidden');
                document.getElementById('fc-empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('fc-main-display').classList.remove('hidden');
            document.getElementById('fc-controls').classList.remove('hidden');
            document.getElementById('fc-empty-state').classList.add('hidden');
            document.getElementById('fc-answer-block').classList.remove('active');

            currentFC = pool[Math.floor(Math.random() * pool.length)];
            fcMode = currentFC.mode;

            const badge = document.getElementById('fc-mode-badge');
            if (fcMode === 'jpToZh') {
                badge.innerText = '日譯中挑戰';
                badge.className = 'absolute top-6 left-1/2 -translate-x-1/2 px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-[0.2em] shadow-sm bg-blue-100 text-blue-700';
                document.getElementById('fc-question').innerHTML = formatRuby(currentFC.word[0], currentFC.word[1]);
                document.getElementById('fc-hint').innerText = "請回答中文解釋";
                document.getElementById('fc-target').innerText = currentFC.word[2];
                document.getElementById('fc-kana-display').innerText = ""; 
            } else {
                badge.innerText = '中譯日挑戰';
                badge.className = 'absolute top-6 left-1/2 -translate-x-1/2 px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-[0.2em] shadow-sm bg-amber-100 text-amber-700 text-center';
                document.getElementById('fc-question').innerHTML = currentFC.word[2];
                document.getElementById('fc-hint').innerText = "請回答日文漢字/假名";
                document.getElementById('fc-target').innerText = currentFC.word[0];
                document.getElementById('fc-kana-display').innerText = currentFC.word[1] || "";
            }
            document.getElementById('fc-example').innerText = currentFC.word[3];
            updateScoreUI();
        }

        function updateScoreUI() {
            const val = (vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 })[fcMode];
            document.getElementById('fc-current-score-text').innerText = val;
        }

        function processFC(action) {
            if (!currentFC) return;
            if (action === 'answer') { document.getElementById('fc-answer-block').classList.add('active'); return; }

            let scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            if (action === 'master') scores[fcMode] = Math.min(10, scores[fcMode] + 5);
            else if (action === 'again') scores[fcMode] = Math.floor(scores[fcMode] / 2);
            
            vocabScores[currentFC.id] = scores;
            if (scores.jpToZh >= 10 && scores.zhToJp >= 10) {
                if (!masteredIds.includes(currentFC.id)) masteredIds.push(currentFC.id);
            }
            saveAndRefresh();
            loadNextFlashcard();
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) masteredIds.splice(index, 1);
            else { masteredIds.push(id); vocabScores[id] = { jpToZh: 10, zhToJp: 10 }; }
            saveAndRefresh(id);
        }

        function saveAndRefresh(id) {
            localStorage.setItem('meow_n4_mastered_ids_final', JSON.stringify(masteredIds));
            localStorage.setItem('meow_n4_scores_final', JSON.stringify(vocabScores));
            if (id) renderVocab(document.getElementById('search-box').value);
            else { renderGrammar(); renderVocab(); }
            updateProgress();
        }

        function updateProgress() {
            const total = grammarData.length + rawVocab.length;
            const percent = total > 0 ? Math.round((masteredIds.length / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`section-${type}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active'); btn.classList.add('text-slate-400'); });
            document.getElementById(`tab-btn-${type}`).classList.add('tab-active');
            if (type === 'flashcard') loadNextFlashcard();
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmReset() { masteredIds = []; vocabScores = {}; saveAndRefresh(); closeModal(); if (!document.getElementById('section-flashcard').classList.contains('hidden')) loadNextFlashcard(); }

        window.onload = init;
    </script>
</body>
</html>
