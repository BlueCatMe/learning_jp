<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow! N5 日本語達陣 - 終極全量學習系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; }
        ruby rt { font-size: 0.45em; color: #6366f1; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #f8fafc !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #4f46e5; }
        .tab-active { color: #4f46e5; border-bottom: 3px solid #4f46e5; }
        .grammar-card { transition: all 0.2s; border-left: 5px solid transparent; }
        .grammar-card:hover { border-left-color: #6366f1; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        .reveal-info { display: none; }
        .reveal-info.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20 text-center">

    <header class="bg-indigo-700 text-white py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl font-black mb-1 tracking-tight">Meow! N5 日本語達陣</h1>
        <p class="text-indigo-100 opacity-90 text-sm font-medium">入門基礎：全量單字庫 (200+) × 核心文法 (25) 雙向學習卡</p>
    </header>

    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm text-center">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4 text-center">
            <div class="flex items-center gap-4">
                <div class="flex flex-col">
                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider text-center">總掌握進度</span>
                    <div class="flex items-center gap-2">
                        <div class="w-32 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-indigo-500 transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <span id="progress-text" class="text-sm font-bold text-indigo-700">0%</span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-semibold transition flex items-center gap-2 shadow-sm">
                    <span id="toggle-icon">👁️</span> <span id="toggle-label">隱藏已掌握內容</span>
                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-semibold transition flex items-center gap-2 shadow-sm">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap text-center">
            <button onclick="switchTab('grammar')" id="tab-btn-grammar" class="tab-btn px-6 py-4 font-bold text-lg tab-active transition">核心文法 (25)</button>
            <button onclick="switchTab('vocab')" id="tab-btn-vocab" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-indigo-600 transition">全單字庫</button>
            <button onclick="switchTab('flashcard')" id="tab-btn-flashcard" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-indigo-600 transition">雙向學習卡</button>
        </div>

        <!-- Grammar Section -->
        <div id="section-grammar" class="tab-content grid grid-cols-1 lg:grid-cols-2 gap-6 text-center"></div>

        <!-- Vocab Section -->
        <div id="section-vocab" class="tab-content hidden">
            <div class="mb-6 relative">
                <input type="text" id="search-box" placeholder="搜尋漢字、假名或中文..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition shadow-sm">
                <span class="absolute left-4 top-3.5 text-slate-400">🔍</span>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden text-center">
                <table class="w-full text-left border-collapse text-center">
                    <thead class="bg-slate-50 border-b border-slate-200 text-center">
                        <tr class="text-center">
                            <th class="p-4 w-16 text-center">掌握</th>
                            <th class="p-4 w-1/4 text-center">單字 / 假名</th>
                            <th class="p-4 w-1/4 text-indigo-700 text-center">中文意義</th>
                            <th class="p-4 text-center">積分 (日中/中日)</th>
                        </tr>
                    </thead>
                    <tbody id="vocab-body" class="divide-y divide-slate-100 text-sm text-center"></tbody>
                </table>
            </div>
        </div>

        <!-- Flashcard Section -->
        <div id="section-flashcard" class="tab-content hidden text-center">
            <div class="max-w-lg mx-auto text-center">
                <div id="fc-container" class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-10 min-h-[450px] flex flex-col items-center justify-between text-center relative overflow-hidden transition-all text-center">
                    <div id="fc-mode-badge" class="absolute top-6 left-1/2 -translate-x-1/2 px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-[0.2em] shadow-sm">模式</div>
                    <div id="fc-main-display" class="w-full flex-grow flex flex-col items-center justify-center py-6 text-center">
                        <div id="fc-question" class="japanese-text text-5xl font-black text-slate-900 mb-2 leading-tight text-center">讀取中...</div>
                        <div id="fc-hint" class="text-slate-400 text-sm h-6 mb-8 text-center"></div>
                        <div id="fc-answer-block" class="reveal-info w-full animate-fade-in border-t border-slate-100 pt-6 text-center">
                            <div id="fc-target" class="text-3xl font-bold text-indigo-600 mb-2 japanese-text text-center"></div>
                            <div id="fc-kana-display" class="text-slate-500 text-lg japanese-text mb-4 text-center"></div>
                            <div class="bg-indigo-50/50 p-5 rounded-3xl text-left border border-indigo-100/50 text-center">
                                <p class="text-[10px] font-bold text-indigo-400 uppercase mb-1 text-center">例句範本</p>
                                <p id="fc-example" class="japanese-text text-slate-700 text-base leading-relaxed text-center"></p>
                            </div>
                        </div>
                    </div>
                    <div id="fc-empty-state" class="hidden py-16 text-center">
                        <div class="text-7xl mb-6 text-center">🏆</div>
                        <h3 class="text-2xl font-bold text-slate-900 mb-2 text-center">全方位掌握！</h3>
                        <p class="text-slate-500 text-center">目前沒有需要練習的雙向單字囉。</p>
                    </div>
                    <div id="fc-controls" class="w-full grid grid-cols-3 gap-4 pt-8 text-center">
                        <button onclick="processFC('again')" class="flex flex-col items-center py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-3xl transition-transform active:scale-95 text-center">
                            <span class="text-2xl mb-1 text-center">🔄</span><span class="text-[10px] font-black text-center">再來</span>
                        </button>
                        <button onclick="processFC('answer')" id="fc-btn-answer" class="flex flex-col items-center py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-3xl transition-transform active:scale-95 shadow-lg shadow-indigo-200 text-center">
                            <span class="text-2xl mb-1 text-center">💡</span><span class="text-[10px] font-black text-center">答案</span>
                        </button>
                        <button onclick="processFC('master')" class="flex flex-col items-center py-4 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-3xl transition-transform active:scale-95 text-center">
                            <span class="text-2xl mb-1 text-center text-center">✅</span><span class="text-[10px] font-black text-center">掌握</span>
                        </button>
                    </div>
                </div>
                <div class="mt-8 flex justify-center items-center gap-6 text-center">
                    <div class="flex flex-col items-center text-center">
                        <span class="text-[9px] text-slate-400 font-bold uppercase mb-1 text-center">本次單字積分</span>
                        <div class="flex gap-1 text-center" id="fc-score-dots"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 text-center">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 text-center text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl text-center">⚠️</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2 text-center">重置所有進度？</h3>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed text-center">這將清除所有文法紀錄與單字積分。此動作無法復原。</p>
            <div class="flex flex-col gap-3 text-center">
                <button onclick="confirmReset()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition shadow-lg shadow-red-200 text-center">確定重置</button>
                <button onclick="closeModal()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition text-center">取消返回</button>
            </div>
        </div>
    </div>

        let masteredIds = JSON.parse(localStorage.getItem('meow_n5_mastered_final_v2') || '[]');
        let vocabScores = JSON.parse(localStorage.getItem('meow_n5_scores_final_v2') || '{}');
        let hideMode = false;
        let currentFC = null;
        let fcMode = 'jpToZh';

        function init() {
            renderGrammar();
            renderVocab();
            updateProgress();
            
            document.getElementById('toggle-hide').addEventListener('click', () => {
                hideMode = !hideMode;
                document.body.classList.toggle('hide-mastered', hideMode);
                document.getElementById('toggle-label').innerText = hideMode ? "顯示全部內容" : "隱藏已掌握內容";
                document.getElementById('toggle-icon').innerText = hideMode ? "👁️‍🗨️" : "👁️";
            });

            document.getElementById('reset-progress').addEventListener('click', () => {
                document.getElementById('confirm-modal').style.display = 'flex';
            });

            document.getElementById('search-box').addEventListener('input', (e) => {
                renderVocab(e.target.value);
            });
        }

        function formatRuby(word, kana) {
            if (!kana || word === kana) return word;
            return `<ruby>${word}<rt>${kana}</rt></ruby>`;
        }

        function renderGrammar() {
            const container = document.getElementById('section-grammar');
            container.innerHTML = grammarData.map(g => `
                <div class="grammar-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200 ${masteredIds.includes(g.id) ? 'is-mastered mastered' : ''}" data-id="${g.id}">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <span class="bg-indigo-600 text-white text-[10px] px-2 py-1 rounded font-bold uppercase tracking-tighter">Grammar</span>
                            <h3 class="text-xl font-bold text-slate-900 japanese-text text-center">${g.title}</h3>
                        </div>
                        <input type="checkbox" class="custom-checkbox" ${masteredIds.includes(g.id) ? 'checked' : ''} onchange="toggleMastered('${g.id}')">
                    </div>
                    <p class="text-sm text-slate-600 mb-4 font-medium text-center">${g.desc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl space-y-3">
                        ${g.ex.map(e => `
                            <div class="border-l-2 border-indigo-200 pl-3">
                                <div class="flex gap-2">
                                    ${e.t ? `<span class="text-[9px] bg-indigo-100 text-indigo-700 h-fit px-1 rounded mt-1">${e.t}</span>` : ''}
                                    <p class="japanese-text text-slate-800 text-base leading-relaxed text-center">${e.j}</p>
                                </div>
                                <p class="text-xs text-slate-500 mt-0.5 text-center">${e.c}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderVocab(filter = "") {
            const container = document.getElementById('vocab-body');
            const filteredData = rawVocab.filter(v => 
                v[0].toLowerCase().includes(filter.toLowerCase()) || 
                v[1].toLowerCase().includes(filter.toLowerCase()) || 
                v[2].toLowerCase().includes(filter.toLowerCase())
            );
            
            container.innerHTML = filteredData.map((v, i) => {
                const id = `v${i}`;
                const scores = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                return `
                    <tr class="vocab-row transition-all hover:bg-slate-50 ${masteredIds.includes(id) ? 'is-mastered mastered' : ''}" data-id="${id}">
                        <td class="p-4 text-center">
                            <input type="checkbox" class="custom-checkbox" ${masteredIds.includes(id) ? 'checked' : ''} onchange="toggleMastered('${id}')">
                        </td>
                        <td class="p-4 text-center">
                            <div class="japanese-text font-bold text-lg text-slate-900">${v[0]}</div>
                            <div class="text-[11px] text-slate-400 japanese-text">${v[1]}</div>
                        </td>
                        <td class="p-4 text-center">
                            <span class="font-bold text-indigo-700">${v[2]}</span>
                        </td>
                        <td class="p-4 text-center">
                            <div class="flex gap-4 items-center justify-center">
                                <div class="flex flex-col">
                                    <span class="text-[9px] text-slate-400 uppercase font-black">日</span>
                                    <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5">
                                        <div class="h-full bg-blue-500" style="width: ${scores.jpToZh * 10}%"></div>
                                    </div>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-[9px] text-slate-400 uppercase font-black">中</span>
                                    <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5">
                                        <div class="h-full bg-amber-500" style="width: ${scores.zhToJp * 10}%"></div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function loadNextFlashcard() {
            const pool = [];
            rawVocab.forEach((v, i) => {
                const id = `v${i}`;
                const scores = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                if (!masteredIds.includes(id)) {
                    if (scores.jpToZh < 10) pool.push({ word: v, id: id, mode: 'jpToZh' });
                    if (scores.zhToJp < 10) pool.push({ word: v, id: id, mode: 'zhToJp' });
                }
            });

            if (pool.length === 0) {
                document.getElementById('fc-main-display').classList.add('hidden');
                document.getElementById('fc-controls').classList.add('hidden');
                document.getElementById('fc-empty-state').classList.remove('hidden');
                document.getElementById('fc-mode-badge').classList.add('hidden');
                return;
            }

            document.getElementById('fc-main-display').classList.remove('hidden');
            document.getElementById('fc-controls').classList.remove('hidden');
            document.getElementById('fc-empty-state').classList.add('hidden');
            document.getElementById('fc-mode-badge').classList.remove('hidden');
            document.getElementById('fc-answer-block').classList.remove('active');

            currentFC = pool[Math.floor(Math.random() * pool.length)];
            fcMode = currentFC.mode;

            const badge = document.getElementById('fc-mode-badge');
            if (fcMode === 'jpToZh') {
                badge.innerText = '日譯中挑戰';
                badge.className = 'absolute top-6 left-1/2 -translate-x-1/2 px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-[0.2em] shadow-sm bg-blue-100 text-blue-700 text-center';
                document.getElementById('fc-question').innerHTML = formatRuby(currentFC.word[0], currentFC.word[1]);
                document.getElementById('fc-hint').innerText = "請回答中文解釋";
                document.getElementById('fc-target').innerText = currentFC.word[2];
                document.getElementById('fc-kana-display').innerText = "";
            } else {
                badge.innerText = '中譯日挑戰';
                badge.className = 'absolute top-6 left-1/2 -translate-x-1/2 px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-[0.2em] shadow-sm bg-amber-100 text-amber-700 text-center';
                document.getElementById('fc-question').innerText = currentFC.word[2];
                document.getElementById('fc-hint').innerText = "請回答日文單字與讀音";
                document.getElementById('fc-target').innerText = currentFC.word[0];
                document.getElementById('fc-kana-display').innerText = currentFC.word[1] || "";
            }
            document.getElementById('fc-example').innerText = currentFC.word[3];
            updateFCScores();
        }

        function updateFCScores() {
            const score = (vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 })[fcMode];
            const container = document.getElementById('fc-score-dots');
            container.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.className = `w-2 h-2 rounded-full ${i < score ? (fcMode === 'jpToZh' ? 'bg-blue-500' : 'bg-amber-500') : 'bg-slate-200'}`;
                container.appendChild(dot);
            }
        }

        function processFC(action) {
            if (!currentFC) return;
            if (action === 'answer') { document.getElementById('fc-answer-block').classList.add('active'); return; }

            let scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            if (action === 'master') scores[fcMode] = Math.min(10, scores[fcMode] + 5);
            else if (action === 'again') scores[fcMode] = Math.floor(scores[fcMode] / 2);
            
            vocabScores[currentFC.id] = scores;
            if (scores.jpToZh >= 10 && scores.zhToJp >= 10) {
                if (!masteredIds.includes(currentFC.id)) masteredIds.push(currentFC.id);
            }
            saveAndRefresh();
            loadNextFlashcard();
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) {
                masteredIds.splice(index, 1);
            } else {
                masteredIds.push(id);
                vocabScores[id] = { jpToZh: 10, zhToJp: 10 };
            }
            saveAndRefresh(id);
        }

        function saveAndRefresh(id) {
            localStorage.setItem('meow_n5_mastered_final_v2', JSON.stringify(masteredIds));
            localStorage.setItem('meow_n5_scores_final_v2', JSON.stringify(vocabScores));
            if (id) renderVocab(document.getElementById('search-box').value);
            else { renderGrammar(); renderVocab(); }
            updateProgress();
        }

        function updateProgress() {
            const total = grammarData.length + rawVocab.length;
            const percent = total > 0 ? Math.round((masteredIds.length / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`section-${type}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('text-slate-400');
            });
            document.getElementById(`tab-btn-${type}`).classList.add('tab-active');
            if (type === 'flashcard') loadNextFlashcard();
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmReset() { masteredIds = []; vocabScores = {}; saveAndRefresh(); closeModal(); if (!document.getElementById('section-flashcard').classList.contains('hidden')) loadNextFlashcard(); }

        window.onload = init;
    </script>
