<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow! N5 日本語達陣 - 終極全量去重系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; }
        ruby rt { font-size: 0.5em; color: #4338ca; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #f8fafc !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #4338ca; }
        .tab-active { color: #4338ca; border-bottom: 3px solid #4338ca; }
        .grammar-card { transition: all 0.2s; border-left: 5px solid transparent; }
        .grammar-card:hover { border-left-color: #4338ca; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        .reveal-info { display: none; }
        .reveal-info.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <header class="bg-indigo-700 text-white py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl font-black mb-1 tracking-tight">Meow! N5 日本語達陣</h1>
        <p class="text-indigo-100 opacity-90 text-sm font-medium">入門基礎：全方位核心語彙與 25 項完整文法系統</p>
    </header>

    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="flex flex-col">
                    <span class="text-[9px] text-slate-400 font-black uppercase tracking-widest">N5 總掌握進度</span>
                    <div class="flex items-center gap-2">
                        <div class="w-40 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-indigo-600 transition-all duration-500"></div>
                        </div>
                        <span id="progress-text" class="text-xs font-bold text-indigo-700">0%</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm">
                    <span id="toggle-icon">👁️</span> <span id="toggle-label">隱藏已掌握</span>
                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-7xl">
        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap">
            <button onclick="switchTab('grammar')" id="tab-btn-grammar" class="tab-btn px-6 py-4 font-bold text-lg tab-active transition">核心文法 (G1-G25)</button>
            <button onclick="switchTab('vocab')" id="tab-btn-vocab" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-indigo-600 transition">全量單字庫 (去重版)</button>
            <button onclick="switchTab('flashcard')" id="tab-btn-flashcard" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-indigo-600 transition">雙向智能學習卡</button>
        </div>

        <!-- Grammar Section -->
        <div id="section-grammar" class="tab-content grid grid-cols-1 lg:grid-cols-2 gap-6"></div>

        <!-- Vocab Section -->
        <div id="section-vocab" class="tab-content hidden">
            <div class="mb-6 relative">
                <input type="text" id="search-box" placeholder="搜尋單字、假名或意思..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition shadow-sm">
                <span class="absolute left-4 top-3.5 text-slate-400">🔍</span>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 border-b border-slate-200 text-center">
                            <tr>
                                <th class="p-4 w-16 text-center">掌握</th>
                                <th class="p-4 w-20 text-center text-indigo-600 font-bold border-r">編號</th>
                                <th class="p-4 w-1/5 text-center">單字 / 假名</th>
                                <th class="p-4 w-1/5 text-indigo-700 text-center">中文意義</th>
                                <th class="p-4 text-center">實戰例句</th>
                                <th class="p-4 w-24 text-center">雙向積分</th>
                            </tr>
                        </thead>
                        <tbody id="vocab-body" class="divide-y divide-slate-100 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Flashcard Section -->
        <div id="section-flashcard" class="tab-content hidden">
            <div class="max-w-lg mx-auto">
                <div id="fc-container" class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-10 min-h-[500px] flex flex-col items-center justify-between relative overflow-hidden transition-all text-center">
                    
                    <!-- Mode & Score Header -->
                    <div id="fc-header" class="absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white shadow-md transition-all">
                        <div class="flex items-center gap-2">
                            <span id="fc-mode-text">模式載入中</span>
                            <span class="bg-white/20 px-2 py-0.5 rounded text-[9px] font-bold">積分: <span id="fc-current-score-text">0</span> / 10</span>
                        </div>
                        <div class="flex gap-1" id="fc-score-dots"></div>
                    </div>

                    <div id="fc-main-display" class="w-full flex-grow flex flex-col items-center justify-center pt-8">
                        <div id="fc-question" class="japanese-text text-5xl font-black text-slate-900 mb-2 leading-[1.5em] h-[2.5em] flex items-center justify-center"></div>
                        <div id="fc-hint" class="text-slate-400 text-xs font-bold uppercase tracking-tighter h-4 mb-10"></div>
                        
                        <!-- Answer Block -->
                        <div id="fc-answer-block" class="reveal-info w-full animate-fade-in border-t border-slate-100 pt-6">
                            <div id="fc-target" class="text-3xl font-bold text-indigo-600 mb-2 japanese-text"></div>
                            <div id="fc-kana-display" class="text-slate-500 text-sm mb-6 japanese-text"></div>
                            <div class="bg-indigo-50 p-5 rounded-3xl text-left border border-indigo-100">
                                <p class="text-[9px] font-black text-indigo-400 uppercase mb-2">N5 實戰範本</p>
                                <p id="fc-example" class="japanese-text text-slate-700 text-base leading-relaxed"></p>
                            </div>
                        </div>
                    </div>

                    <div id="fc-empty-state" class="hidden py-16">
                        <div class="text-7xl mb-6">🏆</div>
                        <h3 class="text-2xl font-black text-slate-900 mb-2">N5 挑戰全量達成</h3>
                        <p class="text-slate-500 text-sm">恭喜！您已熟悉目前清單內的所有真實單字。</p>
                    </div>

                    <!-- Controls -->
                    <div id="fc-controls" class="w-full grid grid-cols-3 gap-4 mt-8">
                        <button onclick="processFC('again')" class="flex flex-col items-center py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-3xl transition-all active:scale-95">
                            <span class="text-2xl mb-1">🔄</span><span class="text-[10px] font-black">再來</span>
                        </button>
                        <button onclick="processFC('answer')" id="fc-btn-answer" class="flex flex-col items-center py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-3xl transition-all active:scale-95 shadow-lg shadow-indigo-100">
                            <span class="text-2xl mb-1">💡</span><span class="text-[10px] font-black">答案</span>
                        </button>
                        <button onclick="processFC('master')" class="flex flex-col items-center py-4 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-3xl transition-all active:scale-95">
                            <span class="text-2xl mb-1">✅</span><span class="text-[10px] font-black">掌握</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Reset Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[2rem] shadow-2xl max-w-sm w-full p-8 text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">🚫</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2">重置 N5 進度？</h3>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed">這將清除所有掌握狀態與雙向積分。動作無法復原。</p>
            <div class="flex flex-col gap-3">
                <button onclick="confirmReset()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition shadow-lg shadow-red-200">確定重置</button>
                <button onclick="closeModal()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition">取消返回</button>
            </div>
        </div>
    </div>

    <script>
        // --- N5 核心文法 (完整 25 項) ---
        const grammarData = [
            { id: 'g1', title: '～は～です', desc: '基本判斷句，表示身分或狀態。', ex: [{j: '<ruby>私<rt>わたし</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>です。', c: '我是學生。'}, {j: 'これは<ruby>本<rt>ほん</rt></ruby>です。', c: '這是書。'}]},
            { id: 'g2', title: '～を～ます', desc: '動作句，ます形表示禮貌。含三類動詞。', ex: [{t: 'G1', j: '<ruby>水<rt>みず</rt></ruby>を<ruby>飲<rt>の</rt></ruby>みます。', c: '喝水。'}, {t: 'G2', j: 'ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。', c: '吃飯。'}, {t: 'G3', j: '<ruby>勉強<rt>べんきょう</rt></ruby>をします。', c: '學習。'}]},
            { id: 'g3', title: '～があります/います', desc: '表示存在。', ex: [{j: '<ruby>机<rt>つくえ</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>があります。', c: '桌上有書。'}, {j: '<ruby>庭<rt>にわ</rt></ruby>に<ruby>猫<rt>ねこ</rt></ruby>がいます。', c: '院子裡有貓。'}]},
            { id: 'g4', title: '～へ行きます/来ます/帰ります', desc: '表示移動方向。', ex: [{j: '<ruby>日本<rt>にほん</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きます。', c: '去日本。'}, {j: '<ruby>家<rt>いえ</rt></ruby>へ<ruby>帰<rt>かえ</rt></ruby>ります。', c: '回家。'}]},
            { id: 'g5', title: '～で（場所/工具）', desc: '動作發生地或採用的手段。', ex: [{j: '<ruby>食堂<rt>しょくどう</rt></ruby>で<ruby>食<rt>た</rt></ruby>べます。', c: '在食堂吃飯。'}, {j: 'バスで<ruby>行<rt>い</rt></ruby>きます。', c: '搭巴士去。'}]},
            { id: 'g6', title: '～から～まで', desc: '時間或空間起訖。', ex: [{j: '<ruby>九時<rt>くじ</rt></ruby>から<ruby>五時<rt>ごじ</rt></ruby>まで<ruby>働<rt>はたら</rt></ruby>きます。', c: '從九點工作到五點。'}]},
            { id: 'g7', title: '～てください', desc: '表示請求。', ex: [{j: 'ちょっと<ruby>待<rt>ま</rt></ruby>ってください。', c: '請等一下。'}, {j: 'ここを<ruby>見<rt>み</rt></ruby>てください。', c: '請看這裡。'}]},
            { id: 'g8', title: '～ています', desc: '正在進行或持續狀態。', ex: [{j: 'テレビを<ruby>見<rt>み</rt></ruby>ています。', c: '正在看電視。'}, {j: '<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>っています。', c: '正在下雨。'}]},
            { id: 'g9', title: '～ましょう', desc: '表示提議。', ex: [{j: '<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>りましょう。', c: '一起回家吧。'}, {j: '<ruby>休<rt>やす</rt></ruby>みましょう。', c: '休息吧。'}]},
            { id: 'g10', title: '～たいです', desc: '表示願望。', ex: [{j: '<ruby>日本<rt>にほん</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きたいです。', c: '想去日本。'}, {j: 'お<ruby>茶<rt>ちゃ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>みたいです。', c: '想喝茶。'}]},
            { id: 'g11', title: '～ないでください', desc: '請求不要做某事。', ex: [{j: '<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>らないでください。', c: '請不要拍照。'}]},
            { id: 'g12', title: '～たことがあります', desc: '過去經驗。', ex: [{j: '<ruby>刺身<rt>さしみ</rt></ruby>を<ruby>食<rt>た</rt></ruby>べたことがあります。', c: '曾吃過生魚片。'}]},
            { id: 'g13', title: '～たり～たりします', desc: '列舉不分順序的動作。', ex: [{j: '<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んだり<ruby>散歩<rt>さんぽ</rt></ruby>したりします。', c: '又是看書又是散步。'}]},
            { id: 'g14', title: '形容詞用法', desc: 'い與な形容詞修飾或結尾。', ex: [{j: '<ruby>新<rt>あたら</rt></ruby>しい<ruby>本<rt>ほん</rt></ruby>です。', c: '是新書。'}, {j: '<ruby>静<rt>しず</rt></ruby>かな<ruby>部屋<rt>へや</rt></ruby>です。', c: '是安靜的房間。'}]},
            { id: 'g15', title: '比較句 (より/ほうが)', desc: '兩者比較。', ex: [{j: '<ruby>肉<rt>にく</rt></ruby>より<ruby>魚<rt>さかな</rt></ruby>のほうが<ruby>好<rt>す</rt></ruby>きです。', c: '比起肉更喜歡魚。'}]},
            { id: 'g16', title: '～てもいいです', desc: '表示許可。', ex: [{j: '<ruby>座<rt>すわ</rt></ruby>ってもいいですか。', c: '可以坐嗎？'}]},
            { id: 'g17', title: '～てはいけません', desc: '表示禁止。', ex: [{j: '<ruby>入<rt>はい</rt></ruby>ってはいけません。', c: '不可以進去。'}]},
            { id: 'g18', title: '～つもりです', desc: '意圖計畫。', ex: [{j: '<ruby>行<rt>い</rt></ruby>くつもりです。', c: '打算去。'}]},
            { id: 'g19', title: '～ことができます', desc: '能力。', ex: [{j: '<ruby>泳<rt>およ</rt></ruby>ぐことができます。', c: '會游泳。'}]},
            { id: 'g20', title: '～すぎます', desc: '程度過度。', ex: [{j: '<ruby>食<rt>た</rt></ruby>べすぎました。', c: '吃太多了。'}]},
            { id: 'g21', title: '～とき（時）', desc: '時間點或情境。', ex: [{j: '<ruby>暇<rt>ひま</rt></ruby>なとき<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みます。', c: '有空時看書。'}]},
            { id: 'g22', title: '～前に / ～後で', desc: '動作先後。', ex: [{j: '<ruby>寝<rt>ね</rt></ruby>る<ruby>前<rt>まえ</rt></ruby>に<ruby>磨<rt>みが</rt></ruby>きます。', c: '睡前刷牙。'}]},
            { id: 'g23', title: '～ので / ～から', desc: '原因理由。', ex: [{j: '<ruby>雨<rt>あめ</rt></ruby>なので<ruby>行<rt>い</rt></ruby>きません。', c: '因為雨而不去。'}]},
            { id: 'g24', title: '～と言います', desc: '引用或思考。', ex: [{j: '<ruby>彼<rt>かれ</rt></ruby>は「おはよう」と<ruby>言<rt>い</rt></ruby>いました。', c: '他說了早安。'}]},
            { id: 'g25', title: '～でしょう', desc: '推測。', ex: [{j: '<ruby>明日<rt>あした</rt></ruby>は<ruby>晴<rt>は</rt></ruby>れでしょう。', c: '明天會放晴吧。'}]}
        ];

        // --- N5 全量無重複單字庫 (5元素結構：單字, 假名, 中文, 日文例句, 中文例句) ---
        const vocabData = [
            ["アイスクリーム", "", "冰淇淋", "アイスクリームを<ruby>食<rt>た</rt></ruby>べましょう。", "我們來吃冰淇淋吧。"],
            ["間", "あいだ", "之間,中間", "<ruby>銀行<rt>ぎんこう</rt></ruby>と<ruby>学校<rt>がっこう</rt></ruby>の<ruby>間<rt>あいだ</rt></ruby>にあります。", "在銀行和學校之間。"],
            ["会います", "あいます", "見面", "<ruby>駅<rt>えき</rt></ruby>で<ruby>友達<rt>ともだち</rt></ruby>に<ruby>会<rt>あ</rt></ruby>います。", "在車站跟朋友見面。"],
            ["青", "あお", "藍色", "<ruby>青<rt>あお</rt></ruby>が<ruby>好<rt>す</rt></ruby>きです。", "喜歡藍色。"],
            ["青い", "あおい", "藍的", "<ruby>青<rt>あお</rt></ruby>い<ruby>海<rt>うみ</rt></ruby>がきれいです。", "藍色的海很漂亮。"],
            ["赤", "あか", "紅色", "<ruby>赤<rt>あか</rt></ruby>が<ruby>好<rt>す</rt></ruby>きです。", "喜歡紅色。"],
            ["赤い", "あかい", "紅的", "<ruby>赤<rt>あか</rt></ruby>い<ruby>鞄<rt>かばん</rt></ruby>を<ruby>買<rt>か</rt></ruby>いました。", "買了紅色的包包。"],
            ["明るい", "あかるい", "開朗;明亮", "<ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>明<rt>あか</rt></ruby>るい<ruby>性格<rt>せいかく</rt></ruby>です。", "她性格很開朗。"],
            ["開けます", "あけます", "打開", "<ruby>窓<rt>まど</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けてください。", "請打開窗戶。"],
            ["あげます", "", "給予", "<ruby>母<rt>はは</rt></ruby>に<ruby>花<rt>はな</rt></ruby>をあげました。", "送花給媽媽了。"],
            ["朝", "あさ", "早上", "<ruby>朝<rt>あさ</rt></ruby>、<ruby>六時<rt>ろくじ</rt></ruby>に<ruby>起<rt>お</rt></ruby>きます。", "早上六點起床。"],
            ["あさって", "", "後天", "あさって、<ruby>日本<rt>にほん</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きます。", "後天要去日本。"],
            ["足", "あし", "腳,腿", "<ruby>足<rt>あし</rt></ruby>が<ruby>痛<rt>いた</rt></ruby>いです。", "腳很痛。"],
            ["明日", "あした", "明天", "<ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>でしょう。", "明天大概會下雨吧。"],
            ["あそこ", "", "那裡", "あそこに<ruby>猫<rt>ねこ</rt></ruby>がいます。", "那裡有一隻貓。"],
            ["遊びます", "あそびます", "玩", "<ruby>公園<rt>こうえん</rt></ruby>で<ruby>遊<rt>あそ</rt></ruby>びましょう。", "去公園玩吧。"],
            ["温かい", "あたたかい", "溫暖,暖和", "<ruby>今日<rt>きょう</rt></ruby>は<ruby>温<rt>あたた</rt></ruby>かいですね。", "今天很溫暖呢。"],
            ["新しい", "あたらしい", "新的", "<ruby>新<rt>あたら</rt></ruby>しい<ruby>靴<rt>くつ</rt></ruby>を<ruby>買<rt>か</rt></ruby>いました。", "買了新鞋。"],
            ["あちら", "", "那邊", "あちらが<ruby>入口<rt>いりぐち</rt></ruby>です。", "那邊是入口。"],
            ["暑い", "あつい", "熱", "<ruby>今日<rt>きょう</rt></ruby>はとても<ruby>暑<rt>あつ</rt></ruby>いですね。", "今天非常熱呢。"],
            ["あっち", "", "那邊(口語)", "あっちに<ruby>行<rt>い</rt></ruby>きましょう。", "去那邊吧。"],

        function init() {
            renderGrammar();
            renderVocab();
            updateProgress();

                hideMode = !hideMode;
                document.body.classList.toggle('hide-mastered', hideMode);

            document.getElementById('reset-progress').addEventListener('click', () => {

            });

            document.getElementById('search-box').addEventListener('input', (e) => {
                renderVocab(e.target.value);
            });

        function formatRuby(word, kana) {
            if (!kana || word === kana) return word;
            return `<ruby>${word}<rt>${kana}</rt></ruby>`;
        }

        function renderGrammar() {
            const container = document.getElementById('section-grammar');
            container.innerHTML = grammarData.map((g, idx) => `
                <div class="grammar-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200 ${masteredIds.includes(g.id) ? 'is-mastered mastered' : ''}" data-id="${g.id}">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <span class="bg-indigo-600 text-white text-[9px] px-2 py-1 rounded font-black tracking-widest">G${idx+1}</span>
                            <h3 class="text-xl font-bold text-slate-900 japanese-text">${g.title}</h3>
                        </div>
                        <input type="checkbox" class="custom-checkbox" ${masteredIds.includes(g.id) ? 'checked' : ''} onchange="toggleMastered('${g.id}')">
                    </div>
                    <p class="text-sm text-slate-600 mb-4 font-medium">${g.desc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl space-y-3">
                        ${g.ex.map(e => `
                            <div class="border-l-2 border-indigo-200 pl-3">
                                <p class="japanese-text text-slate-800 text-base leading-relaxed">${e.j}</p>
                                <p class="text-xs text-slate-500 mt-0.5">${e.c}</p>
                            </div>

                    </div>
                </div>
            `).join('');
        }

            );

                const scores = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };

                        <td class="p-4">
                            <div class="japanese-text font-bold text-base text-slate-900">${v[0]}</div>
                            <div class="text-[10px] text-slate-400 japanese-text">${v[1]}</div>
                        </td>
                        <td class="p-4">
                            <span class="font-bold text-indigo-700">${v[2]}</span>
                        </td>
                        <td class="p-4">
                            <p class="japanese-text text-slate-700 italic text-sm leading-relaxed mb-1">${v[3]}</p>
                            <p class="text-xs text-slate-500">${v[4]}</p>
                        </td>
                        <td class="p-4">
                            <div class="flex gap-4 items-center justify-center">
                                <div class="flex flex-col text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black">日</span>
                                    <div class="w-10 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5">
                                        <div class="h-full bg-indigo-500" style="width: ${scores.jpToZh * 10}%"></div>
                                    </div>
                                </div>
                                <div class="flex flex-col text-center">
                                    <span class="text-[8px] text-slate-400 uppercase font-black">中</span>
                                    <div class="w-10 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5">
                                        <div class="h-full bg-blue-400" style="width: ${scores.zhToJp * 10}%"></div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // --- Flashcard Logic ---
        function loadNextFC() {
            let pool = [];
            vocabData.forEach((v, i) => {
                const id = `n5fv${i}`;
                const score = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                if (!masteredIds.includes(id)) {
                    if (score.jpToZh < 10) pool.push({ v, id, mode: 'jpToZh' });
                    if (score.zhToJp < 10) pool.push({ v, id, mode: 'zhToJp' });
                }
            });

            if (pool.length === 0) {
                document.getElementById('fc-main-display').classList.add('hidden');
                document.getElementById('fc-controls').classList.add('hidden');
                document.getElementById('fc-header').classList.add('hidden');
                document.getElementById('fc-empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('fc-main-display').classList.remove('hidden');
            document.getElementById('fc-controls').classList.remove('hidden');
            document.getElementById('fc-header').classList.remove('hidden');
            document.getElementById('fc-empty-state').classList.add('hidden');
            document.getElementById('fc-answer-block').classList.remove('active');

            const pick = pool[Math.floor(Math.random() * pool.length)];
            currentFC = pick;
            fcMode = pick.mode;

            const header = document.getElementById('fc-header');
            if (fcMode === 'jpToZh') {
                header.className = "absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-indigo-600 shadow-md transition-all";
                document.getElementById('fc-mode-text').innerText = '日譯中挑戰';
                document.getElementById('fc-question').innerHTML = formatRuby(pick.v[0], pick.v[1]);
                document.getElementById('fc-hint').innerText = "請回答中文解釋";
                document.getElementById('fc-target').innerText = pick.v[2];
                document.getElementById('fc-kana-display').innerText = "";
            } else {
                header.className = "absolute top-0 left-0 w-full py-3 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-blue-500 shadow-md transition-all";
                document.getElementById('fc-mode-text').innerText = '中譯日挑戰';
                document.getElementById('fc-question').innerText = pick.v[2];
                document.getElementById('fc-hint').innerText = "請回答日文漢字與讀音";
                document.getElementById('fc-target').innerText = pick.v[0];
                document.getElementById('fc-kana-display').innerText = pick.v[1] || "";
            }
            document.getElementById('fc-example').innerHTML = `${pick.v[3]}<br><span class="text-sm text-slate-500 mt-2 block">${pick.v[4]}</span>`;
            updateScoreUI();
        }

        function updateScoreUI() {
            const scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            const currentVal = scores[fcMode];
            document.getElementById('fc-current-score-text').innerText = currentVal;
            const dots = document.getElementById('fc-score-dots');
            dots.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.className = `w-1.5 h-1.5 rounded-full ${i < currentVal ? 'bg-white' : 'bg-white/30'}`;
                dots.appendChild(dot);
            }
        }

        function processFC(action) {
            if (!currentFC) return;
            if (action === 'answer') { document.getElementById('fc-answer-block').classList.add('active'); return; }

            let scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            if (action === 'master') scores[fcMode] = Math.min(10, scores[fcMode] + 5);
            else if (action === 'again') scores[fcMode] = Math.floor(scores[fcMode] / 2);
            
            vocabScores[currentFC.id] = scores;
            if (scores.jpToZh >= 10 && scores.zhToJp >= 10) {
                if (!masteredIds.includes(currentFC.id)) masteredIds.push(currentFC.id);
            }
            saveAndRefresh();
            loadNextFC();
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) {
                masteredIds.splice(index, 1);
            } else {
                masteredIds.push(id);
                vocabScores[id] = { jpToZh: 10, zhToJp: 10 };
            }
            saveAndRefresh(id);
        }

        function saveAndRefresh(id) {
            localStorage.setItem('n5_dual_mastery_final_v3', JSON.stringify(masteredIds));
            localStorage.setItem('n5_dual_scores_final_v3', JSON.stringify(vocabScores));
            
            if (id) {
                // 動態即時更新對應的 DOM 元素狀態 (包含文法與單字)
                const elements = document.querySelectorAll(`[data-id="${id}"]`);
                elements.forEach(el => {
                    const isM = masteredIds.includes(id);
                    el.classList.toggle('is-mastered', isM);
                    el.classList.toggle('mastered', isM);
                    const cb = el.querySelector('input[type="checkbox"]');
                    if (cb) cb.checked = isM;
                });
            } else {
                // 完全重置時的整體重新渲染
                renderGrammar();
                renderVocab(document.getElementById('search-box').value);
            }
            
            updateProgress();
        }

        function updateProgress() {
            const total = grammarData.length + vocabData.length;
            const current = masteredIds.length;
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`section-${type}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active'); btn.classList.add('text-slate-400'); });
            document.getElementById(`tab-btn-${type}`).classList.add('tab-active');
            if (type === 'flashcard') loadNextFC();
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmReset() { masteredIds = []; vocabScores = {}; saveAndRefresh(); closeModal(); if (!document.getElementById('section-flashcard').classList.contains('hidden')) loadNextFC(); }

        window.onload = init;
    </script>
</body>
</html>
