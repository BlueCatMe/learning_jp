<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY! N5 日本語達陣 - 雙向振假名積分系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; }
        ruby rt { font-size: 0.45em; color: #6366f1; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #f8fafc !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.2rem; height: 1.2rem; cursor: pointer; accent-color: #4f46e5; }
        .tab-active { color: #4f46e5; border-bottom: 3px solid #4f46e5; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        .reveal-info { display: none; }
        .reveal-info.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- Header -->
    <header class="bg-indigo-700 text-white py-8 px-4 text-center">
        <h1 class="text-3xl font-black mb-1 tracking-tight">TRY! N5 日本語達陣</h1>
        <p class="text-indigo-100 opacity-90 text-sm font-medium">雙向積分學習卡 × 振假名標註系統</p>
    </header>

    <!-- Sticky Control Bar -->
    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="flex flex-col">
                    <span class="text-[9px] text-slate-400 font-black uppercase tracking-widest">總掌握進度</span>
                    <div class="flex items-center gap-2">
                        <div class="w-32 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-indigo-500 transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <span id="progress-text" class="text-xs font-bold text-indigo-700">0%</span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2">
                    <span id="toggle-icon">👁️</span> <span id="toggle-label">隱藏已掌握</span>
                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Tabs -->
        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap">
            <button onclick="switchTab('grammar')" id="tab-btn-grammar" class="tab-btn px-6 py-4 font-bold text-lg tab-active transition">核心文法 (25)</button>
            <button onclick="switchTab('vocab')" id="tab-btn-vocab" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-indigo-600 transition">全單字庫</button>
            <button onclick="switchTab('flashcard')" id="tab-btn-flashcard" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-indigo-600 transition">智能學習卡</button>
        </div>

        <!-- Grammar Section -->
        <div id="section-grammar" class="tab-content grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- JS Rendered -->
        </div>

        <!-- Vocab Section -->
        <div id="section-vocab" class="tab-content hidden">
            <div class="mb-6 relative">
                <input type="text" id="search-box" placeholder="搜尋漢字、假名或中文意義..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition shadow-sm">
                <span class="absolute left-4 top-3.5 text-slate-400">🔍</span>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="p-4 w-16 text-center">掌握</th>
                                <th class="p-4 w-1/4">單字 / 假名</th>
                                <th class="p-4 w-1/5 text-indigo-700">中文意義</th>
                                <th class="p-4">學習進度 (日譯中 / 中譯日)</th>
                            </tr>
                        </thead>
                        <tbody id="vocab-body" class="divide-y divide-slate-100 text-sm">
                            <!-- JS Rendered -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Flashcard Section -->
        <div id="section-flashcard" class="tab-content hidden">
            <div class="max-w-lg mx-auto">
                <div id="fc-container" class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 p-8 min-h-[500px] flex flex-col items-center justify-between text-center relative overflow-hidden transition-all">
                    
                    <!-- Mode Header -->
                    <div id="fc-mode-display" class="absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white">
                        <span id="fc-mode-text">模式載入中</span>
                        <div class="flex gap-1" id="fc-score-dots"></div>
                    </div>

                    <div id="fc-main-display" class="w-full flex-grow flex flex-col items-center justify-center pt-8">
                        <!-- Ruby Question -->
                        <div id="fc-question" class="japanese-text text-5xl font-black text-slate-900 mb-2 leading-[1.5em] h-[2.5em] flex items-center justify-center">載入中...</div>
                        <div id="fc-hint" class="text-slate-400 text-xs font-bold uppercase tracking-tighter h-4 mb-10"></div>
                        
                        <!-- Answer Block -->
                        <div id="fc-answer-block" class="reveal-info w-full animate-fade-in border-t border-slate-100 pt-6">
                            <div id="fc-target" class="text-3xl font-bold text-indigo-600 mb-2 japanese-text"></div>
                            <div id="fc-kana-display" class="text-slate-500 text-sm mb-6 japanese-text"></div>
                            <div class="bg-slate-50 p-5 rounded-3xl text-left border border-slate-200/50">
                                <p class="text-[9px] font-black text-slate-400 uppercase mb-2">學習範例</p>
                                <p id="fc-example" class="japanese-text text-slate-700 text-base leading-relaxed"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Empty State -->
                    <div id="fc-empty-state" class="hidden py-16">
                        <div class="text-7xl mb-6">🏁</div>
                        <h3 class="text-2xl font-black text-slate-900 mb-2">學習達成！</h3>
                        <p class="text-slate-500 text-sm">目前沒有需要加強的雙向單字了。</p>
                        <button onclick="switchTab('vocab')" class="mt-10 px-6 py-2 bg-indigo-50 text-indigo-600 rounded-full font-bold hover:bg-indigo-100 transition text-xs">查看全部單字</button>
                    </div>

                    <!-- Flashcard Controls -->
                    <div id="fc-controls" class="w-full grid grid-cols-3 gap-4 mt-8">
                        <button onclick="processFC('again')" class="flex flex-col items-center py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-3xl transition-all active:scale-95">
                            <span class="text-2xl mb-1">🔄</span>
                            <span class="text-[10px] font-black">再來</span>
                        </button>
                        <button onclick="processFC('answer')" id="fc-btn-answer" class="flex flex-col items-center py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-3xl transition-all active:scale-95 shadow-lg shadow-indigo-100">
                            <span class="text-2xl mb-1">💡</span>
                            <span class="text-[10px] font-black">答案</span>
                        </button>
                        <button onclick="processFC('master')" class="flex flex-col items-center py-4 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-3xl transition-all active:scale-95">
                            <span class="text-2xl mb-1">✅</span>
                            <span class="text-[10px] font-black">掌握</span>
                        </button>
                    </div>
                </div>
                <div id="fc-footer-info" class="text-center mt-6">
                    <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">當前項目累積積分: <span id="fc-current-score-text">0</span> / 10</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Reset Confirmation Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[2rem] shadow-2xl max-w-sm w-full p-8 text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">🚫</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2">確定重置嗎？</h3>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed">這將清除所有文法掌握記錄、單字雙向積分與標記。動作無法取消。</p>
            <div class="flex flex-col gap-3">
                <button onclick="confirmReset()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition shadow-lg shadow-red-200">確定全部重置</button>
                <button onclick="closeModal()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition">取消</button>
            </div>
        </div>
    </div>

    <script>
        // --- N5 核心文法 (25項) ---
        const grammarData = [
            { id: 'g1', title: '～は～です', desc: '基本判斷句，表示身分或狀態。', ex: [{j:'私は学生です。', c:'我是學生。'}, {j:'これは本です。', c:'這是書。'}]},
            { id: 'g2', title: '～を～ます', desc: '動作句，ます形表示禮貌。含三類動詞。', ex: [{t:'G1', j:'水を飲みます。', c:'喝水。'}, {t:'G2', j:'ご飯を食べます。', c:'吃飯。'}, {t:'G3', j:'勉強をします。', c:'學習。'}]},

            { id: 'g4', title: '～へ行きます/来ます/帰ります', desc: '表示移動方向。', ex: [{j:'日本へ行きます。', c:'去日本。'}, {j:'家へ帰ります。', c:'回家。'}]},

            { id: 'g8', title: '～ています', desc: '正在進行或持續狀態。', ex: [{j:'テレビを見ています。', c:'正在看電視。'}, {j:'雨が降っています。', c:'正在下雨。'}]},
            { id: 'g9', title: '～ましょう', desc: '表示提議。', ex: [{j:'一緒に帰りましょう。', c:'一起回家吧。'}, {j:'休みましょう。', c:'休息吧。'}]},

        // --- 核心邏輯 ---
        let masteredIds = JSON.parse(localStorage.getItem('n5_dual_mastered_v2') || '[]');
        let vocabScores = JSON.parse(localStorage.getItem('n5_dual_scores_v2') || '{}');

        function init() {
            renderGrammar();
            renderVocab();
            updateProgress();
            
            document.getElementById('toggle-hide').addEventListener('click', () => {
                hideMode = !hideMode;
                document.body.classList.toggle('hide-mastered', hideMode);

            document.getElementById('search-box').addEventListener('input', (e) => {
                renderVocab(e.target.value);
            });

        // 格式化振假名 (Ruby Tag)
        function formatRuby(word, kana) {
            if (!kana || word === kana) return word;
            return `<ruby>${word}<rt>${kana}</rt></ruby>`;
        }

        function renderGrammar() {
            const container = document.getElementById('section-grammar');
            container.innerHTML = grammarData.map(g => `
                <div class="grammar-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200 ${masteredIds.includes(g.id) ? 'is-mastered mastered' : ''}" data-id="${g.id}">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <span class="bg-indigo-600 text-white text-[9px] px-2 py-1 rounded font-black tracking-widest">N5句型</span>
                            <h3 class="text-xl font-bold text-slate-900 japanese-text">${g.title}</h3>
                        </div>
                        <input type="checkbox" class="custom-checkbox" ${masteredIds.includes(g.id) ? 'checked' : ''} onchange="toggleMastered('${g.id}')">
                    </div>
                    <p class="text-sm text-slate-600 mb-4 font-medium">${g.desc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl space-y-3">
                        ${g.ex.map(e => `
                            <div class="border-l-2 border-indigo-200 pl-3">
                                <p class="japanese-text text-slate-800 text-base leading-relaxed">${e.j}</p>
                                <p class="text-xs text-slate-500 mt-0.5">${e.c}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderVocab(filter = "") {
            const container = document.getElementById('vocab-body');
            const filteredData = rawVocab.filter(v => 
                v[0].toLowerCase().includes(filter.toLowerCase()) || 
                v[1].toLowerCase().includes(filter.toLowerCase()) || 
                v[2].toLowerCase().includes(filter.toLowerCase())
            );
            
            container.innerHTML = filteredData.map((v, i) => {
                const id = `v${i}`;
                const score = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                const isMastered = masteredIds.includes(id);
                return `
                    <tr class="vocab-row transition-all hover:bg-slate-50 ${isMastered ? 'is-mastered mastered' : ''}" data-id="${id}">
                        <td class="p-4 text-center">
                            <input type="checkbox" class="custom-checkbox" ${isMastered ? 'checked' : ''} onchange="toggleMastered('${id}')">
                        </td>
                        <td class="p-4">
                            <div class="japanese-text font-bold text-base text-slate-900">${v[0]}</div>
                            <div class="text-[10px] text-slate-400 japanese-text">${v[1]}</div>
                        </td>
                        <td class="p-4">

                                    </div>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-[8px] text-slate-400 uppercase font-black">中譯日</span>
                                    <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden mt-0.5">

                                    </div>
                                </div>
                            </div>

        // --- 單字卡邏輯 ---
        function getFCPool() {
            let pool = [];
            rawVocab.forEach((v, i) => {
                const id = `v${i}`;
                const score = vocabScores[id] || { jpToZh: 0, zhToJp: 0 };
                if (!masteredIds.includes(id)) {
                    if (score.jpToZh < 10) pool.push({ v, id, mode: 'jpToZh' });
                    if (score.zhToJp < 10) pool.push({ v, id, mode: 'zhToJp' });
                }
            });
            return pool;
        }

        function loadNextFC() {
            const pool = getFCPool();
            if (pool.length === 0) {
                document.getElementById('fc-main-display').classList.add('hidden');
                document.getElementById('fc-controls').classList.add('hidden');
                document.getElementById('fc-mode-display').classList.add('hidden');
                document.getElementById('fc-empty-state').classList.remove('hidden');
                document.getElementById('fc-footer-info').classList.add('hidden');
                return;
            }

            document.getElementById('fc-main-display').classList.remove('hidden');
            document.getElementById('fc-controls').classList.remove('hidden');
            document.getElementById('fc-mode-display').classList.remove('hidden');
            document.getElementById('fc-empty-state').classList.add('hidden');
            document.getElementById('fc-footer-info').classList.remove('hidden');
            document.getElementById('fc-answer-block').classList.remove('active');

            const pick = pool[Math.floor(Math.random() * pool.length)];
            currentFC = pick;
            fcMode = pick.mode;

            const modeBadge = document.getElementById('fc-mode-display');
            const qEl = document.getElementById('fc-question');
            const hintEl = document.getElementById('fc-hint');
            const targetEl = document.getElementById('fc-target');
            const kanaEl = document.getElementById('fc-kana-display');

            if (fcMode === 'jpToZh') {
                modeBadge.className = "absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-blue-600 shadow-md transition-all";
                document.getElementById('fc-mode-text').innerText = '日譯中挑戰';
                // 日譯中顯示漢字加振假名
                qEl.innerHTML = formatRuby(pick.v[0], pick.v[1]);
                hintEl.innerText = "請回答中文解釋";
                targetEl.innerText = pick.v[2];
                kanaEl.innerText = ""; // 已在上面顯示
            } else {
                modeBadge.className = "absolute top-0 left-0 w-full py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-white bg-amber-500 shadow-md transition-all";
                document.getElementById('fc-mode-text').innerText = '中譯日挑戰';
                qEl.innerHTML = pick.v[2]; // 顯示中文
                hintEl.innerText = "請回答日文單字與讀音";
                targetEl.innerText = pick.v[0];
                kanaEl.innerText = pick.v[1] || "";
            }

            document.getElementById('fc-example').innerText = pick.v[3];
            updateScoreUI();
        }

        function updateScoreUI() {
            const scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            const currentVal = scores[fcMode];
            document.getElementById('fc-current-score-text').innerText = currentVal;
            
            const dots = document.getElementById('fc-score-dots');
            dots.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.className = `w-1.5 h-1.5 rounded-full ${i < currentVal ? 'bg-white' : 'bg-white/30'}`;
                dots.appendChild(dot);
            }
        }

        function processFC(action) {
            if (!currentFC) return;
            if (action === 'answer') {
                document.getElementById('fc-answer-block').classList.add('active');
                return;
            }

            let scores = vocabScores[currentFC.id] || { jpToZh: 0, zhToJp: 0 };
            let val = scores[fcMode];

            if (action === 'master') {
                val = Math.min(10, val + 5);
            } else if (action === 'again') {
                val = Math.floor(val / 2);
            }

            scores[fcMode] = val;
            vocabScores[currentFC.id] = scores;

            // 檢查是否達成雙向掌握
            if (scores.jpToZh >= 10 && scores.zhToJp >= 10) {
                if (!masteredIds.includes(currentFC.id)) masteredIds.push(currentFC.id);
            }

            saveAndSync();
            loadNextFC();
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) {
                masteredIds.splice(index, 1);
            } else {
                masteredIds.push(id);
                vocabScores[id] = { jpToZh: 10, zhToJp: 10 };
            }
            saveAndSync(id);
        }

        function saveAndSync(id) {
            localStorage.setItem('n5_dual_mastered_v2', JSON.stringify(masteredIds));
            localStorage.setItem('n5_dual_scores_v2', JSON.stringify(vocabScores));
            
            if (id) {
                const el = document.querySelector(`.vocab-row[data-id="${id}"]`);
                if (el) {
                    const isM = masteredIds.includes(id);
                    el.classList.toggle('is-mastered', isM);
                    el.classList.toggle('mastered', isM);
                    const cb = el.querySelector('input[type="checkbox"]');
                    if (cb) cb.checked = isM;
                }
                renderVocab(document.getElementById('search-box').value);
            } else {
                renderGrammar();
                renderVocab(document.getElementById('search-box').value);
            }
            updateProgress();
        }

        function updateProgress() {
            const total = grammarData.length + rawVocab.length;
            const current = masteredIds.length;
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`section-${type}`).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('text-slate-400');
            });
            
            const activeBtn = document.getElementById(`tab-btn-${type}`);
            activeBtn.classList.add('tab-active');
            activeBtn.classList.remove('text-slate-400');

            if (type === 'flashcard') loadNextFC();
        }

        function closeModal() {
            document.getElementById('confirm-modal').style.display = 'none';
        }

        function confirmReset() {
            masteredIds = [];
            vocabScores = {};
            saveAndSync();
            closeModal();
            if (!document.getElementById('section-flashcard').classList.contains('hidden')) {
                loadNextFC();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
