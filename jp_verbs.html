<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow! 日本語達陣 - 動詞變化全攻略</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; white-space: nowrap; }
        ruby rt { font-size: 0.5em; color: #b45309; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #f8fafc !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #d97706; }
        .tab-active { color: #d97706; border-bottom: 3px solid #d97706; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .verb-table-container {
            max-width: 100%;
            max-height: 75vh;
            overflow: auto;
            scrollbar-width: thin;
            position: relative;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
        }
        .verb-table-container::-webkit-scrollbar { height: 10px; width: 10px; }
        .verb-table-container::-webkit-scrollbar-thumb { background: #d97706; border-radius: 5px; }
        .verb-table-container::-webkit-scrollbar-track { background: #f8fafc; }

        /* Sticky Header Logic */
        .sticky-thead th {
            position: sticky;
            top: 0;
            z-index: 30;
            background-clip: padding-box;
            border-bottom: 1px solid #cbd5e1;
            border-right: 1px solid #cbd5e1;
            padding-top: 0.75rem; /* py-3 */
            padding-bottom: 0.75rem;
        }
        /* Second row of headers - Precise Offset */
        /* py-3 (12+12) + text-10px (approx 15px) = 39px */
        .sticky-thead tr:nth-child(2) th {
            top: 39px;
            z-index: 30;
        }

        /* Sticky Columns Logic */
        .sticky-col-1 {
            position: sticky;
            left: 0;
            z-index: 25;
            width: 64px;
            min-width: 64px;
            max-width: 64px;
            background-color: #f1f5f9 !important;
            background-clip: padding-box;
            border-right: 2px solid #cbd5e1 !important;
        }
        .sticky-col-2 {
            position: sticky;
            left: 64px;
            z-index: 25;
            width: 180px;
            min-width: 180px;
            max-width: 180px;
            background-color: #ffffff !important;
            background-clip: padding-box;
            border-right: 2px solid #cbd5e1 !important;
        }

        /* Corner Fix */
        thead th.sticky-col-1 { z-index: 50; top: 0; }
        thead th.sticky-col-2 { z-index: 50; top: 0; }
        .sticky-thead tr:nth-child(2) th.sticky-col-2 { top: 39px; }

        /* Table Layout Fixes */
        table { border-collapse: separate; border-spacing: 0; width: max-content; }
        td, th {
            box-sizing: border-box;
            white-space: nowrap;
            min-width: 110px; /* Base width for all conjugation columns */
        }
        td:last-child, th:last-child { min-width: 200px; } /* Meaning column */

        /* Highlight sticky column on hover */
        tr:hover td.sticky-col-1 { background-color: #fff7ed !important; }
        tr:hover td.sticky-col-2 { background-color: #fff7ed !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <header class="bg-amber-600 text-white py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl font-black mb-1 tracking-tight">Meow! 動詞變化全攻略</h1>
        <p class="text-amber-100 opacity-90 text-sm font-medium">系統化掌握 12 種動詞變化：從基本到使役受身</p>
    </header>

    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 border border-slate-200 shadow-sm">🏠 首頁</a>

                <div id="sync-wrapper" class="flex items-center gap-2">
                    <button id="sync-progress" disabled class="bg-amber-50 hover:bg-amber-100 text-amber-600 border border-amber-200 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm">
                        <span>☁️</span> <span id="sync-label">啟用雲端同步</span>
                    </button>
                    <button id="logout-btn" class="hidden text-slate-400 hover:text-red-500 text-[10px] font-bold transition uppercase tracking-tighter">登出</button>
                </div>

                <div class="flex flex-col">
                    <span class="text-[9px] text-slate-400 font-black uppercase tracking-widest">動詞掌握進度</span>
                    <div class="flex items-center gap-2">
                        <div class="w-40 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-amber-500 transition-all duration-500"></div>
                        </div>
                        <span id="progress-text" class="text-xs font-bold text-amber-700">0%</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm">
                    <span id="toggle-icon">👁️</span> <span id="toggle-label">隱藏已掌握</span>
                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-7xl">
        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap">
            <button onclick="switchTab('g1')" id="tab-btn-g1" class="tab-btn px-6 py-4 font-bold text-lg tab-active transition">第一類動詞 (五段)</button>
            <button onclick="switchTab('g2')" id="tab-btn-g2" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-amber-600 transition">第二類動詞 (一段)</button>
            <button onclick="switchTab('g3')" id="tab-btn-g3" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-amber-600 transition">第三類動詞 (不規則)</button>
            <button onclick="switchTab('fc')" id="tab-btn-fc" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-amber-600 transition">智能練習卡</button>
        </div>

        <div id="verb-content" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="verb-table-container">
                <table class="w-full text-left min-w-[1800px]">
                    <thead class="sticky-thead bg-slate-50 text-center text-[10px] uppercase tracking-wider">
                        <tr>
                            <th rowspan="2" class="py-3 px-4 text-center bg-slate-100 sticky-col-1">掌握</th>
                            <th colspan="3" class="py-3 px-2 bg-amber-100 text-amber-800">基本形式 (Basics)</th>
                            <th colspan="2" class="py-3 px-2 bg-indigo-100 text-indigo-800">中繼與過去 (Te/Ta)</th>
                            <th colspan="3" class="py-3 px-2 bg-emerald-100 text-emerald-800">語氣與假定 (Moods)</th>
                            <th colspan="4" class="py-3 px-2 bg-violet-100 text-violet-800">動詞衍生 (Derived)</th>
                            <th rowspan="2" class="py-3 px-4 min-w-[200px] text-center bg-slate-100">中文意義 / 級別</th>
                        </tr>
                        <tr>
                            <th class="py-3 px-2 bg-amber-50 text-amber-700 sticky-col-2">詞書形</th>
                            <th class="py-3 px-2 bg-amber-50 text-amber-700">ます形</th>
                            <th class="py-3 px-2 bg-amber-50 text-amber-700">ない形</th>
                            <th class="py-3 px-2 bg-indigo-50 text-indigo-700">て形</th>
                            <th class="py-3 px-2 bg-indigo-50 text-indigo-700">た形</th>
                            <th class="py-3 px-2 bg-emerald-50 text-emerald-700">命令形</th>
                            <th class="py-3 px-2 bg-emerald-50 text-emerald-700">意志形</th>
                            <th class="py-3 px-2 bg-emerald-50 text-emerald-700">假定形</th>
                            <th class="py-3 px-2 bg-violet-50 text-violet-700">可能形</th>
                            <th class="py-3 px-2 bg-violet-50 text-violet-700">受身形</th>
                            <th class="py-3 px-2 bg-violet-50 text-violet-700">使役形</th>
                            <th class="py-3 px-2 bg-violet-50 text-violet-700">使役受身</th>
                        </tr>
                    </thead>
                    <tbody id="verb-body" class="divide-y divide-slate-100 text-sm"></tbody>
                </table>
            </div>
        </div>

        <div id="section-flashcard" class="hidden animate-fade-in">
            <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
                <div class="bg-amber-500 p-8 text-center text-white">
                    <div id="fc-question" class="text-4xl font-black mb-2 japanese-text"></div>
                    <div class="text-amber-100 text-sm font-medium">請選擇正確的動詞分類</div>
                </div>
                <div class="p-6">
                    <div id="fc-options" class="grid grid-cols-2 gap-3 mb-6">
                        <button onclick="submitVerbFC('g1')" class="py-4 bg-slate-50 hover:bg-amber-50 border border-slate-200 hover:border-amber-200 rounded-2xl font-bold transition text-slate-700 hover:text-amber-700">第一類 (五段)</button>
                        <button onclick="submitVerbFC('g2')" class="py-4 bg-slate-50 hover:bg-amber-50 border border-slate-200 hover:border-amber-200 rounded-2xl font-bold transition text-slate-700 hover:text-amber-700">第二類 (一段)</button>
                        <button onclick="submitVerbFC('g3')" class="py-4 bg-slate-50 hover:bg-amber-50 border border-slate-200 hover:border-amber-200 rounded-2xl font-bold transition text-slate-700 hover:text-amber-700">第三類 (不規則)</button>
                        <button onclick="submitVerbFC('unknown')" class="py-4 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-2xl font-bold transition text-slate-400">不知道</button>
                    </div>

                    <div id="fc-feedback" class="hidden mb-6 animate-fade-in">
                        <div id="fc-result-msg" class="text-center font-bold text-lg mb-4"></div>
                        <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                            <p class="text-xs text-slate-400 uppercase font-black tracking-widest mb-1">正確分類</p>
                            <p id="fc-correct-group" class="font-bold text-slate-700 mb-3"></p>
                            <p class="text-xs text-slate-400 uppercase font-black tracking-widest mb-1">中文意義</p>
                            <p id="fc-meaning" class="font-bold text-slate-700"></p>
                        </div>
                    </div>

                    <button id="fc-next" onclick="loadNextVerbFC()" class="hidden w-full py-4 bg-slate-900 text-white rounded-2xl font-black hover:bg-slate-800 transition shadow-lg animate-fade-in">下一個練習</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Reset Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[2rem] shadow-2xl max-w-sm w-full p-8 text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">🚫</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2">重置動詞進度？</h3>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed">這將清除所有掌握狀態。動作無法復原。</p>
            <div class="flex flex-col gap-3">
                <button onclick="confirmReset()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black hover:bg-red-700 transition shadow-lg shadow-red-200">確定重置</button>
                <button onclick="closeModal()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition">取消返回</button>
            </div>
        </div>
    </div>

    <script src="assets/data/verbs.js"></script>
    <script src="assets/js/verbs-logic.js"></script>
    <script>
        const app = new VerbApp(verbsData);
        window.init = () => app.init();
        window.onload = window.init;
    </script>
    <footer class="bg-slate-100 border-t border-slate-200 py-12 mt-20">
        <div class="container mx-auto px-4 max-w-4xl text-center">
            <div class="mb-6">
                <a href="https://github.com/BlueCatMe/learning_jp" target="_blank" class="inline-flex items-center gap-2 text-slate-500 hover:text-amber-600 transition font-medium">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    <span>GitHub: BlueCatMe/learning_jp</span>
                </a>
            </div>
            <p class="text-slate-400 text-xs italic">© 2026 Meow! 日本語達陣學習計畫</p>
        </div>
    </footer>
    <script src="assets/js/sync-service.js"></script>
</body>
</html>
