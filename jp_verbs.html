<!DOCTYPE html>
<html lang="zh-Hant">
<head>

    <title>Meow! 日本語達陣 - 動詞變化全攻略</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .japanese-text { font-family: 'Noto Sans JP', sans-serif; white-space: nowrap; }
        ruby rt { font-size: 0.5em; color: #b45309; padding-bottom: 0.1em; }
        .mastered { opacity: 0.35; background-color: #f8fafc !important; }
        .hide-mastered .is-mastered { display: none !important; }
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #d97706; }
        .tab-active { color: #d97706; border-bottom: 3px solid #d97706; }
        .sticky-controls { position: sticky; top: 0; z-index: 50; }
        #confirm-modal { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .verb-table-container { max-width: 100%; overflow-x: auto; scrollbar-width: thin; }
        .verb-table-container::-webkit-scrollbar { height: 6px; }
        .verb-table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <header class="bg-amber-600 text-white py-8 px-4 text-center shadow-lg">

        <p class="text-amber-100 opacity-90 text-sm font-medium">系統化掌握 12 種動詞變化：從基本到使役受身</p>
    </header>

    <nav class="sticky-controls bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 border border-slate-200 shadow-sm">🏠 首頁</a>

                    </button>
                    <button id="logout-btn" class="hidden text-slate-400 hover:text-red-500 text-[10px] font-bold transition uppercase tracking-tighter">登出</button>
                </div>

                <div class="flex flex-col">
                    <span class="text-[9px] text-slate-400 font-black uppercase tracking-widest">動詞掌握進度</span>
                    <div class="flex items-center gap-2">
                        <div class="w-40 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-amber-500 transition-all duration-500"></div>
                        </div>
                        <span id="progress-text" class="text-xs font-bold text-amber-700">0%</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="toggle-hide" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm">

                </button>
                <button id="reset-progress" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm">
                    <span>🔄</span> <span>重置進度</span>
                </button>
            </div>
        </div>
    </nav>

        <div class="flex border-b border-slate-200 mb-8 overflow-x-auto whitespace-nowrap">

            <button onclick="switchTab('g2')" id="tab-btn-g2" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-amber-600 transition">第二類動詞 (一段)</button>
            <button onclick="switchTab('g3')" id="tab-btn-g3" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-amber-600 transition">第三類動詞 (不規則)</button>
            <button onclick="switchTab('fc')" id="tab-btn-fc" class="tab-btn px-6 py-4 font-bold text-lg text-slate-400 hover:text-amber-600 transition">智能練習卡</button>
        </div>

        <div id="verb-content" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="verb-table-container">
                <table class="w-full text-left border-collapse min-w-[1200px]">
                    <thead class="bg-slate-50 border-b-2 border-slate-200 text-center text-[10px] uppercase tracking-wider">

                            <th colspan="3" class="p-2 bg-amber-100 text-amber-800 border-b border-amber-200 border-r border-slate-200">基本形式 (Basics)</th>

                            <th class="p-2 bg-amber-50 text-amber-700 border-r border-slate-200">ない形</th>
                            <th class="p-2 bg-indigo-50 text-indigo-700 border-r border-slate-200">て形</th>
                            <th class="p-2 bg-indigo-50 text-indigo-700 border-r border-slate-200">た形</th>
                            <th class="p-2 bg-emerald-50 text-emerald-700 border-r border-slate-200">命令形</th>

            </div>
        </div>

        <div id="section-flashcard" class="hidden animate-fade-in">

                <div class="bg-amber-500 p-8 text-center text-white">

                    <div class="text-amber-100 text-sm font-medium">請選擇正確的動詞分類</div>
                </div>
                <div class="p-6">
                    <div id="fc-options" class="grid grid-cols-2 gap-3 mb-6">

            </div>
        </div>
    </main>

    </div>

        function updateHideUI() {
            document.body.classList.toggle('hide-mastered', hideMastered);
            document.getElementById('toggle-label').innerText = hideMastered ? '顯示已掌握' : '隱藏已掌握';
            document.getElementById('toggle-icon').innerText = hideMastered ? '👁️‍🗨️' : '👁️';
        }

        function getVerbParts(v) {
            let d = v.dictionary;
            let kanji, reading;
            let m = d.match(/^([^\s\(\)]+)\s*\(([^\s\(\)]+)\)$/);
            if (m) { kanji = m[1].trim(); reading = m[2].trim(); }
            else { kanji = reading = d.trim(); }

            if (v.group === 'g3') {
                if (reading.endsWith('する')) return { kStem: kanji.slice(0, -2), rStem: reading.slice(0, -2), suffix: 'する', kSuffix: 'する' };
                if (reading.endsWith('くる')) return { kStem: kanji.slice(0, -2), rStem: reading.slice(0, -2), suffix: 'くる', kSuffix: 'くる' };
            }
            return { kStem: kanji.slice(0, -1), rStem: reading.slice(0, -1), suffix: reading.slice(-1), kSuffix: kanji.slice(-1) };
        }

        function conjugate(v) {
            const { kStem, rStem, suffix, kSuffix } = getVerbParts(v);
            const wrap = (k, r) => `${k} (${r})`;
            const g1Base = {
                'う': ['わ', 'い', 'う', 'え', 'お'], 'く': ['か', 'き', 'く', 'け', 'こ'],
                'ぐ': ['が', 'ぎ', 'ぐ', 'げ', 'ご'], 'す': ['さ', 'し', 'す', 'せ', 'そ'],
                'つ': ['た', 'ち', 'つ', 'て', 'と'], 'ぬ': ['な', 'に', 'ぬ', 'ね', 'の'],
                'ぶ': ['ば', 'び', 'ぶ', 'べ', 'ぼ'], 'む': ['ま', 'み', 'む', 'め', 'も'],
                'る': ['ら', 'り', 'る', 'れ', 'ろ']
            };

            let f = {};
            if (v.group === 'g1') {
                let b = g1Base[suffix]; if (!b) return null;
                let kb = g1Base[kSuffix] || b;
                f.dictionary = wrap(kStem + kSuffix, rStem + suffix);
                f.masu = wrap(kStem + kb[1] + 'ます', rStem + b[1] + 'ます');
                f.nai = wrap(kStem + kb[0] + 'ない', rStem + b[0] + 'ない');
                let ts, rs, tas, ras;
                if (rStem + suffix === 'いく' || kStem + kSuffix === '行く') { ts = rs = 'って'; tas = ras = 'った'; }
                else if (['う', 'つ', 'る'].includes(suffix)) { ts = rs = 'って'; tas = ras = 'った'; }
                else if (['む', 'ぶ', 'ぬ'].includes(suffix)) { ts = rs = 'んで'; tas = ras = 'んだ'; }
                else if (suffix === 'く') { ts = rs = 'いて'; tas = ras = 'いた'; }
                else if (suffix === 'ぐ') { ts = rs = 'いで'; tas = ras = 'いだ'; }
                else if (suffix === 'す') { ts = rs = 'して'; tas = ras = 'した'; }
                f.te = wrap(kStem + ts, rStem + rs);
                f.ta = wrap(kStem + tas, rStem + ras);
                f.imperative = wrap(kStem + kb[3], rStem + b[3]);
                f.volitional = wrap(kStem + kb[4] + 'う', rStem + b[4] + 'う');
                f.conditional = wrap(kStem + kb[3] + 'ば', rStem + b[3] + 'ば');
                f.potential = wrap(kStem + kb[3] + 'る', rStem + b[3] + 'る');
                f.passive = wrap(kStem + kb[0] + 'れる', rStem + b[0] + 'れる');
                f.causative = wrap(kStem + kb[0] + 'せる', rStem + b[0] + 'せる');
                f.causativePassive = wrap(kStem + kb[0] + 'せられる', rStem + b[0] + 'せられる');
            } else if (v.group === 'g2') {
                f.dictionary = wrap(kStem + 'る', rStem + 'る'); f.masu = wrap(kStem + 'ます', rStem + 'ます');
                f.te = wrap(kStem + 'て', rStem + 'て'); f.ta = wrap(kStem + 'た', rStem + 'た');
                f.nai = wrap(kStem + 'ない', rStem + 'ない'); f.imperative = wrap(kStem + 'ろ', rStem + 'ろ');
                f.volitional = wrap(kStem + 'よう', rStem + 'よう'); f.conditional = wrap(kStem + 'れば', rStem + 'れば');
                f.potential = wrap(kStem + 'られる', rStem + 'られる'); f.passive = wrap(kStem + 'られる', rStem + 'られる');
                f.causative = wrap(kStem + 'させる', rStem + 'させる'); f.causativePassive = wrap(kStem + 'させられる', rStem + 'させられる');
            } else if (v.group === 'g3') {
                if (suffix === 'する') {
                    f.dictionary = wrap(kStem + 'する', rStem + 'する'); f.masu = wrap(kStem + 'します', rStem + 'します');
                    f.te = wrap(kStem + 'して', rStem + 'して'); f.ta = wrap(kStem + 'した', rStem + 'した');
                    f.nai = wrap(kStem + 'しない', rStem + 'しない'); f.imperative = wrap(kStem + 'しろ', rStem + 'しろ');
                    f.volitional = wrap(kStem + 'しよう', rStem + 'しよう'); f.conditional = wrap(kStem + 'すれば', rStem + 'すれば');
                    f.potential = wrap(kStem + 'できる', rStem + 'できる'); f.passive = wrap(kStem + 'される', rStem + 'される');
                    f.causative = wrap(kStem + 'させる', rStem + 'させる'); f.causativePassive = wrap(kStem + 'させられる', rStem + 'させられる');
                } else {
                    f.dictionary = wrap(kStem + '來る', rStem + 'くる'); f.masu = wrap(kStem + '來ます', rStem + 'きます');
                    f.te = wrap(kStem + '来て', rStem + 'きて'); f.ta = wrap(kStem + '来た', rStem + 'きた');
                    f.nai = wrap(kStem + '來ない', rStem + 'こない'); f.imperative = wrap(kStem + '來い', rStem + 'こい');
                    f.volitional = wrap(kStem + '來よう', rStem + 'こよう'); f.conditional = wrap(kStem + '來れば', rStem + 'くれば');
                    f.potential = wrap(kStem + '來られる', rStem + 'こられる'); f.passive = wrap(kStem + '來られる', rStem + 'こられる');
                    f.causative = wrap(kStem + '來させる', rStem + 'こさせる'); f.causativePassive = wrap(kStem + '來させられる', rStem + 'こさせられる');
                }
            }
            return f;
        }

                        <td class="p-3 text-center japanese-text text-fuchsia-600 border-r border-slate-100 text-[10px] leading-tight">${formatRuby(f.causativePassive)}</td>

        function formatRuby(text) {
            if (!text || typeof text !== 'string') return text;
            const match = text.match(/^(.+)\s*\((.+)\)$/);
            if (match) {
                let kanji = match[1].trim();
                let reading = match[2].trim();
                let suffixLen = 0;
                while (suffixLen < kanji.length && suffixLen < reading.length &&
                       kanji[kanji.length - 1 - suffixLen] === reading[reading.length - 1 - suffixLen] &&
                       /[\u3040-\u309F\u30A0-\u30FF]/.test(kanji[kanji.length - 1 - suffixLen])) {
                    suffixLen++;
                }
                if (suffixLen > 0) {
                    return `<ruby>${kanji.slice(0, -suffixLen)}<rt>${reading.slice(0, -suffixLen)}</rt></ruby>${kanji.slice(-suffixLen)}`;
                }
                return `<ruby>${kanji}<rt>${reading}</rt></ruby>`;
            }
            return text.replace(/([^\u3040-\u309F\u30A0-\u30FF\s]+)\s*\(([\u3040-\u309F\u30A0-\u30FF\s]+)\)/g, '<ruby>$1<rt>$2</rt></ruby>');
        }

        function toggleMastered(id) {
            const index = masteredIds.indexOf(id);
            if (index > -1) {
                masteredIds.splice(index, 1);
            } else {
                masteredIds.push(id);
            }
            saveAndRefresh(id);
        }

        function saveAndRefresh(id) {
            localStorage.setItem('verbs_mastery', JSON.stringify(masteredIds));
            localStorage.setItem('learning_jp_last_modified', Date.now());

            if (id) {
                const el = document.querySelector(`[data-id="${id}"]`);
                if (el) {
                    const isM = masteredIds.includes(id);
                    el.classList.toggle('is-mastered', isM);
                    el.classList.toggle('mastered', isM);
                    const cb = el.querySelector('input[type="checkbox"]');
                    if (cb) cb.checked = isM;
                }
            } else {
                renderVerbs();
            }

            updateProgress();
            if (window.triggerAutoSync) triggerAutoSync();
        }

        function updateProgress() {
            const total = Object.values(verbsData).flat().length;
            const current = masteredIds.length;
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

            const allVerbs = [...verbsData.g1, ...verbsData.g2, ...verbsData.g3];
            const pool = allVerbs.filter(v => !masteredIds.includes(v.id));

            if (pool.length === 0) {
                document.getElementById('fc-question').innerText = "🎉 已全部掌握！";

                document.getElementById('fc-feedback').classList.add('hidden');

                return;
            }

            currentVerbFC = pool[Math.floor(Math.random() * pool.length)];
            document.getElementById('fc-question').innerHTML = formatRuby(currentVerbFC.dictionary);
            document.getElementById('fc-options').classList.remove('hidden');
            document.getElementById('fc-feedback').classList.add('hidden');
            document.getElementById('fc-next').classList.add('hidden');
        }

        function submitVerbFC(choice) {
            if (!currentVerbFC) return;
            const isCorrect = choice === currentVerbFC.group;
            const id = currentVerbFC.id;

            if (!verbScores[id]) verbScores[id] = 0;

            if (isCorrect) {
                verbScores[id] += 5;
            } else {
                verbScores[id] = Math.floor(verbScores[id] / 2);
            }

            localStorage.setItem('verbs_scores', JSON.stringify(verbScores));

            const resultMsg = document.getElementById('fc-result-msg');
            if (isCorrect) {
                resultMsg.innerText = "✨ 太棒了！答對了";
                resultMsg.className = "text-center font-bold text-lg mb-4 text-emerald-600";
            } else if (choice === 'unknown') {
                resultMsg.innerText = "📚 沒關係，再接再厲";
                resultMsg.className = "text-center font-bold text-lg mb-4 text-slate-500";
            } else {
                resultMsg.innerText = "❌ 答錯囉，加油！";
                resultMsg.className = "text-center font-bold text-lg mb-4 text-red-500";
            }

            const groupNames = { "g1": "第一類動詞 (五段)", "g2": "第二類動詞 (一段)", "g3": "第三類動詞 (不規則)" };
            document.getElementById('fc-correct-group').innerText = groupNames[currentVerbFC.group];
            document.getElementById('fc-meaning').innerText = currentVerbFC.meaning;

            document.getElementById('fc-options').classList.add('hidden');
            document.getElementById('fc-feedback').classList.remove('hidden');
            document.getElementById('fc-next').classList.remove('hidden');

            if (verbScores[id] >= 10) {
                if (!masteredIds.includes(id)) {
                    masteredIds.push(id);
                    saveAndRefresh(id);
                }
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById(`tab-btn-${tab}`);
            if (activeBtn) activeBtn.classList.add('tab-active');

            if (tab === 'fc') {
                document.getElementById('verb-content').classList.add('hidden');
                document.getElementById('section-flashcard').classList.remove('hidden');
                loadNextVerbFC();
            } else {
                document.getElementById('verb-content').classList.remove('hidden');
                document.getElementById('section-flashcard').classList.add('hidden');
                renderVerbs();
            }
        }

        function closeModal() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmReset() { masteredIds = []; saveAndRefresh(); closeModal(); }

        window.onload = init;
    </script>
